<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>音效试听</title>
<style>
:root { --bg:#0f172a; --card:#1e293b; --border:#334155; --accent:#38bdf8; --text:#f8fafc; --muted:#94a3b8; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; padding:2rem; }
h1 { color:var(--accent); margin-bottom:0.5rem; }
.sub { color:var(--muted); font-size:0.9rem; margin-bottom:2rem; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1rem; }
.card { background:var(--card); border:1px solid var(--border); border-radius:0.75rem; padding:1rem; }
.card-title { font-weight:600; margin-bottom:0.25rem; }
.card-desc { font-size:0.8rem; color:var(--muted); margin-bottom:0.75rem; }
.btn-row { display:flex; gap:0.5rem; }
button { background:var(--accent); color:#0f172a; border:none; padding:0.4rem 0.9rem;
  border-radius:0.4rem; cursor:pointer; font-size:0.85rem; font-weight:600; }
button.sec { background:var(--card); color:var(--muted); border:1px solid var(--border); }
button:hover { opacity:0.85; }
#copy-tip { margin-top:1rem; color:#4ade80; font-size:0.85rem; min-height:1.2em; }
</style>
</head>
<body>
<h1>音效试听器</h1>
<p class="sub">点击"试听"选择喜欢的音效，再点"复制代码"发给我替换到 my_nav.html。</p>
<div style="margin-bottom:1.5rem;">
  <button onclick="generateRandom()" style="font-size:1rem;padding:0.6rem 1.5rem;">🎲 随机生成20个新音效</button>
</div>
<div id="copy-tip"></div>
<div class="grid" id="grid"></div>

<script>
let ctx = null;
function getCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  return ctx;
}

const sounds = [
  {
    name: '1. 清脆短叮',
    desc: '高频正弦，极短衰减',
    play: (c) => {
      const t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type='sine'; o.frequency.value=2500;
      g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
      o.start(t); o.stop(t+0.15);
    }
  },
  {
    name: '2. 木琴点击',
    desc: '中频正弦，温和衰减',
    play: (c) => {
      const t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type='sine'; o.frequency.setValueAtTime(880,t);
      o.frequency.exponentialRampToValueAtTime(660,t+0.1);
      g.gain.setValueAtTime(0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
      o.start(t); o.stop(t+0.3);
    }
  },
  {
    name: '3. 气泡冒出',
    desc: '低频上扬，圆润',
    play: (c) => {
      const t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type='sine'; o.frequency.setValueAtTime(400,t);
      o.frequency.exponentialRampToValueAtTime(900,t+0.12);
      g.gain.setValueAtTime(0.2,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
      o.start(t); o.stop(t+0.2);
    }
  },
  {
    name: '4. 三角波叮',
    desc: '三角波，柔和清亮',
    play: (c) => {
      const t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type='triangle'; o.frequency.value=1800;
      g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
      o.start(t); o.stop(t+0.35);
    }
  },
  {
    name: '5. 双音和弦',
    desc: '两个频率同时，协和音程',
    play: (c) => {
      const t = c.currentTime;
      [[1320,0.18],[1760,0.12]].forEach(([f,v]) => {
        const o = c.createOscillator(), g = c.createGain();
        o.connect(g); g.connect(c.destination);
        o.type='sine'; o.frequency.value=f;
        g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4);

    name: '6. 钢琴单音',

        const o = c.createOscillator(), g = c.createGain();

        o.start(t); o.stop(t+d);

    name: '7. 铃铛高音',

    play: (c) => {

      const t = c.currentTime;

    name: '11. 星光闪烁',
    desc: '三个递进高音，像星星闪',
    play: (c) => {
      const t = c.currentTime;
      [[1047,0],[1319,0.06],[1568,0.12]].forEach(([f,delay]) => {
        const o=c.createOscillator(),g=c.createGain();

  {
    name: '12. 玻璃碰撞',
    desc: '高频+轻微失真感',
    play: (c) => {
      const t = c.currentTime;
      [[3136,0.15,0.1],[1568,0.2,0.3],[784,0.1,0.5]].forEach(([f,v,d]) => {
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
        o.start(t);o.stop(t+d);
      });
    }
  },
  {
    name: '13. 竹管风铃',
    desc: '中低频，带余韵',
    play: (c) => {
      const t = c.currentTime;
      [[660,0.2,0.6],[990,0.12,0.4]].forEach(([f,v,d]) => {
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='triangle';o.frequency.value=f;
        g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
        o.start(t);o.stop(t+d);
      });
    }
  },
  {
    name: '14. 通知提示音',
    desc: '两个音先后响，像消息通知',
    play: (c) => {
      const t = c.currentTime;
      [[880,0,0.2],[1108,0.15,0.2]].forEach(([f,delay,d]) => {
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(0.2,t+delay);
        g.gain.exponentialRampToValueAtTime(0.001,t+delay+d);
        o.start(t+delay);o.stop(t+delay+d);
      });
    }
  },
  {
    name: '15. 超短卡嗒',
    desc: '极短冲击，机械感',
    play: (c) => {
      const t = c.currentTime;
      const o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type='sine';o.frequency.value=1200;
      g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.05);
      o.start(t);o.stop(t+0.05);
    }

  {
    name: '16. 银铃摇响',
    desc: '快速频率抖动，银铃感',
    play: (c) => {
      const t = c.currentTime;
      const o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type='sine';o.frequency.setValueAtTime(2000,t);
      o.frequency.setValueAtTime(2200,t+0.02);
      o.frequency.setValueAtTime(2000,t+0.04);
      o.frequency.setValueAtTime(2200,t+0.06);
      o.frequency.setValueAtTime(2000,t+0.08);
      g.gain.setValueAtTime(0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);
      o.start(t);o.stop(t+0.3);
    }
  },
  {
    name: '17. 悠扬长音',
    desc: '慢慢衰减，像远处的钟声',
    play: (c) => {
      const t = c.currentTime;
      [[440,0.15,1.2],[880,0.1,0.8],[1320,0.05,0.5]].forEach(([f,v,d]) => {
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
        o.start(t);o.stop(t+d);
      });
    }

  {
    name: '18. 游戏金币',
    desc: '上扬音调，像收集金币',

      const o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type='square';
      o.frequency.setValueAtTime(988,t);
      o.frequency.setValueAtTime(1319,t+0.08);
      o.frequency.setValueAtTime(1568,t+0.16);
      g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
      o.start(t);o.stop(t+0.35);
    }
  },
  {
    name: '19. 轻敲木鱼',
    desc: '中频三角波，禅意',
    play: (c) => {
      const t = c.currentTime;
      const o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type='triangle';o.frequency.value=600;
      g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
      o.start(t);o.stop(t+0.4);
    }
  },
  {
    name: '20. 水晶三连音',
    desc: '三个极高频短音连发',
    play: (c) => {
      const t = c.currentTime;
      [[2637,0],[3136,0.07],[3729,0.14]].forEach(([f,delay]) => {
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(0.15,t+delay);
        g.gain.exponentialRampToValueAtTime(0.001,t+delay+0.15);
        o.start(t+delay);o.stop(t+delay+0.15);
      });
    }
  }
];

const grid = document.getElementById('grid');
sounds.forEach((s, idx) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-title">${s.name}</div>
    <div class="card-desc">${s.desc}</div>
    <div class="btn-row">
      <button onclick="playSound(${idx})">▶ 试听</button>
      <button class="sec" onclick="copyCode(${idx})">复制代码</button>
    </div>
  `;
  grid.appendChild(card);
});

function playSound(idx) {
  const c = getCtx();
  sounds[idx].play(c);
}

function copyCode(idx) {
  const fn = sounds[idx].play.toString();
  // 提取函数体
  const body = fn.replace(/^\(c\)\s*=>\s*\{/, '').replace(/\s*\}$/, '').trim();
  const code = `function playDing() {\n        if (!soundToggle.checked) return;\n        try {\n            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n            const c = audioCtx;\n            ${body}\n        } catch(e) {}\n    }`;
  navigator.clipboard.writeText(code).then(() => {
    document.getElementById('copy-tip').textContent = `✓ 已复制「${sounds[idx].name}」的代码，发给 Kiro 替换即可`;
  });
}

// ── 随机生成 ──────────────────────────────────────────────
function rnd(min, max) { return min + Math.random() * (max - min); }
function rndInt(min, max) { return Math.floor(rnd(min, max)); }
function rndChoice(arr) { return arr[rndInt(0, arr.length)]; }

function makeRandomSound(n) {
  const types = ['sine','triangle','sine','sine'];
  const style = rndInt(0, 6);
  const name = `R${n}`;

  if (style === 0) {
    // 单音快速衰减
    const freq = rnd(800, 3500);
    const dur = rnd(0.1, 0.5);
    const vol = rnd(0.15, 0.35);
    const wt = rndChoice(types);
    return {
      name: `${name}. 单音 ${Math.round(freq)}Hz`,
      desc: `${wt}，衰减${dur.toFixed(2)}s`,
      play: new Function('c', `
        const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='${wt}';o.frequency.value=${freq};
        g.gain.setValueAtTime(${vol},t);g.gain.exponentialRampToValueAtTime(0.001,t+${dur});
        o.start(t);o.stop(t+${dur});`)
    };
  } else if (style === 1) {
    // 滑音
    const f1 = rnd(400, 2500), f2 = rnd(400, 3500);
    const dur = rnd(0.1, 0.4);
    return {
      name: `${name}. 滑音 ${Math.round(f1)}→${Math.round(f2)}Hz`,
      desc: `频率滑动，${dur.toFixed(2)}s`,
      play: new Function('c', `
        const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
        o.connect(g);g.connect(c.destination);
        o.type='sine';o.frequency.setValueAtTime(${f1},t);
        o.frequency.exponentialRampToValueAtTime(${f2},t+${dur});
        g.gain.setValueAtTime(0.22,t);g.gain.exponentialRampToValueAtTime(0.001,t+${dur});
        o.start(t);o.stop(t+${dur});`)
    };
  } else if (style === 2) {
    // 双音和弦
    const f1 = rnd(600, 2000), f2 = f1 * rndChoice([1.25, 1.5, 2]);
    const dur = rnd(0.2, 0.6);
    return {
      name: `${name}. 和弦 ${Math.round(f1)}+${Math.round(f2)}Hz`,
      desc: `双音叠加，${dur.toFixed(2)}s`,
      play: new Function('c', `
        const t=c.currentTime;
        [[${f1},0.18],[${f2},0.12]].forEach(([f,v])=>{
          const o=c.createOscillator(),g=c.createGain();
          o.connect(g);g.connect(c.destination);
          o.type='sine';o.frequency.value=f;
          g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+${dur});
          o.start(t);o.stop(t+${dur});
        });`)
    };
  } else if (style === 3) {
    // 递进三音
    const f1 = rnd(600,1500), step = rndChoice([1.2,1.25,1.33,1.5]);
    const f2 = f1*step, f3 = f2*step;
    const gap = rnd(0.04, 0.1);
    return {
      name: `${name}. 三连音`,
      desc: `递进三音，间隔${gap.toFixed(2)}s`,
      play: new Function('c', `
        const t=c.currentTime;
        [[${f1},0],[${f2},${gap}],[${f3},${gap*2}]].forEach(([f,d])=>{
          const o=c.createOscillator(),g=c.createGain();
          o.connect(g);g.connect(c.destination);
          o.type='sine';o.frequency.value=f;
          g.gain.setValueAtTime(0.18,t+d);g.gain.exponentialRampToValueAtTime(0.001,t+d+0.2);
          o.start(t+d);o.stop(t+d+0.2);
        });`)
    };
  } else if (style === 4) {
    // 泛音列
    const base = rnd(300, 800);
    const dur1=rnd(0.4,0.9), dur2=rnd(0.2,0.5), dur3=rnd(0.1,0.3);
    return {
      name: `${name}. 泛音 ${Math.round(base)}Hz`,
      desc: `基频+2次+4次泛音`,
      play: new Function('c', `
        const t=c.currentTime;
        [[${base},0.25,${dur1}],[${base*2},0.12,${dur2}],[${base*4},0.06,${dur3}]].forEach(([f,v,d])=>{
          const o=c.createOscillator(),g=c.createGain();
          o.connect(g);g.connect(c.destination);
          o.type='sine';o.frequency.value=f;
          g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
          o.start(t);o.stop(t+d);
        });`)
    };
  } else {
    // 通知双音
    const f1=rnd(600,1200), f2=f1*rndChoice([1.2,1.33,1.5,2]);
    const delay=rnd(0.1,0.2), dur=rnd(0.15,0.3);
    return {
      name: `${name}. 通知 ${Math.round(f1)}→${Math.round(f2)}`,
      desc: `两音先后，间隔${delay.toFixed(2)}s`,
      play: new Function('c', `
        const t=c.currentTime;
        [[${f1},0,${dur}],[${f2},${delay},${dur}]].forEach(([f,dl,d])=>{
          const o=c.createOscillator(),g=c.createGain();
          o.connect(g);g.connect(c.destination);
          o.type='sine';o.frequency.value=f;
          g.gain.setValueAtTime(0.2,t+dl);g.gain.exponentialRampToValueAtTime(0.001,t+dl+d);
          o.start(t+dl);o.stop(t+dl+d);
        });`)
    };
  }
}

let randomSounds = [];

function generateRandom() {
  randomSounds = Array.from({length:20}, (_,i) => makeRandomSound(i+1));
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  randomSounds.forEach((s, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-title">${s.name}</div>
      <div class="card-desc">${s.desc}</div>
      <div class="btn-row">
        <button onclick="playRandom(${idx})">▶ 试听</button>
        <button class="sec" onclick="copyRandom(${idx})">复制代码</button>
      </div>
    `;
    grid.appendChild(card);
  });
  document.getElementById('copy-tip').textContent = '已生成20个随机音效，点击试听选择喜欢的';
}

function playRandom(idx) { randomSounds[idx].play(getCtx()); }

function copyRandom(idx) {
  const s = randomSounds[idx];
  const body = s.play.toString().replace(/^function anonymous\(c\)\s*\{?\n?/, '').replace(/\n?\}$/, '').trim();
  const code = `function playDing() {\n        if (!soundToggle.checked) return;\n        try {\n            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();\n            const c = audioCtx;\n            ${body}\n        } catch(e) {}\n    }`;
  navigator.clipboard.writeText(code).then(() => {
    document.getElementById('copy-tip').textContent = `✓ 已复制「${s.name}」代码，发给 Kiro 替换即可`;
  });
}
</script>
</body>
