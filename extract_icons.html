<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>提取图标工具</title>
<style>
:root { --bg:#0f172a; --card:#1e293b; --border:#334155; --accent:#38bdf8; --text:#f8fafc; --muted:#94a3b8; --green:#4ade80; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; padding:2rem; }
h1 { color:var(--accent); margin-bottom:0.5rem; }
.sub { color:var(--muted); font-size:0.9rem; margin-bottom:2rem; }
.toolbar { display:flex; gap:1rem; align-items:center; flex-wrap:wrap; margin-bottom:2rem; }
input[type=file] { display:none; }
button, label.btn { background:var(--accent); color:var(--bg); border:none; padding:0.5rem 1.2rem;
  border-radius:0.5rem; cursor:pointer; font-size:0.9rem; font-weight:600; }
button.sec { background:var(--card); color:var(--text); border:1px solid var(--border); }
button:hover, label.btn:hover { opacity:0.85; }
#status { color:var(--green); font-size:0.85rem; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:1rem; }
.icon-card { background:var(--card); border:1px solid var(--border); border-radius:0.75rem;
  padding:0.75rem; text-align:center; cursor:pointer; transition:border .2s; }
.icon-card:hover { border-color:var(--accent); }
.icon-card.selected { border-color:var(--green); background:#0f2a1a; }
.icon-card img { width:48px; height:48px; object-fit:contain; background:#fff;
  border-radius:0.4rem; padding:2px; display:block; margin:0 auto 0.5rem; }
.icon-card .no-icon { width:48px; height:48px; display:flex; align-items:center;
  justify-content:center; font-size:1.5rem; margin:0 auto 0.5rem; }
.icon-card .title { font-size:0.7rem; color:var(--muted); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.icon-card .url { font-size:0.65rem; color:var(--accent); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; margin-top:0.2rem; }
</style>
</head>
<body>

<h1>图标提取工具</h1>
<p class="sub">加载带有 base64 图标的 my_nav.html，一键提取所有图标并导出 icons.js，可供 nav_editor.html 使用。</p>

<div class="toolbar">
  <label class="btn" for="file-input">📂 加载 my_nav.html</label>
  <input type="file" id="file-input" accept=".html">
  <button class="sec" id="select-all-btn" onclick="selectAll()" disabled>全选</button>
  <button class="sec" id="deselect-btn" onclick="deselectAll()" disabled>全不选</button>
  <button id="export-btn" onclick="exportIcons()" disabled>💾 导出 icons.js</button>
  <span id="status"></span>
</div>

<div id="grid" class="grid"></div>

<script>
let items = [];
let selected = new Set();

document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const html = ev.target.result;
    const startTag = html.indexOf('id="data"');
    if (startTag === -1) { alert('未找到数据块'); return; }
    const dataStart = html.indexOf('>', startTag) + 1;
    const dataEnd = html.indexOf('<\/script>', dataStart);
    let navData;
    try { navData = JSON.parse(html.slice(dataStart, dataEnd).trim()); }
    catch(err) { alert('解析失败: ' + err.message); return; }

    items = [];
    (navData.categories || []).forEach(cat => {
      cat.items.forEach(item => {
        items.push({ url: item.url, title: item.title, icon: item.icon || '' });
      });
    });

    const withIcon = items.filter(i => i.icon && i.icon.startsWith('data:')).length;
    setStatus(`加载完成：${items.length} 个书签，其中 ${withIcon} 个有图标`);
    selected = new Set(items.filter(i => i.icon && i.icon.startsWith('data:')).map((_, idx) => idx));
    render();
    document.getElementById('select-all-btn').disabled = false;
    document.getElementById('deselect-btn').disabled = false;
    document.getElementById('export-btn').disabled = false;
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
});

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  items.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'icon-card' + (selected.has(idx) ? ' selected' : '');
    card.onclick = () => { selected.has(idx) ? selected.delete(idx) : selected.add(idx); render(); };

    if (item.icon && item.icon.startsWith('data:')) {
      const img = document.createElement('img');
      img.src = item.icon;
      img.alt = '';
      card.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'no-icon';
      ph.textContent = '🔗';
      card.appendChild(ph);
    }

    const titleEl = document.createElement('div');
    titleEl.className = 'title';
    titleEl.textContent = item.title;
    titleEl.title = item.title;

    const urlEl = document.createElement('div');
    urlEl.className = 'url';
    urlEl.textContent = item.url;
    urlEl.title = item.url;

    card.append(titleEl, urlEl);
    grid.appendChild(card);
  });
  setStatus(`已选 ${selected.size} 个图标`);
}

function selectAll() {
  selected = new Set(items.map((_, i) => i));
  render();
}

function deselectAll() {
  selected = new Set();
  render();
}

function exportIcons() {
  const icons = {};
  selected.forEach(idx => {
    const item = items[idx];
    if (item.icon && item.icon.startsWith('data:')) {
      icons[item.url] = item.icon;
    }
  });
  if (Object.keys(icons).length === 0) { alert('没有选中任何有图标的书签'); return; }
  const js = 'window.__NAV_ICONS__ = ' + JSON.stringify(icons) + ';';
  const blob = new Blob([js], { type: 'application/javascript;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'icons.js';
  a.click();
  URL.revokeObjectURL(a.href);
  setStatus(`✓ 已导出 icons.js，共 ${Object.keys(icons).length} 个图标`);
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }
</script>
</body>
</html>
