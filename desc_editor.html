<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>悬停介绍编辑器</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --border: #334155;
    --accent: #38bdf8; --text: #f8fafc; --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 2rem; }
  
  h1 { color: var(--accent); margin-bottom: 0.5rem; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; line-height: 1.6; }

  .toolbar { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; align-items: center; }
  .toolbar input[type=file] { display: none; }
  button, label.btn {
    background: var(--accent); color: var(--bg); border: none;
    padding: 0.5rem 1.2rem; border-radius: 0.5rem; cursor: pointer;
    font-size: 0.9rem; font-weight: 600; transition: opacity 0.2s;
  }
  button:hover, label.btn:hover { opacity: 0.85; }
  button.sec { background: var(--card); color: var(--text); border: 1px solid var(--border); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #status { color: #4ade80; font-size: 0.85rem; margin-left: auto; }

  /* 首页：板块横排 */
  #home-view { display: block; }
  #home-view.hidden { display: none; }
  .cats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1rem; margin-top: 1rem; }
  .cat-card { background: var(--card); border: 2px solid var(--border);
    border-radius: 0.75rem; padding: 1.5rem; cursor: pointer; text-align: center;
    transition: all 0.2s; }
  .cat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .cat-card-title { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 0.5rem; }
  .cat-card-count { font-size: 0.85rem; color: var(--muted); }
  .cat-card-status { font-size: 0.75rem; color: #4ade80; margin-top: 0.5rem; }

  /* 详情页：板块内容 */
  #detail-view { display: none; }
  #detail-view.show { display: block; }
  .detail-header { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 2px solid var(--border); }
  .detail-title-wrap { display: flex; align-items: center; gap: 1rem; }
  .back-btn { background: var(--card); color: var(--muted); border: 1px solid var(--border);
    padding: 0.4rem 0.8rem; font-size: 0.9rem; cursor: pointer; border-radius: 0.5rem; }
  .back-btn:hover { color: var(--text); border-color: var(--accent); }
  .detail-title { font-size: 1.3rem; font-weight: 600; color: var(--accent); }
  .detail-count { font-size: 0.9rem; color: var(--muted); margin-left: 0.5rem; }
  .detail-actions { display: flex; gap: 0.75rem; }

  .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
  .item-card { background: var(--bg); border: 2px solid var(--border);
    border-radius: 0.75rem; padding: 1rem; transition: all 0.2s; }
  .item-card:hover { border-color: var(--muted); }
  .item-card.changed { border-color: #4ade80; }
  
  .item-header { display: flex; align-items: start; gap: 0.75rem; margin-bottom: 0.75rem;
    padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
  .item-id { color: var(--accent); font-weight: 700; font-size: 1.1rem; 
    flex-shrink: 0; min-width: 40px; }
  .item-info { flex: 1; min-width: 0; }
  .item-title { font-weight: 600; margin-bottom: 0.3rem; font-size: 0.9rem; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .item-url { color: var(--muted); font-size: 0.7rem; line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
  
  .desc-input { width: 100%; padding: 0.5rem 0.75rem; font-size: 0.85rem;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 0.4rem; resize: vertical; min-height: 70px; font-family: inherit; line-height: 1.5; }
  .desc-input:focus { outline: none; border-color: var(--accent); }
  .desc-input.changed { border-color: #4ade80; }

  #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    z-index: 999; align-items: center; justify-content: center; }
  #modal.show { display: flex; }
  .modal-box { background: var(--card); border: 1px solid var(--border);
    border-radius: 0.75rem; padding: 1.5rem; max-width: 700px; width: 90%; max-height: 80vh;
    overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
  .modal-title { font-size: 1.1rem; font-weight: 600; }
  .modal-close { cursor: pointer; font-size: 1.5rem; color: var(--muted); }
  .modal-close:hover { color: var(--text); }
  
  textarea.prompt-area { width: 100%; height: 300px; padding: 1rem; font-size: 0.85rem;
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 0.5rem; font-family: 'Consolas', monospace; resize: vertical; }
  textarea.prompt-area:focus { outline: none; border-color: var(--accent); }
  
  .modal-actions { display: flex; gap: 0.75rem; margin-top: 1rem; justify-content: flex-end; }
  
  .help-text { color: var(--muted); font-size: 0.8rem; line-height: 1.5; margin-top: 0.5rem; }
  .example { background: var(--bg); padding: 0.75rem; border-radius: 0.4rem;
    font-family: 'Consolas', monospace; font-size: 0.8rem; margin-top: 0.5rem;
    border: 1px solid var(--border); color: var(--muted); }
</style>
</head>
<body>

<h1>悬停介绍编辑器</h1>
<p class="sub">
  加载 my_nav.html，点击板块进入，生成提示词交给网页 AI，再合并结果。介绍 50-80 字，突出网站用途和功能。
</p>

<div class="toolbar">
  <label class="btn" for="file-input">📂 加载 my_nav.html</label>
  <input type="file" id="file-input" accept=".html">
  <button class="sec" onclick="exportFile()">💾 导出完整文件</button>
  <span id="status"></span>
</div>

<!-- 首页：板块选择 -->
<div id="home-view">
  <div id="cats-grid" class="cats-grid"></div>
</div>

<!-- 详情页：板块内容 -->
<div id="detail-view">
  <div class="detail-header">
    <div class="detail-title-wrap">
      <button class="back-btn" onclick="backToHome()">← 返回</button>
      <span class="detail-title" id="detail-title"></span>
      <span class="detail-count" id="detail-count"></span>
    </div>
    <div class="detail-actions">
      <button onclick="generatePrompt()">📝 导出提示词</button>
      <button onclick="showPasteArea()">📥 合并内容</button>
      <button class="sec" onclick="resetCurrentCategory()">重置本板块</button>
    </div>
  </div>
  <div id="detail-grid" class="items-grid"></div>
</div>

<!-- 提示词弹窗 -->
<div id="modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">生成的提示词</div>
      <span class="modal-close" onclick="closeModal()">&times;</span>
    </div>
    <p class="help-text">复制下方内容，粘贴到网页 AI（如 ChatGPT、Gemini、Claude），获取结果后点击下方"粘贴 AI 结果"按钮。</p>
    <textarea id="prompt-output" class="prompt-area" readonly></textarea>
    <div class="modal-actions">
      <button onclick="copyPrompt()">📋 复制到剪贴板</button>
      <button class="sec" onclick="showPasteArea()">📥 粘贴 AI 结果</button>
    </div>
  </div>
</div>

<!-- 粘贴结果弹窗 -->
<div id="paste-modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">粘贴 AI 返回结果</div>
      <span class="modal-close" onclick="closePasteModal()">&times;</span>
    </div>
    <p class="help-text">将 AI 返回的内容粘贴到下方，工具会自动按编号匹配并更新介绍。</p>
    <div class="example">示例格式：<br>R1: 免费高清视频素材库，提供无版权限制的...<br>R2: 图片和视频搜索引擎，提供免费...</div>
    <textarea id="paste-input" class="prompt-area" placeholder="粘贴 AI 结果..."></textarea>
    <div class="modal-actions">
      <button onclick="closePasteModal()">取消</button>
      <button onclick="applyAIResult()">✓ 应用到当前板块</button>
    </div>
  </div>
</div>

<script>
let navData = null;
let rawHtml = '';
let changes = {};  // key = "catIndex_itemIndex", value = newDesc
let currentCatIndex = -1;

document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    rawHtml = ev.target.result;
    const m = rawHtml.match(/<script[^>]+id="data"[^>]*>([\s\S]*?)<\/script>/);
    if (!m) { alert('未找到数据块，请确认是由 app.py 生成的 my_nav.html'); return; }
    try {
      navData = JSON.parse(m[1].trim());
    } catch(err) {
      alert('JSON 解析失败: ' + err.message);
      return;
    }
    changes = {};
    renderHomeView();
    setStatus(`已加载 ${file.name}，共 ${navData.categories.length} 个板块`);
  };
  reader.readAsText(file, 'utf-8');
});

function renderHomeView() {
  const grid = document.getElementById('cats-grid');
  grid.innerHTML = '';
  
  navData.categories.forEach((cat, ci) => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    card.onclick = () => enterCategory(ci);
    
    const title = document.createElement('div');
    title.className = 'cat-card-title';
    title.textContent = cat.title;
    
    const count = document.createElement('div');
    count.className = 'cat-card-count';
    count.textContent = `${cat.items.length} 个链接`;
    
    // 统计已修改数量
    const changedCount = cat.items.filter((_, ii) => changes[`${ci}_${ii}`] !== undefined).length;
    const status = document.createElement('div');
    status.className = 'cat-card-status';
    if (changedCount > 0) {
      status.textContent = `✓ 已修改 ${changedCount} 条`;
    }
    
    card.append(title, count, status);
    grid.appendChild(card);
  });
}

function enterCategory(ci) {
  currentCatIndex = ci;
  const cat = navData.categories[ci];
  
  document.getElementById('detail-title').textContent = cat.title;
  document.getElementById('detail-count').textContent = `(${cat.items.length} 项)`;
  
  const grid = document.getElementById('detail-grid');
  grid.innerHTML = '';
  cat.items.forEach((item, ii) => {
    grid.appendChild(makeItemRow(item, ci, ii, cat.title));
  });
  
  document.getElementById('home-view').classList.add('hidden');
  document.getElementById('detail-view').classList.add('show');
}

function backToHome() {
  document.getElementById('detail-view').classList.remove('show');
  document.getElementById('home-view').classList.remove('hidden');
  renderHomeView();  // 刷新状态显示
  currentCatIndex = -1;
}

function makeItemRow(item, ci, ii, catTitle) {
  const key = `${ci}_${ii}`;
  const currentDesc = changes[key] !== undefined ? changes[key] : (item.hover || '');
  const isChanged = changes[key] !== undefined;
  
  const card = document.createElement('div');
  card.className = 'item-card' + (isChanged ? ' changed' : '');
  card.dataset.key = key;
  
  // 卡片头部：编号 + 标题 + URL
  const header = document.createElement('div');
  header.className = 'item-header';
  
  const id = document.createElement('div');
  id.className = 'item-id';
  id.textContent = getCatPrefix(catTitle) + (ii + 1);
  
  const info = document.createElement('div');
  info.className = 'item-info';
  
  const titleEl = document.createElement('div');
  titleEl.className = 'item-title';
  titleEl.textContent = item.title;
  titleEl.title = item.title;
  
  const urlEl = document.createElement('div');
  urlEl.className = 'item-url';
  urlEl.textContent = item.url;
  urlEl.title = item.url;
  
  info.append(titleEl, urlEl);
  header.append(id, info);
  
  // 介绍输入框
  const textarea = document.createElement('textarea');
  textarea.className = 'desc-input' + (isChanged ? ' changed' : '');
  textarea.placeholder = '悬停介绍（50-80字，描述网站用途和功能）';
  textarea.value = currentDesc;
  textarea.addEventListener('input', () => {
    const newVal = textarea.value.trim();
    const origVal = (item.hover || '').trim();
    if (newVal === origVal) {
      delete changes[key];
      card.classList.remove('changed');
      textarea.classList.remove('changed');
    } else {
      changes[key] = newVal;
      card.classList.add('changed');
      textarea.classList.add('changed');
    }
  });
  
  card.append(header, textarea);
  return card;
}

function getCatPrefix(catTitle) {
  const ci = navData.categories.findIndex(c => c.title === catTitle);
  return `C${ci + 1}-`;
}

function generatePrompt() {
  if (currentCatIndex < 0) {
    alert('请先选择板块');
    return;
  }
  
  const cat = navData.categories[currentCatIndex];
  const prefix = getCatPrefix(cat.title);
  
  let prompt = `请帮我搜索以下网站，用不少于50字的中文介绍每个网站的用途和核心功能。\n`;
  prompt += `要求：务实、简洁、突出功能，不要营销话术。\n`;
  prompt += `严格按以下格式返回（编号+冒号+空格+介绍），不要添加其他内容：\n\n`;
  
  cat.items.forEach((item, ii) => {
    const id = prefix + (ii + 1);
    prompt += `${id}: 标题《${item.title}》 网址：${item.url}\n`;
  });
  
  prompt += `\n请严格按 "${prefix}1: 介绍内容" 格式返回，每行一个。`;
  
  document.getElementById('prompt-output').value = prompt;
  document.getElementById('modal').classList.add('show');
}

function copyPrompt() {
  const textarea = document.getElementById('prompt-output');
  textarea.select();
  navigator.clipboard.writeText(textarea.value).then(() => {
    setStatus('✓ 已复制到剪贴板，去粘贴给网页 AI 吧');
  });
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function showPasteArea() {
  closeModal();
  document.getElementById('paste-input').value = '';
  document.getElementById('paste-modal').classList.add('show');
}

function closePasteModal() {
  document.getElementById('paste-modal').classList.remove('show');
}

function applyAIResult() {
  const text = document.getElementById('paste-input').value.trim();
  if (!text) {
    alert('请粘贴 AI 返回的内容');
    return;
  }
  
  if (currentCatIndex < 0) {
    alert('未选择板块');
    return;
  }
  
  const cat = navData.categories[currentCatIndex];
  const prefix = getCatPrefix(cat.title);
  
  // 按行解析，匹配 "R1: 介绍" 或 "R1：介绍" 或 "R1. 介绍"
  const lines = text.split('\n');
  let matched = 0;
  
  lines.forEach(line => {
    // 宽松匹配：C4-1: 或 C4_1: 或 C4-1： 等各种变体
    const m = line.match(/^(C\d+[-_]\d+)[\s:：.\-]*(.+)$/);
    if (!m) return;
    
    const [_, id, desc] = m;
    // 统一转换为连字符后比较
    const normId = id.replace('_', '-');
    if (!normId.startsWith(prefix)) return;
    
    const ii = parseInt(normId.split('-')[1]) - 1;
    if (ii < 0 || ii >= cat.items.length) return;
    
    const key = `${currentCatIndex}_${ii}`;
    const cleanDesc = desc.trim();
    if (cleanDesc) {
      changes[key] = cleanDesc;
      matched++;
    }
  });
  
  if (matched === 0) {
    alert('未匹配到任何内容，请检查格式是否正确');
    return;
  }
  
  // 重新渲染当前板块
  const grid = document.getElementById('detail-grid');
  grid.innerHTML = '';
  cat.items.forEach((item, ii) => {
    grid.appendChild(makeItemRow(item, currentCatIndex, ii, cat.title));
  });
  
  closePasteModal();
  setStatus(`✓ 成功匹配 ${matched} 条介绍`);
}

function resetCurrentCategory() {
  if (currentCatIndex < 0) return;
  
  const cat = navData.categories[currentCatIndex];
  cat.items.forEach((_, ii) => {
    delete changes[`${currentCatIndex}_${ii}`];
  });
  
  const grid = document.getElementById('detail-grid');
  grid.innerHTML = '';
  cat.items.forEach((item, ii) => {
    grid.appendChild(makeItemRow(item, currentCatIndex, ii, cat.title));
  });
  
  setStatus(`已重置 ${cat.title} 板块`);
}

function exportFile() {
  if (!navData || !rawHtml) {
    alert('请先加载文件');
    return;
  }
  if (Object.keys(changes).length === 0) {
    alert('没有任何修改，无需导出');
    return;
  }

  const exportData = JSON.parse(JSON.stringify(navData));
  Object.entries(changes).forEach(([key, newDesc]) => {
    const [ci, ii] = key.split('_').map(Number);
    exportData.categories[ci].items[ii].hover = newDesc;
  });

  // 提取 base64 图标到 icons.js，HTML 里置空
  const icons = {};
  const cleanData = JSON.parse(JSON.stringify(exportData));
  cleanData.categories.forEach(cat => {
    cat.items.forEach(item => {
      if (item.icon && item.icon.startsWith('data:')) {
        icons[item.url] = item.icon;
        item.icon = '';
      }
    });
  });

  // 下载 my_nav.html
  const jsonStr = JSON.stringify(cleanData, null, 2);
  const newHtml = rawHtml.replace(
    /(<script[^>]+id="data"[^>]*>)([\s\S]*?)(<\/script>)/,
    (_, open, _old, close) => `${open}\n${jsonStr}\n${close}`
  );
  const htmlBlob = new Blob([newHtml], { type: 'text/html;charset=utf-8' });
  const a1 = document.createElement('a');
  a1.href = URL.createObjectURL(htmlBlob);
  a1.download = 'my_nav.html';
  a1.click();
  URL.revokeObjectURL(a1.href);

  // 下载 icons.js
  if (Object.keys(icons).length > 0) {
    const iconsJs = 'window.__NAV_ICONS__ = ' + JSON.stringify(icons) + ';';
    const jsBlob = new Blob([iconsJs], { type: 'application/javascript;charset=utf-8' });
    const a2 = document.createElement('a');
    a2.href = URL.createObjectURL(jsBlob);
    a2.download = 'icons.js';
    setTimeout(() => { a2.click(); URL.revokeObjectURL(a2.href); }, 300);
    setStatus(`✓ 已导出 my_nav.html + icons.js，共修改 ${Object.keys(changes).length} 条介绍，两个文件需放同一目录`);
  } else {
    setStatus(`✓ 已导出，共修改 ${Object.keys(changes).length} 条介绍`);
  }
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

// 样式补充
const style = document.createElement('style');
style.textContent = '#paste-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; align-items: center; justify-content: center; } #paste-modal.show { display: flex; }';
document.head.appendChild(style);
</script>

</body>
</html>
