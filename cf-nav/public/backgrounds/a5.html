<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>体积云 Shader 完整版</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: black;
}

canvas {
    position: fixed;
    width: 100vw;
    height: 100vh;
}

/* 控制台 */
#panel {
    position: absolute;
    top: 20px;
    left: 20px;
    width: 260px;
    background: rgba(0,0,0,0.7);
    border-radius: 10px;
    color: white;
    font-family: sans-serif;
    user-select: none;
}

/* 标题栏 */
#header {
    padding: 10px;
    cursor: move;
    background: rgba(255,255,255,0.1);
    border-radius: 10px 10px 0 0;
    display: flex;
    justify-content: space-between;
}

#toggle {
    cursor: pointer;
}

/* 内容 */
#content {
    padding: 10px;
}

label {
    font-size: 12px;
}

input {
    width: 100%;
}
</style>
</head>

<body>

<canvas id="gl"></canvas>

<div id="panel">
    <div id="header">
        <span>⚙️ 控制台</span>
        <span id="toggle">－</span>
    </div>

    <div id="content">
        <label>速度</label>
        <input type="range" id="speed" min="0" max="3" step="0.01" value="1">

        <label>云密度</label>
        <input type="range" id="density" min="0" max="2" step="0.01" value="1">

        <label>云数量</label>
        <input type="range" id="cloudScale" min="0.2" max="3" step="0.01" value="1">

        <label>吸收强度</label>
        <input type="range" id="absorption" min="10" max="200" step="1" value="100">

        <label>天空颜色</label>
        <input type="color" id="color" value="#6666ff">
    </div>
</div>

<script>
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl");

/* ===== 分辨率 ===== */
function resize(){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener("resize", resize);
resize();

/* ===== Shader ===== */
const vs = `
attribute vec2 p;
void main(){ gl_Position = vec4(p,0.,1.); }
`;

const fs = `
precision highp float;

uniform vec2 iResolution;
uniform float iTime;
uniform float uSpeed;
uniform float uDensity;
uniform float uAbsorption;
uniform float uCloudScale;
uniform vec3 uColor;

mat3 m=mat3(0.,0.8,0.6,-0.8,0.36,-0.48,-0.6,-0.48,0.64);

float hash(float n){return fract(sin(n)*43758.5453);}

float noise(vec3 x){
 vec3 p=floor(x),f=fract(x);
 f=f*f*(3.-2.*f);
 float n=p.x+p.y*57.+113.*p.z;
 return mix(mix(mix(hash(n),hash(n+1.),f.x),
 mix(hash(n+57.),hash(n+58.),f.x),f.y),
 mix(mix(hash(n+113.),hash(n+114.),f.x),
 mix(hash(n+170.),hash(n+171.),f.x),f.y),f.z);
}

float fbm(vec3 p){
 float f=0.;
 f+=0.5*noise(p); p=m*p*2.02;
 f+=0.25*noise(p); p=m*p*2.03;
 f+=0.125*noise(p);
 return f;
}

float scene(vec3 p){
 return (0.1 - length(p)*0.05 + fbm(p * 0.3 * uCloudScale)) * uDensity;
}

mat3 cam(vec3 ro,vec3 ta){
 vec3 cw=normalize(ta-ro);
 vec3 cu=normalize(cross(cw,vec3(0,1,0)));
 vec3 cv=cross(cu,cw);
 return mat3(cu,cv,cw);
}

void main(){
 vec2 uv=(gl_FragCoord.xy*2.-iResolution.xy)/min(iResolution.x,iResolution.y);

 float t=iTime*uSpeed;

 vec3 ro=25.*normalize(vec3(cos(t),0.5,sin(t)));
 vec3 rd=cam(ro,vec3(0,1,0))*normalize(vec3(uv,1.3));

 vec3 p=ro;
 float T=1.;
 vec4 col=vec4(0);

 for(int i=0;i<64;i++){
   float d=scene(p);
   if(d>0.){
     float tmp=d/64.;
     T*=1.-tmp*uAbsorption;
     if(T<0.01)break;
     col+=vec4(vec3(1.)*tmp*T*50.,1.);
   }
   p+=rd*(40./64.);
 }

 vec3 bg=mix(uColor,vec3(0.7,0.7,1.),1.-(uv.y+1.)*0.5);
 col.rgb+=bg;

 gl_FragColor=col;
}
`;

/* ===== 编译安全 ===== */
function compile(type, source){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, source);
  gl.compileShader(sh);

  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(sh));
  }

  return sh;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);

if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
  console.error(gl.getProgramInfoLog(prog));
}

gl.useProgram(prog);

/* 全屏三角 */
const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);

const loc=gl.getAttribLocation(prog,"p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

/* uniforms */
const uRes=gl.getUniformLocation(prog,"iResolution");
const uTime=gl.getUniformLocation(prog,"iTime");
const uSpeed=gl.getUniformLocation(prog,"uSpeed");
const uDensity=gl.getUniformLocation(prog,"uDensity");
const uAbs=gl.getUniformLocation(prog,"uAbsorption");
const uCloudScale=gl.getUniformLocation(prog,"uCloudScale");
const uColor=gl.getUniformLocation(prog,"uColor");

/* UI */
const speed=document.getElementById("speed");
const density=document.getElementById("density");
const absorption=document.getElementById("absorption");
const cloudScale=document.getElementById("cloudScale");
const color=document.getElementById("color");

/* 拖动 */
const panel=document.getElementById("panel");
const header=document.getElementById("header");

let drag=false,ox=0,oy=0;

header.onmousedown=e=>{
 drag=true;
 ox=e.offsetX;
 oy=e.offsetY;
};

document.onmousemove=e=>{
 if(drag){
   panel.style.left=(e.clientX-ox)+"px";
   panel.style.top=(e.clientY-oy)+"px";
 }
};

document.onmouseup=()=>drag=false;

/* 折叠 */
const toggle=document.getElementById("toggle");
const content=document.getElementById("content");

toggle.onclick=()=>{
 if(content.style.display==="none"){
   content.style.display="block";
   toggle.innerText="－";
 }else{
   content.style.display="none";
   toggle.innerText="＋";
 }
};

/* Alt + H */
let visible=true;
document.addEventListener("keydown", e=>{
 if(e.altKey && e.key.toLowerCase()==="h"){
   visible=!visible;
   panel.style.display=visible?"block":"none";
 }
});

/* 颜色转换 */
function hex(c){
 let n=parseInt(c.slice(1),16);
 return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];
}

/* 渲染 */
let start=performance.now();

function render(){
 let t=(performance.now()-start)/1000;

 gl.uniform2f(uRes,canvas.width,canvas.height);
 gl.uniform1f(uTime,t);
 gl.uniform1f(uSpeed,speed.value);
 gl.uniform1f(uDensity,density.value);
 gl.uniform1f(uAbs,absorption.value);
 gl.uniform1f(uCloudScale,cloudScale.value);

 let c=hex(color.value);
 gl.uniform3f(uColor,c[0],c[1],c[2]);

 gl.drawArrays(gl.TRIANGLES,0,3);
 requestAnimationFrame(render);
}

render();
</script>
<script>document.addEventListener('DOMContentLoaded',function(){var p=document.getElementById('panel');if(p)p.style.display='none';});</script>


<!-- 应用到导航页 悬浮按钮（由 inject_apply_button.py 注入） -->

<script>
function __applyToNav__() {
  var file = 'a5.html';
  localStorage.setItem('bgChoice', file);
  var btn = document.getElementById('__apply-btn__');
  btn.textContent = '✔ 已应用！';
  btn.style.background = '#1a7f37';
  setTimeout(function() {
    btn.textContent = '✓ 应用到导航页';
    btn.style.background = '#238636';
  }, 2000);
}
</script>

<!-- BG_PARAM_PERSIST -->
<script>
(function(){
  var FILE = 'a5.html';
  var KEY = 'bgParams:' + FILE;
  function allControls(){ return Array.prototype.slice.call(document.querySelectorAll('input,select,textarea')); }
  function serialize(){
    var d = {}, els = allControls();
    els.forEach(function(el){ if(el.id) d[el.id] = (el.type==='checkbox'||el.type==='radio') ? el.checked : el.value; });
    return d;
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(serialize())); }catch(e){} }
  function restore(){
    try{
      var d = JSON.parse(localStorage.getItem(KEY) || '{}');
      Object.keys(d).forEach(function(id){
        var el = document.getElementById(id); if(!el) return;
        if(el.type==='checkbox'||el.type==='radio') el.checked = !!d[id]; else el.value = d[id];
        try{ el.dispatchEvent(new Event('input',{bubbles:true})); }catch(e){}
        try{ el.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){}
      });
    }catch(e){}
  }
  document.addEventListener('input', save, true);
  document.addEventListener('change', save, true);
  window.addEventListener('load', function(){ restore(); setTimeout(restore, 700); setTimeout(restore, 1700); });
})();
</script>

</body>
</html>
