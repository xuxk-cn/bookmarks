<style>
:root{
  --bg:#232324;
  --panel-bg:#1c1c1d;
  --card-bg:#2a2a2b;
  --text-primary:rgba(255,255,255,.85);
  --text-secondary:rgba(255,255,255,.55);
  --text-tertiary:rgba(255,255,255,.4);
  --border:rgba(255,255,255,.08);
  --border-strong:rgba(255,255,255,.14);
  --accent:#FFB11B;
  --success:#40B43E;
  --intensity-4:rgba(255,255,255,.04);
  --intensity-6:rgba(255,255,255,.06);
  --intensity-8:rgba(255,255,255,.08);
  --intensity-12:rgba(255,255,255,.12);
  font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
button{cursor:pointer;font-family:inherit;border:0;background:transparent}
a{cursor:pointer;text-decoration:none;color:inherit}

body{
  background:var(--bg);
  color:var(--text-primary);
  min-height:100vh;
  font-size:13px;
  line-height:1.5;
}

.shell{
  display:flex;flex-direction:column;
  gap:14px;
  padding:16px;
  max-width:1600px;
  margin:0 auto;
  min-height:100vh;
}

.topbar{
  display:flex;align-items:center;gap:12px;
  padding:10px 14px;
  background:var(--panel-bg);
  border:.5px solid var(--border);
  border-radius:14px;
}
.brand{display:flex;align-items:center;gap:8px;flex-shrink:0}
.brand-logo{
  width:28px;height:28px;
  background:linear-gradient(135deg,#FFB11B,#E58522);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:600;color:#000;
}
.brand-name{font-size:14px;font-weight:600;color:var(--text-primary);white-space:nowrap}

.search{
  flex:1;min-width:0;
  display:flex;align-items:center;gap:8px;
  padding:7px 12px;
  background:var(--intensity-4);
  border:.5px solid var(--border);
  border-radius:10px;
  transition:border .15s;
}
.search:focus-within{border-color:var(--accent)}
.search input{
  flex:1;background:transparent;outline:0;
  color:var(--text-primary);font-size:13px;
  border:0;min-width:0;
}
.search input::placeholder{color:var(--text-tertiary)}
.search-ico{color:var(--text-tertiary);font-size:13px}

.top-actions{display:flex;gap:6px;flex-shrink:0}
.top-btn{
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  background:var(--intensity-4);
  border:.5px solid var(--border);
  border-radius:10px;
  color:var(--text-secondary);
  font-size:13px;
}
.top-btn:hover{color:var(--text-primary)}

.topnav{
  display:flex;flex-wrap:wrap;
  gap:4px;
  padding:6px;
  background:var(--panel-bg);
  border:.5px solid var(--border);
  border-radius:14px;
}

.topnav-item{
  flex:1 1 0;
  min-width:70px;
  display:flex;align-items:center;justify-content:center;
  gap:6px;
  padding:9px 8px;
  border-radius:8px;
  color:var(--text-secondary);
  font-size:12px;
  font-weight:400;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  transition:all .15s;
}
.topnav-item:hover{background:var(--intensity-6);color:var(--text-primary)}
.topnav-item.active{
  background:var(--intensity-8);
  color:var(--accent);
  font-weight:500;
}
.topnav-item .nav-ico{font-size:13px;flex-shrink:0}
.topnav-item .nav-label{
  overflow:hidden;text-overflow:ellipsis;
}

.more-wrap{
  position:relative;
  flex:1 1 0;
  min-width:70px;
}
.more-btn{
  width:100%;
  display:flex;align-items:center;justify-content:center;
  gap:6px;
  padding:9px 8px;
  border-radius:8px;
  background:var(--intensity-4);
  border:.5px solid var(--border);
  color:var(--text-secondary);
  font-size:12px;
  white-space:nowrap;
  transition:all .15s;
}
.more-btn:hover{background:var(--intensity-6);color:var(--text-primary)}
.more-btn .caret{font-size:9px;opacity:.7;transition:transform .2s}
.more-wrap.open .more-btn .caret{transform:rotate(180deg)}
.more-wrap.open .more-btn{background:var(--intensity-8);color:var(--text-primary)}

.dropdown{
  position:absolute;
  top:calc(100% + 6px);
  right:0;
  min-width:180px;
  background:var(--card-bg);
  border:.5px solid var(--border-strong);
  border-radius:10px;
  padding:4px;
  box-shadow:0 10px 25px rgba(0,0,0,.4);
  display:none;
  z-index:100;
}
.more-wrap.open .dropdown{display:block}
.dropdown-item{
  display:flex;align-items:center;gap:8px;
  width:100%;text-align:left;
  padding:8px 10px;
  border-radius:6px;
  font-size:12px;
  color:var(--text-secondary);
  transition:all .15s;
}
.dropdown-item:hover{background:var(--intensity-6);color:var(--text-primary)}
.dropdown-item.active{color:var(--accent)}
.dropdown-item .nav-ico{font-size:13px;width:16px;text-align:center}

.section{
  background:var(--panel-bg);
  border:.5px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;
}
.section-title{
  font-size:11px;
  font-weight:600;
  color:var(--text-tertiary);
  letter-spacing:.08em;
  text-transform:uppercase;
}
.section-count{font-size:11px;color:var(--text-tertiary)}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:8px;
}
.app-card{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  background:var(--card-bg);
  border:.5px solid var(--border);
  border-radius:10px;
  transition:all .15s;
  position:relative;
  text-align:left;
  width:100%;
}
.app-card:hover{
  background:var(--intensity-6);
  border-color:var(--border-strong);
}
.app-icon{
  width:32px;height:32px;
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  font-weight:600;font-size:13px;
  background:var(--intensity-8);
  color:var(--text-primary);
}
.app-info{flex:1;min-width:0}
.app-title{
  font-size:13px;
  font-weight:500;
  color:var(--text-primary);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.app-meta{font-size:11px;color:var(--text-tertiary);margin-top:2px}
.app-meta.ok{color:var(--success)}
.status-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--success);flex-shrink:0;
}

.clock-card{display:flex;flex-direction:column;gap:6px}
.clock-date{font-size:22px;font-weight:500;color:var(--text-primary);letter-spacing:-.01em}
.clock-time{font-size:13px;color:var(--text-secondary)}
.clock-week{font-size:11px;color:var(--text-tertiary)}

.weather-card{display:flex;flex-direction:column;gap:8px}
.weather-top{display:flex;align-items:center;gap:10px}
.weather-ico{
  width:36px;height:36px;
  background:var(--intensity-8);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.weather-info{flex:1}
.weather-temp{font-size:18px;font-weight:500}
.weather-feels{font-size:11px;color:var(--text-secondary);margin-top:4px}

.bar-chart{
  display:flex;align-items:flex-end;
  height:48px;gap:3px;margin-top:6px;
}
.bar{
  flex:1;background:linear-gradient(180deg,var(--accent),#E58522);
  border-radius:2px;opacity:.7;
}
.bar.now{opacity:1}
.bar-labels{
  display:flex;justify-content:space-between;
  font-size:10px;color:var(--text-tertiary);
  margin-top:4px;
}
.location{font-size:11px;color:var(--text-tertiary);margin-top:6px}

.footer{text-align:center;font-size:11px;color:var(--text-tertiary);padding:10px}
.empty{
  grid-column:1/-1;text-align:center;
  color:var(--text-tertiary);padding:30px 0;font-size:13px;
}

@media (max-width:900px){
  .topbar{flex-wrap:wrap}
  .brand{flex:1}
  .search{order:3;flex:1 0 100%;margin-top:4px}
}
</style>

  <main id="content"></main>

</div>

<script>
const data = JSON.parse(document.getElementById('dataBlock').textContent);
const topnavEl = document.getElementById('topnav');
const content = document.getElementById('content');
const searchInput = document.getElementById('searchInput');

const icons = {
  resourse:'📚', tools:'🛠', soft:'💾', '视频':'🎬', AIGC:'✨',
  AI:'🤖', ai:'⚡', 'AI大语言':'💬', 'AI声音':'🎵', '反推提示词':'🔍',
  YouTube:'▶', Google:'G', '电影':'🎥', '身份':'🔐', '壁纸':'🖼',
  'API-VPS':'☁', 'AI-3D':'🧊', 'APK-Proxy':'📦', 'Nano Banana':'🍌', Blog:'📝', mail:'✉'
};

const primaryCats = ['resourse','tools','soft','视频','AIGC','AI','ai','AI大语言','AI声音','反推提示词','YouTube','Google','电影','身份'];
const moreCats = ['壁纸','API-VPS','AI-3D','APK-Proxy','Nano Banana','Blog','mail'];

const allItems = [];
data.categories.forEach(c => c.items.forEach(i => allItems.push({...i, catTitle:c.title})));

let currentCat = null;
let searchTimer = null;

function renderTopnav(){
  topnavEl.innerHTML = '';
  primaryCats.forEach(title => {
    const cat = data.categories.find(c => c.title === title);
    if(!cat) return;
    const btn = document.createElement('button');
    btn.className = 'topnav-item' + (currentCat === title ? ' active' : '');
    btn.innerHTML = '<span class="nav-ico">' + (icons[title]||'•') + '</span><span class="nav-label">' + title + '</span>';
    btn.addEventListener('click', () => {
      searchInput.value = '';
      currentCat = title;
      renderTopnav();
      renderCategory();
    });
    topnavEl.appendChild(btn);
  });

  const moreWrap = document.createElement('div');
  moreWrap.className = 'more-wrap';
  const isMoreActive = moreCats.includes(currentCat);
  if(isMoreActive) moreWrap.classList.add('open');
  moreWrap.innerHTML = `
    <button class="more-btn">
      <span class="nav-ico">⋯</span>
      <span class="nav-label">更多</span>
      <span class="caret">▼</span>
    </button>
    <div class="dropdown">
      ${moreCats.map(t => {
        const active = currentCat === t ? ' active' : '';
        return '<button class="dropdown-item' + active + '" data-cat="' + t + '"><span class="nav-ico">' + (icons[t]||'•') + '</span><span>' + t + '</span></button>';
      }).join('')}
    </div>
  `;
  topnavEl.appendChild(moreWrap);

  const moreBtn = moreWrap.querySelector('.more-btn');
  moreBtn.addEventListener('click', e => {
    e.stopPropagation();
    moreWrap.classList.toggle('open');
  });

  moreWrap.querySelectorAll('.dropdown-item').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const t = el.dataset.cat;
      moreWrap.classList.remove('open');
      searchInput.value = '';
      currentCat = t;
      renderTopnav();
      renderCategory();
    });
  });
}

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildCard(item, showCat){
  const ic = icons[item.catTitle] || item.title.charAt(0);
  const iconHtml = item.icon
    ? '<div class="app-icon"><img src="' + item.icon + '" onerror="this.parentElement.innerHTML=\'' + ic + '\'" style="width:100%;height:100%;object-fit:contain"></div>'
    : '<div class="app-icon">' + ic + '</div>';
  const catBadge = showCat ? '<div style="font-size:10px;color:var(--accent);margin-top:2px">' + escapeHtml(item.catTitle) + '</div>' : '';
  return '<button class="app-card" data-url="' + item.url + '" title="' + escapeHtml(item.hover||item.title) + '">' + iconHtml + '<div class="app-info"><div class="app-title">' + escapeHtml(item.title) + '</div><div class="app-meta ok">可用</div>' + catBadge + '</div><div class="status-dot"></div></button>';
}

function bindCards(){
  document.querySelectorAll('.app-card').forEach(el => {
    el.addEventListener('click', () => window.open(el.dataset.url, '_blank'));
  });
}

function renderCategory(){
  const cat = data.categories.find(c => c.title === currentCat);
  if(!cat) return;
  let html = '<div class="section"><div class="section-head"><div class="section-title">' + cat.title + '</div><div class="section-count">' + cat.items.length + ' 项</div></div><div class="grid">';
  cat.items.forEach(item => { html += buildCard(item, false); });
  html += '</div></div>';
  content.innerHTML = html;
  bindCards();
}

function renderSearch(query){
  const words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(!words.length){
    if(currentCat) renderCategory();
    else renderHome();
    return;
  }
  const scored = allItems.map(item => {
    const t = (item.title||'').toLowerCase();
    const h = (item.hover||'').toLowerCase();
    const u = (item.url||'').toLowerCase();
    let score = 0, matched = 0;
    for(const w of words){
      if(t.includes(w)){ score += t === w ? 100 : (t.startsWith(w)?60:40); matched++; }
      else if(u.includes(w)){ score += 10; matched++; }
      else if(h.includes(w)){ score += 5; matched++; }
    }
    return matched === words.length ? {item, score} : null;
  }).filter(Boolean).sort((a,b) => b.score - a.score);

  let html = '<div class="section"><div class="section-head"><div class="section-title">搜索结果</div><div class="section-count">' + scored.length + ' 项匹配</div></div>';
  if(!scored.length){
    html += '<div class="grid"><div class="empty">未找到匹配书签</div></div>';
  } else {
    html += '<div class="grid">';
    scored.forEach(s => { html += buildCard(s.item, true); });
    html += '</div>';
  }
  html += '</div>';
  content.innerHTML = html;
  bindCards();
}

function updateClock(){
  const now = new Date();
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return {
    date: now.getDate() + ' ' + months[now.getMonth()],
    time: String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0'),
    week: days[now.getDay()],
    year: now.getFullYear()
  };
}
