<!-- IP 定位（独立脚本块，ES5 + XHR，带超时兜底） -->
<script>
(function(){
    var el = document.getElementById('weather');
    var span = el.getElementsByTagName('span')[0];
    var settled = false;
    setTimeout(function(){ if(!settled) span.textContent = '📍 未知位置'; }, 16000);

    function getJson(url, cb){
        try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.timeout = 5000;
            xhr.onload = function(){
                if(xhr.status >= 200 && xhr.status < 300){
                    try { cb(null, JSON.parse(xhr.responseText)); } catch(e){ cb(e); }
                } else { cb(new Error('http ' + xhr.status)); }
            };
            xhr.onerror = function(){ cb(new Error('net')); };
            xhr.ontimeout = function(){ cb(new Error('timeout')); };
            xhr.send();
        } catch(e){ cb(e); }
    }
    function weatherIcon(code){
        code = +code;
        if(code === 0) return '☀️';
        if(code <= 2) return '🌤';
        if(code === 3) return '☁️';
        if(code <= 48) return '🌫';
        if(code <= 57) return '🌦';
        if(code <= 67) return '🌧';
        if(code <= 77) return '🌨';
        if(code <= 82) return '🌧';
        if(code <= 86) return '❄️';
        return '⛈';
    }
    function show(geo){
        var parts = [];
        if(geo.city) parts.push(geo.city);
        if(geo.region && geo.region !== geo.city) parts.push(geo.region);
        var place = parts.join(' ') || geo.country || '未知位置';
        getJson('https://api.open-meteo.com/v1/forecast?latitude=' + geo.latitude + '&longitude=' + geo.longitude + '&current=temperature_2m,weather_code&timezone=auto', function(err, j){
            settled = true;
            if(!err && j && j.current){
                span.textContent = '📍 ' + place + ' ' + weatherIcon(j.current.weather_code) + ' ' + Math.round(j.current.temperature_2m) + '°';
            } else {
                span.textContent = '📍 ' + place;
            }
        });
    }
    getJson('https://ipwho.is/', function(err, j){
        if(!err && j && j.success !== false && (j.city || j.region)){
            show({city:j.city, region:j.region, country:j.country, latitude:j.latitude, longitude:j.longitude});
            return;
        }
        getJson('https://ipapi.co/json/', function(err2, j2){
            if(!err2 && j2 && (j2.city || j2.region)){
                show({city:j2.city, region:j2.region, country:j2.country_name, latitude:j2.latitude, longitude:j2.longitude});
                return;
            }
            getJson('https://api.ip.sb/geoip', function(err3, j3){
                if(!err3 && j3 && (j3.city || j3.region)){
                    show({city:j3.city, region:j3.region, country:j3.country, latitude:j3.latitude, longitude:j3.longitude});
                    return;
                }
                settled = true;
                span.textContent = '📍 未知位置';
            });
        });
    });
})();
</script>

        {name:'Google', placeholder:'Google 搜索',           url:'https://www.google.com/search?q='},
        {name:'Bing',   placeholder:'微软Bing搜索',          url:'https://www.bing.com/search?q='},
        {name:'AI',     placeholder:'AI 搜索（Perplexity）', url:'https://www.perplexity.ai/search?q='}
    ];
    var currentEngine = 'Google';

    function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function getHost(url){ try { var a = document.createElement('a'); a.href = url; return a.hostname; } catch(e){ return ''; } }
    function favicon(url){ var h = getHost(url); return h ? ('https://www.google.com/s2/favicons?domain=' + h + '&sz=64') : ''; }
    function trim(s){ return String(s||'').replace(/^\s+|\s+$/g,''); }

    function buildCard(item){
        var card = document.createElement('div');
        card.className = 'card';
        card.onclick = (function(url){ return function(){ window.open(url, '_blank'); }; })(item.u);
        var iconUrl = favicon(item.u);
        var first = escHtml((item.t || '?').charAt(0).toUpperCase());
        var iconHtml = iconUrl
            ? '<img src="' + iconUrl + '" onerror="this.style.visibility=\'hidden\'" alt="">'
            : '<span class="card-fallback">' + first + '</span>';
        card.innerHTML =
            '<div class="card-icon">' + iconHtml + '</div>' +
            '<div class="card-body">' +
                '<div class="card-title">' + escHtml(item.t) + '</div>' +
                '<div class="card-desc">' + escHtml(item.h || '') + '</div>' +
            '</div>' +
            '<span class="more">+</span>';
        return card;
    }

    function buildTabs(){
        tabsEl.innerHTML = '';
        for(var i=0; i<TABS.length; i++){
            (function(cat, idx){
                var t = document.createElement('div');
                t.className = 'tab' + (idx === 0 ? ' active' : '');
                t.setAttribute('data-cat', cat);
                t.textContent = cat;
                t.onclick = function(){ selectTab(cat); };
                tabsEl.appendChild(t);
            })(TABS[i], i);
        }
    }

    function renderEngineRow(){
        var html = '';
        for(var i=0; i<ENGINES.length; i++){
            var e = ENGINES[i];
            html += '<a data-engine="' + e.name + '" class="' + (e.name === currentEngine ? 'active' : '') + '">' + e.name + '</a>';
        }
        engineRowEl.innerHTML = html;
        var links = engineRowEl.querySelectorAll('a[data-engine]');
        for(var j=0; j<links.length; j++){
            (function(el){
                el.onclick = function(){
                    currentEngine = el.getAttribute('data-engine');
                    for(var k=0; k<ENGINES.length; k++){
                        if(ENGINES[k].name === currentEngine) searchEl.placeholder = ENGINES[k].placeholder;
                    }
                    renderEngineRow();
                };
            })(links[j]);
        }
    }

    function renderTab(catName){
        contentEl.innerHTML = '';
        var items = CATS[catName];
        if(!items || !items.length){
            contentEl.innerHTML = '<div style="text-align:center;color:#6b7884;padding:60px 0">「' + escHtml(catName) + '」分类下还没有内容</div>';
            return;
        }
        var sec = document.createElement('div');
        sec.className = 'section';
        sec.innerHTML = '<div class="section-title">' + escHtml(catName) + ' <span class="count">' + items.length + ' 个</span></div>';
        var grid = document.createElement('div');
        grid.className = 'card-grid';
        for(var i=0; i<items.length; i++) grid.appendChild(buildCard(items[i]));
        sec.appendChild(grid);
        contentEl.appendChild(sec);
    }

    function renderSearch(q){
        contentEl.innerHTML = '';
        var query = trim(q).toLowerCase();
        if(!query){ renderTab(TABS[0]); return; }
        var total = 0;
        var matched = {};
        var catNames = Object.keys(CATS);
        for(var c=0; c<catNames.length; c++){
            var cat = catNames[c];
            var items = CATS[cat];
            for(var i=0; i<items.length; i++){
                var it = items[i];
                var t = (it.t||'').toLowerCase();
                var h = (it.h||'').toLowerCase();
                var u = (it.u||'').toLowerCase();
                if(t.indexOf(query) !== -1 || h.indexOf(query) !== -1 || u.indexOf(query) !== -1){
                    if(!matched[cat]) matched[cat] = [];
                    matched[cat].push(it);
                    total++;
                }
            }
        }
        var tip = document.createElement('div');
        tip.style.cssText = 'color:#8fa3a8;font-size:13px;margin-bottom:14px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)';
        tip.textContent = '找到 ' + total + ' 条匹配 "' + q + '" 的结果';
        contentEl.appendChild(tip);
        if(!total){
            var empty = document.createElement('div');
            empty.style.cssText = 'text-align:center;color:#6b7884;padding:60px 0';
            empty.textContent = '未找到匹配结果';
            contentEl.appendChild(empty);
            return;
        }
        for(var m=0; m<catNames.length; m++){
            var cn = catNames[m];
            if(!matched[cn]) continue;
            var sec = document.createElement('div');
            sec.className = 'section';
            sec.innerHTML = '<div class="section-title">' + escHtml(cn) + ' <span class="count">' + matched[cn].length + '</span></div>';
            var grid = document.createElement('div');
            grid.className = 'card-grid';
            for(var n=0; n<matched[cn].length; n++) grid.appendChild(buildCard(matched[cn][n]));
            sec.appendChild(grid);
            contentEl.appendChild(sec);
        }
    }

    function showSuggest(q){
        var query = trim(q).toLowerCase();
        suggestEl.innerHTML = '';
        if(!query){ suggestEl.className = 'search-suggest'; return; }
        var list = [];
        var catNames = Object.keys(CATS);
        for(var c=0; c<catNames.length; c++){
            var cat = catNames[c];
            var items = CATS[cat];
            for(var i=0; i<items.length; i++){
                var it = items[i];
                if((it.t||'').toLowerCase().indexOf(query) !== -1 || (it.h||'').toLowerCase().indexOf(query) !== -1){
                    list.push(it);
                }
            }
        }
        if(!list.length){ suggestEl.className = 'search-suggest'; return; }
        suggestEl.className = 'search-suggest show';
        var top = list.slice(0, 8);
        for(var j=0; j<top.length; j++){
            (function(it){
                var div = document.createElement('div');
                div.className = 'item';
                div.textContent = it.t;
                div.onclick = function(){
                    window.open(it.u, '_blank');
                    searchEl.value = it.t;
                    renderSearch(it.t);
                    suggestEl.className = 'search-suggest';
                };
                suggestEl.appendChild(div);
            })(top[j]);
        }
    }

    function selectTab(name){
        var all = tabsEl.querySelectorAll('.tab');
        for(var i=0; i<all.length; i++){
            if(all[i].getAttribute('data-cat') === name) all[i].className = 'tab active';
            else all[i].className = 'tab';
        }
        searchEl.value = '';
        suggestEl.className = 'search-suggest';
        renderTab(name);
    }

    function doSearchJump(){
        var q = trim(searchEl.value);
        if(!q) return;
        for(var i=0; i<ENGINES.length; i++){
            if(ENGINES[i].name === currentEngine){
                window.open(ENGINES[i].url + encodeURIComponent(q), '_blank');
                return;
            }
        }
    }

    /* 事件 */
    searchEl.addEventListener('input', function(e){
        var v = e.target.value;
        showSuggest(v);
        if(!trim(v)) selectTab(TABS[0]);
        else renderSearch(v);
    });
    searchEl.addEventListener('keydown', function(e){
        if(e.key === 'Enter') doSearchJump();
    });
    searchEl.addEventListener('focus', function(){ if(searchEl.value) showSuggest(searchEl.value); });
    document.getElementById('searchIcon').onclick = doSearchJump;
    document.addEventListener('click', function(e){
        var wrap = document.querySelector('.search-wrap');
        if(wrap && !wrap.contains(e.target)) suggestEl.className = 'search-suggest';
    });

    /* 右侧工具 */
    document.getElementById('rtSearch').onclick = function(){ searchEl.focus(); };
    document.getElementById('rtTop').onclick = function(){ window.scrollTo(0, 0); };
    document.getElementById('rtBell').onclick = function(){ alert('🔔 暂无新消息'); };

    buildTabs();
    renderEngineRow();
    selectTab(TABS[0]);
})();
</script>

<script data-tabbit-widget-diagnostics="true">
(function(){
  if (window.__tabbitWidgetDiagnosticsInstalled) return;
  window.__tabbitWidgetDiagnosticsInstalled = true;
  window.__TABBIT_WIDGET_ERRORS__ = window.__TABBIT_WIDGET_ERRORS__ || [];
  function emit(level, args) {
    var payload = {
      type: "tabbit_widget_diagnostics",
      level: level,
      message: Array.prototype.slice.call(args || []).map(function(item) {
        if (item && item.stack) return item.stack;
        if (typeof item === "string") return item;
        try { return JSON.stringify(item); } catch (_) { return String(item); }
      }).join(" "),
      timestamp: Date.now()
    };
    window.__TABBIT_WIDGET_ERRORS__.push(payload);
    try { window.parent && window.parent.postMessage(payload, "*"); } catch (_) {}
  }
  var originalError = console.error;
  console.error = function() {
    emit("error", arguments);
    return originalError && originalError.apply(console, arguments);
  };
  window.addEventListener("error", function(event) {
    emit("error", [event.message || "Script error", event.filename || "", event.lineno || ""]);
  });
  window.addEventListener("unhandledrejection", function(event) {
    emit("unhandledrejection", [event.reason || "Unhandled promise rejection"]);
  });
})();
</script>
