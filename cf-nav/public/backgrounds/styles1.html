            color: #333;
            line-height: 1.5;
            overflow: hidden;

            height: 100vh;
            position: relative;

            width: 220px;
            min-width: 220px;

        .logo {

            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .logo-mark {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            clip-path: polygon(0 100%, 25% 0, 50% 100%, 75% 0, 100% 100%, 80% 100%, 60% 30%, 40% 30%, 20% 100%);

        .logo-text {

        }
        .logo-emoji { font-size: 1.1rem; }

        .side-menu {
            flex: 1;
            padding: 0.8rem 0;
            overflow-y: auto;
        }
        .side-menu::-webkit-scrollbar { width: 4px; }
        .side-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.7rem 1.2rem;
            color: #a1a1aa;
            font-size: 0.92rem;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            user-select: none;
        }
        .menu-item:hover {
            background: rgba(255,255,255,0.04);
            color: #fff;
        }
        .menu-item.active {
            background: rgba(245, 108, 44, 0.12);
            color: #ff8a5b;
            border-left: 3px solid #ff6b35;
            padding-left: calc(1.2rem - 3px);
        }
        .menu-item .icon {
            width: 18px; height: 18px;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .menu-item .arrow {
            margin-left: auto;
            font-size: 0.75rem;
            color: #71717a;
        }
        .menu-divider {
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 0.6rem 1rem;
        }

        .sidebar-footer {
            padding: 0.6rem 0;
            border-top: 1px solid rgba(255,255,255,0.04);
        }

        /* ===== 主内容区 ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 顶部 */
        .topbar {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            gap: 1rem;
            flex-shrink: 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #555;
            font-size: 1.3rem;
            padding: 0.4rem 0.6rem;
            border-radius: 4px;
        }
        .menu-btn:hover { background: #f3f4f6; }
        .weather {
            font-size: 0.9rem;
            color: #555;
            display: flex; align-items: center; gap: 0.3rem;
        }
        .topbar-right {
            margin-left: auto;
            display: flex; align-items: center; gap: 1rem;
            font-size: 0.85rem; color: #6b7280;
        }
        .sound-toggle {
            display: flex; align-items: center; gap: 0.4rem;
            cursor: pointer;
        }
        .sound-toggle input { accent-color: #ff6b35; cursor: pointer; }

        /* GitHub 丝带 */
        .github-ribbon {
            width: 220px;
            background: #1e1e23;
            color: #fff;
            text-align: center;
            font-size: 0.78rem;
            padding: 5px 0;
            position: absolute;
            top: 28px;
            right: -68px;
            transform: rotate(45deg);
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            z-index: 100;
            letter-spacing: 0.4px;
        }
        .github-ribbon:hover { background: #ff6b35; }

        /* 内容滚动区 */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 2.5rem 3rem;
        }
        .content::-webkit-scrollbar { width: 8px; }
        .content::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
        .content::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }

        /* 面包屑 */
        .breadcrumb {
            display: flex; align-items: center; gap: 0.6rem;
            margin-bottom: 0.8rem;
            font-size: 0.9rem;
            color: #6b7280;
        }
        .breadcrumb .crumb-link {
            cursor: pointer;
            padding: 0.15rem 0.55rem;
            border-radius: 4px;
            transition: background 0.15s;
        }
        .breadcrumb .crumb-link:hover { background: #fff5ee; color: #ff6b35; }
        .breadcrumb .crumb-link.active {
            background: #fff5ee;
            color: #ff6b35;
        }
        .breadcrumb .sep { color: #d4d4d8; }

        /* 搜索框 */
        .search-row {
            display: flex; align-items: center;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            padding: 0.3rem 0.3rem 0.3rem 1rem;
            margin-bottom: 1.8rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04);
        }
        .search-row .engine-logo {
            width: 22px; height: 22px;
            margin-right: 0.6rem;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 0.95rem;
        }
        .search-row input {
            flex: 1;
            border: none; outline: none;
            background: transparent;
            font-size: 0.95rem;
            color: #333;
            padding: 0.45rem 0;
        }
        .search-row input::placeholder { color: #9ca3af; }
        .search-btn {
            background: #1e1e23;
            color: #fff;
            border: none;
            width: 36px; height: 32px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .search-btn:hover { background: #ff6b35; }

        /* 分组标题 */
        .section-title {
            display: flex; align-items: center; gap: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            color: #374151;
            margin: 0.5rem 0 1rem;
        }
        .section-title .icon {
            display: inline-flex; align-items: center; justify-content: center;
            color: #ff6b35;
        }
        .section-title .count {
            font-size: 0.78rem;
            color: #9ca3af;
            font-weight: 400;
            margin-left: 0.4rem;
        }

        /* 卡片网格 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }
        @media (max-width: 1280px) { .card-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 900px)  { .card-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 560px)  { .card-grid { grid-template-columns: 1fr; } }

        .card {
            background: #fff;
            border-radius: 6px;
            padding: 0.85rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            cursor: pointer;
            transition: all 0.18s;
            border: 1px solid transparent;
            min-height: 64px;
        }
        .card:hover {
            border-color: #ff6b35;
            box-shadow: 0 4px 12px rgba(255,107,53,0.1);
            transform: translateY(-1px);
        }
        .card .card-icon {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: inline-flex; align-items: center; justify-content: center;
            overflow: hidden;
            flex-shrink: 0;

        .card .card-icon img {
            width: 26px; height: 26px;
            object-fit: contain;
        }
        .card .card-icon .card-fallback {
            font-size: 0.95rem;
            font-weight: 600;
            color: #6b7280;
            line-height: 1;
        }

        .card .card-title {
            font-size: 0.92rem;
            font-weight: 500;
            color: #1f2937;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        .card .card-desc {
            font-size: 0.76rem;
            color: #9ca3af;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card mark {
            background: #fff5ee;
            color: #ff6b35;
            border-radius: 2px;
            padding: 0 2px;

        .search-info {
            color: #6b7280;
            font-size: 0.85rem;
            margin-bottom: 1rem;

        .subcat-label {
            font-size: 0.78rem;
            color: #ff6b35;
            font-weight: 500;
            margin: 1rem 0 0.5rem;
            display: flex; align-items: center; gap: 0.3rem;
        }
        .subcat-label::before {
            content: '';
            display: inline-block;
            width: 3px; height: 12px;
            background: #ff6b35;
            border-radius: 2px;
        }

        /* 空状态 */
        .empty {
            background: #fff;
            border: 1px dashed #e5e7eb;
            border-radius: 6px;
            padding: 3rem 1rem;
            text-align: center;
            color: #9ca3af;
            font-size: 0.9rem;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar { width: 60px; min-width: 60px; }
            .sidebar .logo-text, .sidebar .logo-emoji,
            .menu-item span:not(.icon):not(.arrow) { display: none; }
            .menu-item { justify-content: center; padding: 0.7rem 0.5rem; }
            .menu-item.active { padding-left: 0.5rem; border-left: none; border-right: 3px solid #ff6b35; }
        }

        /* 悬停提示 */
        #tooltip {
            position: fixed;
            background: rgba(30, 30, 35, 0.96);
            color: #f4f4f5;
            padding: 0.6rem 0.85rem;
            border-radius: 6px;
            font-size: 0.8rem;
            max-width: 320px;
            pointer-events: none;
            z-index: 9999;
            display: none;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            line-height: 1.45;
        }
        #tooltip .tip-url {
            color: #ff8a5b;
            font-size: 0.75rem;
            margin-bottom: 4px;
            word-break: break-all;
        }

        /* sidebar 折叠 */
        .sidebar.collapsed { width: 60px; min-width: 60px; }
        .sidebar.collapsed .logo-text,
        .sidebar.collapsed .logo-emoji,
        .sidebar.collapsed .menu-item > span:not(.icon),
        .sidebar.collapsed .menu-item .arrow { display: none; }
        .sidebar.collapsed .menu-item { justify-content: center; padding: 0.7rem; }
        .sidebar.collapsed .menu-item.active {
            padding-left: 0.7rem;
            border-left: none;
            border-right: 3px solid #ff6b35;
        }
    </style>
</head>

            <!-- 卡片区 -->

        </div>
    </main>
</div>

          "hover": "站长工具图片转 Base64 是一个在线图片编码工具，主要用于将图片文件转换成 Base64 格式代码。用户可以将图片直接嵌入网页或代码中，减少图片文件请求，方便前端开发和网页优化。",
          "valid": true
        },
        {
          "title": "1.1.1.1 -WARP",
          "url": "https://one.one.one.one/",
          "icon": "",
          "hover": "1.1.1.1 WARP 是 Cloudflare 提供的网络连接服务，主要通过 DNS 优化和 VPN 类技术改善网络访问体验。用户可以使用客户端启用加密连接，提高 DNS 查询速度，并增强网络连接隐私保护。",

<script>
(function () {
    const raw = document.getElementById('data').textContent;
    const data = JSON.parse(raw);

    /* === 侧边栏一级菜单 + 数据归类 === */
    const menuConfig = [
        { key: '常用推荐', icon: '⭐', subs: ['resourse', 'tools', 'soft', 'AIGC'] },
        { key: '社区资讯', icon: '🖥', subs: ['视频', 'Blog', 'mail', '电影', 'YouTube', 'Google'] },
        { key: '灵感采集', icon: '💡', subs: ['壁纸', '反推提示词', 'Nano Banana'] },
        { key: '素材资源', icon: '🖼', subs: ['API-VPS', 'APK-Proxy', 'AI-3D'] },
        { key: '常用工具', icon: '🔧', subs: ['AI', 'ai', 'AI大语言', 'AI声音', '身份'] },
        { key: 'UED舰队', icon: '👥', subs: [] },
    ];
    const footerConfig = [
        { key: '示例页面', icon: '🌐' },
        { key: '一为亿',   icon: 'ⓘ' },
    ];

    /* 把原 categories 按 title 匹配到一级菜单 */
    const catMap = {};
    data.categories.forEach(c => { catMap[c.title] = c; });

    const groups = {};
    menuConfig.forEach(m => { groups[m.key] = []; });
    // 遍历所有原 categories，按 subs 归类
    data.categories.forEach(c => {
        let placed = false;
        for (const m of menuConfig) {
            if (m.subs.includes(c.title)) {
                groups[m.key].push({ catTitle: c.title, items: c.items });
                placed = true;
                break;
            }
        }
        if (!placed) {
            // 没匹配到的全部归入"常用推荐"
            groups['常用推荐'].push({ catTitle: c.title, items: c.items });
        }
    });

    /* === 渲染侧边栏 === */
    const sideMenu = document.getElementById('sideMenu');
    const sideFooter = document.getElementById('sideFooter');
    const divider = document.createElement('div');
    divider.className = 'menu-divider';
    sideMenu.appendChild(divider);

    let currentMenu = menuConfig[0].key;
    menuConfig.forEach((m, idx) => {
        const el = document.createElement('div');
        el.className = 'menu-item' + (idx === 0 ? ' active' : '');
        el.dataset.menu = m.key;
        el.innerHTML = `<span class="icon">${m.icon}</span><span>${m.key}</span><span class="arrow">›</span>`;
        el.onclick = () => switchMenu(m.key, el);
        sideMenu.appendChild(el);
    });
    footerConfig.forEach(m => {
        const el = document.createElement('div');
        el.className = 'menu-item';
        el.innerHTML = `<span class="icon">${m.icon}</span><span>${m.key}</span><span class="arrow">▾</span>`;
        sideFooter.appendChild(el);
    });

    function switchMenu(key, el) {
        document.querySelectorAll('#sideMenu .menu-item').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        currentMenu = key;
        document.getElementById('searchInput').value = '';
        renderMenu();
    }

    /* === 搜索引擎 === */
    const engines = [
        { name: '百度',  logo: '百', placeholder: '百度搜索',    url: 'https://www.baidu.com/s?wd=' },
        { name: 'Google',logo: 'G',  placeholder: 'Google 搜索', url: 'https://www.google.com/search?q=' },
        { name: '淘宝',  logo: '淘', placeholder: '淘宝搜索',    url: 'https://s.taobao.com/search?q=' },
        { name: 'Bing',  logo: 'B',  placeholder: '微软Bing搜索',url: 'https://www.bing.com/search?q=' },
    ];
    let currentEngine = 'Bing';
    const engineLogo = document.getElementById('engineLogo');
    const searchInput = document.getElementById('searchInput');

    /* 渲染面包屑（含搜索引擎切换） */
    const breadcrumb = document.getElementById('breadcrumb');
    function renderBreadcrumb() {
        breadcrumb.innerHTML =
            `<span class="crumb-link" data-engine="Baidu">常用</span><span class="sep">›</span>` +
            engines.map(e => `<span class="crumb-link${e.name === currentEngine ? ' active' : ''}" data-engine="${e.name}">${e.name === 'Google' ? e.name : (e.name === 'Bing' ? e.name : (e.name === '淘宝' ? e.name : e.name))}</span>`).join(' ');
        breadcrumb.querySelectorAll('.crumb-link').forEach(el => {
            el.onclick = () => {
                if (el.dataset.engine === 'Baidu') return; // 常用
                currentEngine = el.dataset.engine;
                const cfg = engines.find(x => x.name === currentEngine);
                engineLogo.textContent = cfg.logo;
                searchInput.placeholder = cfg.placeholder;
                renderBreadcrumb();
            };
        });
    }
    renderBreadcrumb();

    /* 搜索按钮跳转 */
    document.getElementById('searchBtn').onclick = doSearch;
    searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
    function doSearch() {
        const q = searchInput.value.trim();
        if (!q) return;
        const cfg = engines.find(x => x.name === currentEngine);
        window.open(cfg.url + encodeURIComponent(q), '_blank');
    }

    /* === 音效 === */
    const soundToggle = document.getElementById('soundToggle');
    if (localStorage.getItem('soundEnabled') === 'false') soundToggle.checked = false;
    soundToggle.addEventListener('change', () => localStorage.setItem('soundEnabled', soundToggle.checked));
    let audioCtx = null;
    function playDing() {
        if (!soundToggle.checked) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const c = audioCtx, t = c.currentTime;
            [[457.38, 0.25, 0.88], [914.76, 0.12, 0.45], [1829.52, 0.06, 0.18]].forEach(([f, v, d]) => {
                const o = c.createOscillator(), g = c.createGain();
                o.connect(g); g.connect(c.destination);
                o.type = 'sine'; o.frequency.value = f;
                g.gain.setValueAtTime(v, t);
                g.gain.exponentialRampToValueAtTime(0.001, t + d);
                o.start(t); o.stop(t + d);
            });
        } catch (e) {}
    }

    /* === 数据：打平所有 items 用于搜索 === */
    const allItems = [];
    data.categories.forEach(cat => cat.items.forEach(item => allItems.push({ ...item, catTitle: cat.title })));

    /* === 渲染主区 === */
    const main = document.getElementById('main');
    const tooltip = document.getElementById('tooltip');

    function escHtml(s) {
        return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function escRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    function highlight(text, words) {
        if (!text || !words.length) return escHtml(text || '');
        let result = escHtml(text);
        words.forEach(w => {
            const re = new RegExp(escRe(escHtml(w)), 'gi');
            result = result.replace(re, m => '<mark>' + m + '</mark>');
        });
        return result;
    }

    function scoreItem(item, words) {
        const t = (item.title || '').toLowerCase();
        const u = (item.url || '').toLowerCase();
        const h = (item.hover || '').toLowerCase();
        for (const w of words) {
            if (!t.includes(w) && !u.includes(w) && !h.includes(w)) return -1;
        }
        let score = 0;
        for (const w of words) {
            if (t === w) score += 100;
            else if (t.startsWith(w)) score += 60;
            else if (t.includes(w)) score += 40;
            if (u.includes(w)) score += 10;
            if (h.includes(w)) score += 5;
        }
        return score;
    }

    function faviconFor(url) {
        try {
            const host = new URL(url).hostname;
            return 'https://www.google.com/s2/favicons?domain=' + host + '&sz=64';
        } catch (e) { return ''; }
    }

    function makeCard(item, words) {
        const card = document.createElement('a');
        card.className = 'card';
        card.href = item.url;
        card.target = '_blank';
        card.rel = 'noopener';
        const iconUrl = faviconFor(item.url);
        card.innerHTML =
            `<span class="card-icon">${imgUrlOrFallback(iconUrl, item.title)}</span>` +
            `<div class="card-body">` +
                `<div class="card-title">${highlight(item.title, words)}</div>` +
                `<div class="card-desc">${escHtml(item.hover || '')}</div>` +
            `</div>`;
        // 给 img 绑定 error 事件，失败时替换为首字母
        const img = card.querySelector('img[data-fallback]');
        if (img) {
            img.addEventListener('error', () => {
                const ch = (item.title || '?').trim().charAt(0).toUpperCase();
                const span = document.createElement('span');
                span.className = 'card-fallback';
                span.textContent = ch;
                img.replaceWith(span);
            });
        }
        card.addEventListener('mouseenter', e => {
            playDing();
            tooltip.innerHTML =
                `<div class="tip-url">${escHtml(item.url)}</div>` +
                (item.hover ? `<div>${escHtml(item.hover)}</div>` : '');
            tooltip.style.display = 'block';
            updateTooltipPos(e);
        });
        card.addEventListener('mousemove', updateTooltipPos);
        card.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
        return card;
    }

    function imgUrlOrFallback(url, title) {
        if (!url) {
            const ch = (title || '?').trim().charAt(0).toUpperCase();
            return `<span class="card-fallback">${escHtml(ch)}</span>`;
        }
        // 用 src 触发，不靠 onerror 属性（避免引号转义问题）
        return `<img src="${url}" alt="" data-fallback="1">`;
    }

    function renderMenu() {
        main.innerHTML = '';
        const subs = groups[currentMenu] || [];
        if (!subs.length) {
            main.innerHTML = `<div class="empty">「${currentMenu}」分类下还没有内容</div>`;
            return;
        }
        const total = subs.reduce((s, c) => s + c.items.length, 0);
        // 标题
        const titleEl = document.createElement('div');
        titleEl.className = 'section-title';
        titleEl.innerHTML = `<span class="icon">📁</span> ${currentMenu} <span class="count">(${total})</span>`;
        main.appendChild(titleEl);
        // 每个子分类一组
        subs.forEach(sub => {
            if (subs.length > 1) {
                const subLabel = document.createElement('div');
                subLabel.className = 'subcat-label';
                subLabel.textContent = sub.catTitle + ' · ' + sub.items.length;
                main.appendChild(subLabel);
            }
            const grid = document.createElement('div');
            grid.className = 'card-grid';
            sub.items.forEach(item => grid.appendChild(makeCard(item, [])));
            main.appendChild(grid);
        });
    }

    let searchTimer = null;
    searchInput.addEventListener('input', e => {
        clearTimeout(searchTimer);
        const q = e.target.value;
        if (!q.trim()) { renderMenu(); return; }
        searchTimer = setTimeout(() => renderSearch(q), 200);
    });

    function renderSearch(query) {
        main.innerHTML = '';
        const words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
        const scored = allItems
            .map(item => ({ item, score: scoreItem(item, words) }))
            .filter(r => r.score >= 0)
            .sort((a, b) => b.score - a.score);
        if (!scored.length) {
            main.innerHTML = `<div class="empty">没有找到匹配 "${escHtml(query)}" 的书签</div>`;
            return;
        }
        const info = document.createElement('div');
        info.className = 'search-info';
        info.textContent = `找到 ${scored.length} 条结果`;
        main.appendChild(info);
        const grid = document.createElement('div');
        grid.className = 'card-grid';
        scored.forEach(({ item }) => grid.appendChild(makeCard(item, words)));
        main.appendChild(grid);
    }

    function updateTooltipPos(e) {
        const x = e.clientX + 14, y = e.clientY + 14;
        const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
        tooltip.style.left = (x + tw > window.innerWidth ? e.clientX - tw - 14 : x) + 'px';
        tooltip.style.top  = (y + th > window.innerHeight ? e.clientY - th - 14 : y) + 'px';
    }

    /* 侧栏折叠 */
    document.getElementById('menuBtn').onclick = () => {
        document.getElementById('sidebar').classList.toggle('collapsed');
    };

    /* 初始化 */
    renderMenu();
})();
</script>

    btn.style.background = '#238636';

}
</script>
