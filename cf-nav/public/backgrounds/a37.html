<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态云层渲染器</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        /* Style adjustments for dat.gui if needed */
        .dg.ac {
            z-index: 10 !important;
        }
        #instructions {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            pointer-events: none;
            z-index: 5;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="instructions">提示: 按 <b>Alt + H</b> 隐藏/显示控制台</div>

    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Include dat.gui for the control panel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>

    <script>
        // The vertex shader simply passes coordinates
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        // The fragment shader provided by the user, adapted slightly for Three.js
        const fragmentShader = `
            uniform vec2 iResolution;
            uniform float iTime;
            
            // Uniforms controlled by dat.gui
            uniform float cloudscale;
            uniform float speed;
            uniform float clouddark;
            uniform float cloudlight;
            uniform float cloudcover;
            uniform float cloudalpha;
            uniform float skytint;
            uniform vec3 skycolour1;
            uniform vec3 skycolour2;

            const mat2 m = mat2( 1.6,  1.2, -1.2,  1.6 );

            vec2 hash( vec2 p ) {
                p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)));
                return -1.0 + 2.0*fract(sin(p)*43758.5453123);
            }

            float noise( in vec2 p ) {
                const float K1 = 0.366025404; // (sqrt(3)-1)/2;
                const float K2 = 0.211324865; // (3-sqrt(3))/6;
                vec2 i = floor(p + (p.x+p.y)*K1);    
                vec2 a = p - i + (i.x+i.y)*K2;
                vec2 o = (a.x>a.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
                vec2 b = a - o + K2;
                vec2 c = a - 1.0 + 2.0*K2;
                vec3 h = max(0.5-vec3(dot(a,a), dot(b,b), dot(c,c) ), 0.0 );
                vec3 n = h*h*h*h*vec3( dot(a,hash(i+0.0)), dot(b,hash(i+o)), dot(c,hash(i+1.0)));
                return dot(n, vec3(70.0));    
            }

            float fbm(vec2 n) {
                float total = 0.0, amplitude = 0.1;
                for (int i = 0; i < 7; i++) {
                    total += noise(n) * amplitude;
                    n = m * n;
                    amplitude *= 0.4;
                }
                return total;
            }

            void mainImage( out vec4 fragColor, in vec2 fragCoord ) {
                vec2 p = fragCoord.xy / iResolution.xy;
                vec2 uv = p*vec2(iResolution.x/iResolution.y,1.0);    
                float time = iTime * speed;
                float q = fbm(uv * cloudscale * 0.5);
                
                //ridged noise shape
                float r = 0.0;
                uv *= cloudscale;
                uv -= q - time;
                float weight = 0.8;
                for (int i=0; i<8; i++){
                    r += abs(weight*noise( uv ));
                    uv = m*uv + time;
                    weight *= 0.7;
                }
                
                //noise shape
                float f = 0.0;
                uv = p*vec2(iResolution.x/iResolution.y,1.0);
                uv *= cloudscale;
                uv -= q - time;
                weight = 0.7;
                for (int i=0; i<8; i++){
                    f += weight*noise( uv );
                    uv = m*uv + time;
                    weight *= 0.6;
                }
                
                f *= r + f;
                
                //noise colour
                float c = 0.0;
                time = iTime * speed * 2.0;
                uv = p*vec2(iResolution.x/iResolution.y,1.0);
                uv *= cloudscale*2.0;
                uv -= q - time;
                weight = 0.4;
                for (int i=0; i<7; i++){
                    c += weight*noise( uv );
                    uv = m*uv + time;
                    weight *= 0.6;
                }
                
                //noise ridge colour
                float c1 = 0.0;
                time = iTime * speed * 3.0;
                uv = p*vec2(iResolution.x/iResolution.y,1.0);
                uv *= cloudscale*3.0;
                uv -= q - time;
                weight = 0.4;
                for (int i=0; i<7; i++){
                    c1 += abs(weight*noise( uv ));
                    uv = m*uv + time;
                    weight *= 0.6;
                }
                
                c += c1;
                
                vec3 skycolour = mix(skycolour2, skycolour1, p.y);
                vec3 cloudcolour = vec3(1.1, 1.1, 0.9) * clamp((clouddark + cloudlight*c), 0.0, 1.0);
               
                f = cloudcover + cloudalpha*f*r;
                
                vec3 result = mix(skycolour, clamp(skytint * skycolour + cloudcolour, 0.0, 1.0), clamp(f + c, 0.0, 1.0));
                
                fragColor = vec4( result, 1.0 );
            }

            void main() {
                mainImage(gl_FragColor, gl_FragCoord.xy);
            }
        `;

        let camera, scene, renderer;
        let uniforms;

        // Configuration object for dat.gui
        const params = {
            cloudscale: 1.1,
            speed: 0.03,
            clouddark: 0.5,
            cloudlight: 0.3,
            cloudcover: 0.2,
            cloudalpha: 8.0,
            skytint: 0.5,
            skycolour1: [ 51, 102, 153 ], // vec3(0.2, 0.4, 0.6) * 255
            skycolour2: [ 102, 178, 255 ]  // vec3(0.4, 0.7, 1.0) * 255
        };

        let gui;

        function init() {
            const container = document.getElementById( 'canvas-container' );

            camera = new THREE.OrthographicCamera( - 1, 1, 1, - 1, 0, 1 );

            scene = new THREE.Scene();

            const geometry = new THREE.PlaneGeometry( 2, 2 );

            uniforms = {
                iTime: { value: 1.0 },
                iResolution: { value: new THREE.Vector2() },
                cloudscale: { value: params.cloudscale },
                speed: { value: params.speed },
                clouddark: { value: params.clouddark },
                cloudlight: { value: params.cloudlight },
                cloudcover: { value: params.cloudcover },
                cloudalpha: { value: params.cloudalpha },
                skytint: { value: params.skytint },
                skycolour1: { value: new THREE.Vector3(params.skycolour1[0]/255, params.skycolour1[1]/255, params.skycolour1[2]/255) },
                skycolour2: { value: new THREE.Vector3(params.skycolour2[0]/255, params.skycolour2[1]/255, params.skycolour2[2]/255) }
            };

            const material = new THREE.ShaderMaterial( {
                uniforms: uniforms,
                vertexShader: vertexShader,
                fragmentShader: fragmentShader
            } );

            const mesh = new THREE.Mesh( geometry, material );
            scene.add( mesh );

            renderer = new THREE.WebGLRenderer();
            renderer.setPixelRatio( window.devicePixelRatio );
            container.appendChild( renderer.domElement );

            onWindowResize();
            window.addEventListener( 'resize', onWindowResize );
            
            setupGUI();
            setupKeyboardShortcut();
        }

        function setupGUI() {
            gui = new dat.GUI({ width: 300 });
            gui.domElement.parentNode.style.zIndex = '100'; // Ensure GUI is on top

            const folderGeneral = gui.addFolder('通用设置 (General)');
            folderGeneral.add(params, 'cloudscale', 0.1, 5.0).name('云层缩放 (Scale)').onChange(updateUniforms);
            folderGeneral.add(params, 'speed', 0.0, 0.2).name('运动速度 (Speed)').onChange(updateUniforms);
            folderGeneral.open();

            const folderAppearance = gui.addFolder('外观设置 (Appearance)');
            folderAppearance.add(params, 'cloudcover', -1.0, 1.0).name('云量 (Cover)').onChange(updateUniforms);
            folderAppearance.add(params, 'cloudalpha', 0.0, 20.0).name('云层厚度 (Alpha)').onChange(updateUniforms);
            folderAppearance.add(params, 'clouddark', 0.0, 2.0).name('云层暗部 (Dark)').onChange(updateUniforms);
            folderAppearance.add(params, 'cloudlight', 0.0, 2.0).name('云层亮部 (Light)').onChange(updateUniforms);
            folderAppearance.open();

            const folderColors = gui.addFolder('颜色设置 (Colors)');
            folderColors.add(params, 'skytint', 0.0, 1.0).name('天空染色 (Sky Tint)').onChange(updateUniforms);
            folderColors.addColor(params, 'skycolour1').name('天空色 1 (Top)').onChange(updateUniforms);
            folderColors.addColor(params, 'skycolour2').name('天空色 2 (Bottom)').onChange(updateUniforms);
            folderColors.open();
        }

        function updateUniforms() {
            uniforms.cloudscale.value = params.cloudscale;
            uniforms.speed.value = params.speed;
            uniforms.clouddark.value = params.clouddark;
            uniforms.cloudlight.value = params.cloudlight;
            uniforms.cloudcover.value = params.cloudcover;
            uniforms.cloudalpha.value = params.cloudalpha;
            uniforms.skytint.value = params.skytint;
            uniforms.skycolour1.value.set(params.skycolour1[0]/255, params.skycolour1[1]/255, params.skycolour1[2]/255);
            uniforms.skycolour2.value.set(params.skycolour2[0]/255, params.skycolour2[1]/255, params.skycolour2[2]/255);
        }
        
        function setupKeyboardShortcut() {
            let guiVisible = true;
            document.addEventListener('keydown', (event) => {
                // Check if Alt + H is pressed
                if (event.altKey && (event.key === 'h' || event.key === 'H')) {
                    event.preventDefault(); // Prevent default browser behavior if any
                    guiVisible = !guiVisible;
                    
                    const guiContainer = document.querySelector('.dg.ac');
                    if (guiContainer) {
                        guiContainer.style.display = guiVisible ? 'block' : 'none';
                    }
                }
            });
        }

        function onWindowResize() {
            renderer.setSize( window.innerWidth, window.innerHeight );
            uniforms.iResolution.value.x = renderer.domElement.width;
            uniforms.iResolution.value.y = renderer.domElement.height;
        }

        function animate() {
            requestAnimationFrame( animate );
            // Increment time based on performance instead of raw delta to match ShaderToy behavior better
            uniforms.iTime.value = performance.now() / 1000;
            renderer.render( scene, camera );
        }

        // Start the application
        init();
        animate();
    </script>
</body>
</html>
