<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导航</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: rgba(255,255,255,0.08);
  --text: #e6edf3;
  --text2: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  line-height: 1.5;
}

a { color: inherit; text-decoration: none; }

/* ── 顶部栏 ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  height: 56px;
  border-bottom: 1px solid var(--border);
  background: rgba(13,17,23,0.8);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* ── 搜索区 ── */
.search-section {
  padding: 40px 32px 24px;
  max-width: 720px;
  margin: 0 auto;
}
.search-box {
  display: flex;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 16px;
  gap: 10px;
  transition: border-color 0.2s;
}
.search-box:focus-within {
  border-color: var(--accent);
}
.search-icon { color: var(--text2); font-size: 0.9rem; }
.search-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 0.95rem;
  padding: 12px 0;
  font-family: var(--font);
}
.search-input::placeholder { color: var(--text2); }
.search-engines {
  display: flex;
  gap: 6px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.engine-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text2);
  font-size: 0.78rem;
  padding: 4px 12px;
  border-radius: 20px;
  cursor: pointer;
  font-family: var(--font);
  transition: all 0.15s;
}
.engine-btn:hover, .engine-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(88,166,255,0.08);
}

/* ── 分类 Tab ── */
.tabs-wrap {
  padding: 0 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 0;
  overflow-x: auto;
}
.tabs-wrap::-webkit-scrollbar { display: none; }
.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text2);
  font-size: 0.88rem;
  padding: 12px 18px;
  cursor: pointer;
  font-family: var(--font);
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
  margin-bottom: -1px;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active {
  color: var(--text);
  border-bottom-color: var(--accent);
}

/* ── 内容区 ── */
.content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 28px 32px 60px;
}

/* ── 分组标题 ── */
.group-title {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 24px 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.group-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ── 卡片网格 ── */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 8px;
}

/* ── 卡片 ── */
.nav-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, transform 0.15s;
  opacity: 0;
  transform: translateY(12px);
  animation: cardIn 0.3s ease forwards;
}
.nav-card:hover {
  background: var(--surface2);
  border-color: rgba(255,255,255,0.16);
  transform: translateY(-1px);
}
.nav-card .favicon {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  flex-shrink: 0;
  object-fit: contain;
  background: var(--surface2);
}
.nav-card .favicon-fallback {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  flex-shrink: 0;
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  color: var(--text2);
  font-weight: 600;
}
.nav-card .card-name {
  font-size: 0.85rem;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}

@keyframes cardIn {
  to { opacity: 1; transform: translateY(0); }
}

/* ── 淡出动画 ── */
.content.fade-out {
  opacity: 0;
  transform: translateY(-8px);
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.content.fade-in {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.22s ease, transform 0.22s ease;
}

/* ── 搜索结果 ── */
.search-info {
  font-size: 0.8rem;
  color: var(--text2);
  margin-bottom: 16px;
}
.empty-state {
  text-align: center;
  color: var(--text2);
  padding: 60px 0;
  font-size: 0.9rem;
}
mark {
  background: rgba(88,166,255,0.2);
  color: var(--accent);
  border-radius: 2px;
  padding: 0 2px;
}

@media (max-width: 600px) {
  .topbar, .search-section, .tabs-wrap, .content { padding-left: 16px; padding-right: 16px; }
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo">
    <div class="logo-dot"></div>
    导航
  </div>
</header>

<div class="search-section">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" placeholder="搜索书签..." autocomplete="off">
  </div>
  <div class="search-engines" id="enginesRow">
    <button class="engine-btn active" data-engine="site">站内</button>
    <button class="engine-btn" data-engine="google" data-url="https://www.google.com/search?q=">Google</button>
    <button class="engine-btn" data-engine="baidu" data-url="https://www.baidu.com/s?wd=">百度</button>
    <button class="engine-btn" data-engine="bing" data-url="https://www.bing.com/search?q=">Bing</button>
    <button class="engine-btn" data-engine="github" data-url="https://github.com/search?q=">GitHub</button>
  </div>
</div>

<div class="tabs-wrap" id="tabsWrap"></div>

<div class="content" id="content"></div>

<script id="nav-data" type="application/json">{{NAV_DATA}}</script>

<script>
(function() {
  var rawData = JSON.parse(document.getElementById('nav-data').textContent);
  var categories = rawData.categories || [];
  var allItems = [];
  categories.forEach(function(cat) {
    cat.items.forEach(function(item) {
      allItems.push(Object.assign({}, item, { catTitle: cat.title }));
    });
  });

  var currentTab = categories[0] ? categories[0].title : '';
  var activeEngine = 'site';

  document.querySelectorAll('.engine-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.engine-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      activeEngine = btn.dataset.engine;
    });
  });

  var searchInput = document.getElementById('searchInput');
  var searchTimer = null;
  searchInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var q = searchInput.value.trim();
      if (!q) return;
      if (activeEngine === 'site') {
        clearTimeout(searchTimer);
        renderSearch(q);
        return;
      }
      var btn = document.querySelector('.engine-btn[data-engine="' + activeEngine + '"]');
      if (btn && btn.dataset.url) window.open(btn.dataset.url + encodeURIComponent(q), '_blank');
    }
  });
  searchInput.addEventListener('input', function() {
    var q = searchInput.value.trim();
    clearTimeout(searchTimer);
    if (!q) { renderTab(currentTab); return; }
    searchTimer = setTimeout(function() { renderSearch(q); }, 180);
  });

  var tabsWrap = document.getElementById('tabsWrap');
  categories.forEach(function(cat, i) {
    var btn = document.createElement('button');
    btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
    btn.textContent = cat.title;
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      switchTab(cat.title);
    });
    tabsWrap.appendChild(btn);
  });

  function switchTab(title) {
    var content = document.getElementById('content');
    content.classList.add('fade-out');
    setTimeout(function() {
      currentTab = title;
      renderTab(title);
      content.classList.remove('fade-out');
      content.classList.add('fade-in');
      setTimeout(function() { content.classList.remove('fade-in'); }, 300);
    }, 180);
  }

  function favicon(url) {
    try {
      var host = new URL(url).hostname;
      return 'https://www.google.com/s2/favicons?domain=' + host + '&sz=32';
    } catch(e) { return ''; }
  }

  function makeCard(item, delay, words) {
    var card = document.createElement('a');
    card.className = 'nav-card';
    card.href = item.url;
    card.target = '_blank';
    card.rel = 'noopener';
    card.style.animationDelay = delay + 'ms';
    card.title = item.hover || item.title;

    var iconUrl = item.icon || favicon(item.url);
    var iconEl;
    if (iconUrl) {
      iconEl = document.createElement('img');
      iconEl.className = 'favicon';
      iconEl.src = iconUrl;
      iconEl.alt = '';
      iconEl.onerror = function() {
        var fb = document.createElement('div');
        fb.className = 'favicon-fallback';
        fb.textContent = (item.title || '?').charAt(0).toUpperCase();
        iconEl.replaceWith(fb);
      };
    } else {
      iconEl = document.createElement('div');
      iconEl.className = 'favicon-fallback';
      iconEl.textContent = (item.title || '?').charAt(0).toUpperCase();
    }

    var nameEl = document.createElement('span');
    nameEl.className = 'card-name';
    if (words && words.length) {
      var t = escHtml(item.title);
      words.forEach(function(w) {
        t = t.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'), function(m) { return '<mark>' + m + '</mark>'; });
      });
      nameEl.innerHTML = t;
    } else {
      nameEl.textContent = item.title;
    }

    card.appendChild(iconEl);
    card.appendChild(nameEl);
    return card;
  }

  function escHtml(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function renderTab(title) {
    var content = document.getElementById('content');
    content.innerHTML = '';
    var cat = categories.find(function(c) { return c.title === title; });
    if (!cat) return;
    var grid = document.createElement('div');
    grid.className = 'card-grid';
    cat.items.forEach(function(item, i) {
      grid.appendChild(makeCard(item, i * 40, []));
    });
    content.appendChild(grid);
  }

  function renderSearch(query) {
    var content = document.getElementById('content');
    content.innerHTML = '';
    var words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    var results = allItems.filter(function(item) {
      var t = (item.title || '').toLowerCase();
      var u = (item.url || '').toLowerCase();
      var h = (item.hover || '').toLowerCase();
      return words.every(function(w) { return t.includes(w) || u.includes(w) || h.includes(w); });
    });
    if (!results.length) {
      content.innerHTML = '<div class="empty-state">没有找到「' + escHtml(query) + '」相关书签</div>';
      return;
    }
    var info = document.createElement('div');
    info.className = 'search-info';
    info.textContent = '找到 ' + results.length + ' 条结果';
    content.appendChild(info);
    var grid = document.createElement('div');
    grid.className = 'card-grid';
    results.forEach(function(item, i) {
      grid.appendChild(makeCard(item, i * 30, words));
    });
    content.appendChild(grid);
  }

  renderTab(currentTab);
})();
</script>

</body>
</html>
