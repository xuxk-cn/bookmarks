<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shader 参数控制台</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #glcanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* 控制台主容器样式 */
        #controlPanel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(30, 30, 30, 0.85);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #fff;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }

        /* 控制台头部，支持拖拽 */
        #panelHeader {
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            cursor: move;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            user-select: none;
        }

        #panelHeader:active {
            background: rgba(255, 255, 255, 0.15);
        }

        /* 折叠按钮 */
        #toggleBtn {
            cursor: pointer;
            font-family: monospace;
            font-size: 16px;
            padding: 0 5px;
        }

        /* 参数内容区 */
        #panelContent {
            padding: 15px;
            display: block;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #ccc;
        }

        /* 滑动条样式重置与美化 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #4facfe;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #555;
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
    <!-- 引入 Three.js 用于渲染 WebGL Shader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 渲染画布 -->
    <canvas id="glcanvas"></canvas>

    <!-- 可拖拽控制台 -->
    <div id="controlPanel">
        <div id="panelHeader">
            <span>控制台 (Alt+H)</span>
            <span id="toggleBtn" title="折叠/展开">[-]</span>
        </div>
        <div id="panelContent">
            
            <div class="control-group">
                <label>水流速度 (Water Speed): <span id="val_waterSpeed">0.90</span></label>
                <input type="range" id="u_waterSpeed" min="0.0" max="3.0" step="0.05" value="0.9">
            </div>

            <div class="control-group">
                <label>镜头晃动 (Camera Shake): <span id="val_cameraShake">1.00</span></label>
                <input type="range" id="u_cameraShake" min="0.0" max="5.0" step="0.1" value="1.0">
            </div>

            <div class="control-group">
                <label>水平面位置 (Horizon Level): <span id="val_horizonY">0.00</span></label>
                <input type="range" id="u_horizonY" min="-1.0" max="1.0" step="0.05" value="0.0">
            </div>

            <div class="control-group">
                <label>月亮水平位置 (Moon X): <span id="val_moonPosX">0.60</span></label>
                <input type="range" id="u_moonPosX" min="-2.0" max="2.0" step="0.05" value="0.6">
            </div>

            <div class="control-group">
                <label>月亮垂直位置 (Moon Y): <span id="val_moonPosY">0.50</span></label>
                <input type="range" id="u_moonPosY" min="-1.0" max="2.0" step="0.05" value="0.5">
            </div>

            <div class="control-group">
                <label>月亮尺寸 (Moon Size): <span id="val_moonSize">0.20</span></label>
                <input type="range" id="u_moonSize" min="0.05" max="0.6" step="0.01" value="0.2">
            </div>

        </div>
    </div>

    <script>
        // -----------------------------------------------------------
        // 1. 初始化 Three.js 场景与渲染器
        // -----------------------------------------------------------
        const canvas = document.getElementById('glcanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        // 使用正交相机，恰好覆盖整个屏幕
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        
        // -----------------------------------------------------------
        // 2. 生成程序化噪声纹理以模拟 iChannel0 和 iChannel1
        // -----------------------------------------------------------
        function createRGBNoiseTexture(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(size, size);
            
            for(let i = 0; i < imgData.data.length; i += 4) {
                imgData.data[i] = Math.random() * 255;     // R
                imgData.data[i+1] = Math.random() * 255;   // G
                imgData.data[i+2] = Math.random() * 255;   // B
                imgData.data[i+3] = 255;                   // A
            }
            
            ctx.putImageData(imgData, 0, 0);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            texture.magFilter = THREE.LinearFilter;
            return texture;
        }

        const iChannel0 = createRGBNoiseTexture(512);
        const iChannel1 = createRGBNoiseTexture(512);

        // -----------------------------------------------------------
        // 3. 构建 Shader
        // -----------------------------------------------------------
        // 顶点着色器 (基础全屏四边形)
        const vertexShader = `#version 300 es
        in vec3 position;
        in vec2 uv;
        out vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.0);
        }`;

        // 片段着色器 (整合了用户的 Shader 及动态参数)
        const fragmentShader = `#version 300 es
        precision highp float;

        uniform vec3 iResolution;
        uniform float iTime;
        uniform sampler2D iChannel0;
        uniform sampler2D iChannel1;
        
        // 控制面板动态传入的参数
        uniform float u_waterSpeed;
        uniform float u_cameraShake;
        uniform float u_horizonY;
        uniform vec2 u_moonPos;
        uniform float u_moonSize;

        in vec2 vUv;
        out vec4 fragColor;

        float fbm( vec2 p )
        {
            return 0.5000*texture( iChannel1, p*1.00 ).x + 
                   0.2500*texture( iChannel1, p*2.02 ).x + 
                   0.1250*texture( iChannel1, p*4.03 ).x + 
                   0.0625*texture( iChannel1, p*8.04 ).x;
        }

        void mainImage( out vec4 fragColor, in vec2 fragCoord )
        {
            // 动画无限循环，不随时间淡出消失
            float time = mod( iTime, 1000.0 );
            vec2 p = (2.0*fragCoord-iResolution.xy) / iResolution.y;
            vec2 i = p;

            // camera (注入 u_cameraShake 乘数控制镜头晃动幅度)
            p += vec2(1.0,3.0)*0.001*2.0*cos( iTime*5.0 + vec2(0.0,1.5) ) * u_cameraShake;    
            p += vec2(1.0,3.0)*0.001*1.0*cos( iTime*9.0 + vec2(1.0,4.5) ) * u_cameraShake;    
            
            float an = 0.3*sin( 0.1*time );
            float co = cos(an);
            float si = sin(an);
            p = mat2( co, -si, si, co )*p*0.85;
            
            // water (注入 u_waterSpeed 控制水流速度)
            vec2 q = vec2(p.x,1.0)/p.y;
            q.y -= u_waterSpeed * time;    
            
            vec2 off = texture( iChannel0, 0.1*q*vec2(1.0,2.0) - vec2(0.0,0.007*iTime) ).xy;
            q += 0.4*(-1.0 + 2.0*off);
            vec3 col = 0.2*sqrt(texture( iChannel0, 0.05*q *vec2(1.0,4.0) + vec2(0.0,0.01*iTime) ).zyx);
            float re = 1.0-smoothstep( 0.0, 0.7, abs(p.x-0.6) - abs(p.y)*0.5+0.2 );
            col += 1.0*vec3(1.0,0.9,0.73)*re*0.2*(0.1+0.9*off.y)*5.0*(1.0-col.x);
            float re2 = 1.0-smoothstep( 0.0, 2.0, abs(p.x-0.6) - abs(p.y)*0.85 );
            col += 0.7*re2*smoothstep(0.35,1.0,texture( iChannel1, 0.075*q *vec2(1.0,4.0) ).x);
            
            // sky
            vec3 sky = vec3(0.0,0.05,0.1)*1.4;
            
            // stars    
            sky += 0.5*smoothstep( 0.95,1.00,texture( iChannel1, 0.25*p ).x);
            sky += 0.5*smoothstep( 0.85,1.0,texture( iChannel1, 0.25*p ).x);
            sky += 0.2*pow(1.0-max(0.0,p.y),2.0);
            
            // clouds    
            float f = fbm( 0.002*vec2(p.x,1.0)/p.y );
            vec3 cloud = vec3(0.3,0.4,0.5)*0.7*(1.0-0.85*smoothstep(0.4,1.0,f));
            sky = mix( sky, cloud, 0.95*smoothstep( 0.4, 0.6, f ) );
            sky = mix( sky, vec3(0.33,0.34,0.35), pow(1.0-max(0.0,p.y),2.0) );
            
            // 引入 u_horizonY 调节水平面高低交界处
            col = mix( col, sky, smoothstep(0.0, 0.1, p.y - u_horizonY) );

            // horizon
            col += 0.1*pow(clamp(1.0-abs(p.y - u_horizonY),0.0,1.0),9.0);

            // moon (注入 u_moonPos 控制月亮位置，u_moonSize 控制月球大小)
            float d = length(p - u_moonPos);
            vec3 moon = vec3(0.98,0.97,0.95)*(1.0-0.1*smoothstep(0.2,0.5,f));
            col += 0.8*moon*exp(-4.0*d)*vec3(1.1,1.0,0.8);
            col += 0.2*moon*exp(-2.0*d);
            moon *= 0.85+0.15*smoothstep(0.25,0.7,fbm(0.05*p+0.3));
            
            col = mix( col, moon, 1.0-smoothstep(u_moonSize, u_moonSize + 0.02, d) );
            
            // postprocess
            col = pow( 1.4*col, vec3(1.5,1.2,1.0) );    
            col *= clamp(1.0-0.3*length(i), 0.0, 1.0 );

            // 移除原本的淡出函数（fade），使动画永久循环播放
            fragColor = vec4( col, 1.0 );
        }

        void main() {
            vec2 fragCoord = vUv * iResolution.xy;
            mainImage(fragColor, fragCoord);
        }`;

        // Uniforms 的初始配置
        const uniforms = {
            iResolution: { value: new THREE.Vector3(window.innerWidth, window.innerHeight, 1) },
            iTime: { value: 0.0 },
            iChannel0: { value: iChannel0 },
            iChannel1: { value: iChannel1 },
            
            // 自定义受控参数
            u_waterSpeed: { value: 0.9 },
            u_cameraShake: { value: 1.0 },
            u_horizonY: { value: 0.0 },
            u_moonPos: { value: new THREE.Vector2(0.6, 0.5) },
            u_moonSize: { value: 0.2 }
        };

        const material = new THREE.RawShaderMaterial({
            vertexShader,
            fragmentShader,
            uniforms,
            depthWrite: false,
            depthTest: false
        });

        const geometry = new THREE.PlaneGeometry(2, 2);
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);

        // 窗口自适应大小调整
        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
            uniforms.iResolution.value.set(window.innerWidth, window.innerHeight, 1);
        });

        // 动画主循环
        function animate() {
            requestAnimationFrame(animate);
            uniforms.iTime.value = performance.now() / 1000.0;
            renderer.render(scene, camera);
        }
        animate();

        // -----------------------------------------------------------
        // 4. UI 控制面板交互逻辑
        // -----------------------------------------------------------
        
        const controlPanel = document.getElementById('controlPanel');
        const panelHeader = document.getElementById('panelHeader');
        const panelContent = document.getElementById('panelContent');
        const toggleBtn = document.getElementById('toggleBtn');
        
        // 4.1 拖拽功能实现
        let isDragging = false;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        panelHeader.addEventListener('mousedown', (e) => {
            if (e.target === toggleBtn) return; // 点击折叠按钮时不触发拖拽
            isDragging = true;
            // 获取鼠标距离面板左上角的偏移量
            const rect = controlPanel.getBoundingClientRect();
            dragOffsetX = e.clientX - rect.left;
            dragOffsetY = e.clientY - rect.top;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            // 计算新的位置并限制在窗口范围内（防止拖出屏幕外）
            let newX = e.clientX - dragOffsetX;
            let newY = e.clientY - dragOffsetY;
            
            // 基础边界检查
            newX = Math.max(0, Math.min(newX, window.innerWidth - controlPanel.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - controlPanel.offsetHeight));
            
            controlPanel.style.left = newX + 'px';
            controlPanel.style.top = newY + 'px';
            controlPanel.style.right = 'auto'; // 覆盖原有的 right 定位
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // 4.2 折叠/展开功能
        let isCollapsed = false;
        toggleBtn.addEventListener('click', () => {
            isCollapsed = !isCollapsed;
            if (isCollapsed) {
                panelContent.style.display = 'none';
                toggleBtn.innerText = '[+]';
            } else {
                panelContent.style.display = 'block';
                toggleBtn.innerText = '[-]';
            }
        });

        // 4.3 隐藏/显示面板 (Alt+H 快捷键)
        let isPanelVisible = true;
        window.addEventListener('keydown', (e) => {
            if (e.altKey && e.key.toLowerCase() === 'h') {
                isPanelVisible = !isPanelVisible;
                controlPanel.style.opacity = isPanelVisible ? '1' : '0';
                controlPanel.style.pointerEvents = isPanelVisible ? 'auto' : 'none';
                e.preventDefault(); // 阻止浏览器默认行为
            }
        });

        // 4.4 滑动条数据双向绑定与更新机制
        function bindSlider(sliderId, labelId, updateCallback) {
            const slider = document.getElementById(sliderId);
            const label = document.getElementById(labelId);
            
            slider.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                label.innerText = val.toFixed(2);
                updateCallback(val);
            });
        }

        // 绑定各个参数的滑块
        bindSlider('u_waterSpeed', 'val_waterSpeed', (val) => {
            uniforms.u_waterSpeed.value = val;
        });
        
        bindSlider('u_cameraShake', 'val_cameraShake', (val) => {
            uniforms.u_cameraShake.value = val;
        });

        bindSlider('u_horizonY', 'val_horizonY', (val) => {
            uniforms.u_horizonY.value = val;
        });
        
        bindSlider('u_moonPosX', 'val_moonPosX', (val) => {
            uniforms.u_moonPos.value.x = val;
        });
        
        bindSlider('u_moonPosY', 'val_moonPosY', (val) => {
            uniforms.u_moonPos.value.y = val;
        });
        
        bindSlider('u_moonSize', 'val_moonSize', (val) => {
            uniforms.u_moonSize.value = val;
        });

    </script>
</body>
</html>
