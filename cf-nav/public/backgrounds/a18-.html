<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL 体积云与动态模糊后处理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #glcanvas { display: block; width: 100vw; height: 100vh; }

        .glass-panel {
            background: rgba(20, 20, 25, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #ffffff; cursor: pointer; margin-top: -6px; box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 2px; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-white select-none font-sans">

    <canvas id="glcanvas"></canvas>

    <div id="control-panel" class="absolute top-5 left-5 w-72 rounded-xl glass-panel transition-all duration-300 z-50 flex flex-col">
        <div id="panel-header" class="flex justify-between items-center p-3 cursor-move border-b border-white/10 group">
            <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="font-bold text-sm tracking-wide">体积云与动态模糊控制台</span>
            </div>
            <button id="toggle-btn" class="text-gray-400 hover:text-white p-1 rounded hover:bg-white/10" title="折叠/展开">
                <svg id="chevron-icon" class="w-4 h-4 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
            </button>
        </div>

        <div id="panel-content" class="p-4 flex flex-col gap-4 overflow-hidden transition-all duration-300 origin-top">
            
            <div class="flex flex-col gap-1.5">
                <div class="flex justify-between items-center text-gray-300 text-sm font-medium">
                    <label for="speed-slider">飞行速度</label>
                    <span id="speed-val" class="font-mono text-blue-300">0.20</span>
                </div>
                <input type="range" id="speed-slider" min="0.0" max="1.5" step="0.01" value="0.20" class="w-full">
            </div>

            <div class="flex flex-col gap-1.5 mt-1 border-t border-white/10 pt-3">
                <div class="flex justify-between items-center text-gray-300 text-sm font-medium">
                    <label for="blur-slider" class="text-purple-400">动态模糊强度</label>
                    <span id="blur-val" class="font-mono text-purple-400 font-bold">1.00</span>
                </div>
                <input type="range" id="blur-slider" min="0.0" max="2.0" step="0.01" value="1.0" class="w-full">
            </div>

            <div class="flex flex-col gap-1.5 mt-1 border-t border-white/10 pt-3">
                <div class="flex justify-between items-center text-gray-300 text-sm font-medium">
                    <label for="density-slider">迷雾浓度</label>
                    <span id="density-val" class="font-mono text-blue-300">1.12</span>
                </div>
                <input type="range" id="density-slider" min="0.1" max="2.5" step="0.01" value="1.12" class="w-full">
            </div>

            <div class="flex flex-col gap-1.5 mt-1">
                <div class="flex justify-between items-center text-gray-300 text-sm font-medium">
                    <label for="color-picker">基础色调 (云色彩)</label>
                    <span id="color-val" class="font-mono text-pink-300 font-bold uppercase">#FFFFFF</span>
                </div>
                <div class="relative w-full h-8 rounded overflow-hidden border border-white/20">
                    <input type="color" id="color-picker" value="#ffffff" class="absolute -top-2 -left-2 w-[120%] h-[150%] cursor-pointer">
                </div>
            </div>

            <div class="flex flex-col gap-1.5 mt-1 border-t border-white/10 pt-3">
                <div class="flex justify-between items-center text-gray-300 text-sm font-medium">
                    <label for="quality-slider" class="text-yellow-400">渲染画质 (防卡顿)</label>
                    <span id="quality-val" class="font-mono text-yellow-400 font-bold">60%</span>
                </div>
                <input type="range" id="quality-slider" min="0.2" max="1.0" step="0.1" value="0.6" class="w-full">
            </div>
            
            <div class="p-2 rounded bg-white/5 text-[11px] text-gray-400 text-center">提示: Alt+H 可隐藏/显示面板</div>
        </div>
    </div>

    <script id="vs-standard" type="x-shader/x-vertex">
        attribute vec2 position;
        void main() { gl_Position = vec4(position, 0.0, 1.0); }
    </script>

    <script id="fs-main" type="x-shader/x-fragment">
        precision highp float;
        uniform vec3 iResolution;
        uniform float iTime;
        uniform vec2 iMouse;
        uniform float u_density;
        uniform vec3 u_cloudColor;
        uniform float u_speed;
        uniform float u_blurAmount;

        mat2 rot(in float a){float c = cos(a), s = sin(a);return mat2(c,s,-s,c);}
        const mat3 m3 = mat3(0.33338, 0.56034, -0.71817, -0.87887, 0.32651, -0.15323, 0.15162, 0.69596, 0.61339)*1.93;
        float mag2(vec2 p){return dot(p,p);}
        float linstep(in float mn, in float mx, in float x){ return clamp((x - mn)/(mx - mn), 0., 1.); }
        
        float prm1 = 0.;
        vec2 bsMo = vec2(0);

        vec2 disp(float t){ return vec2(sin(t*0.22)*1., cos(t*0.175)*1.)*2.; }

        vec2 map(vec3 p) {
            vec3 p2 = p;
            p2.xy -= disp(p.z).xy;
            p.xy *= rot(sin(p.z+iTime)*(0.1 + prm1*0.05) + iTime*0.09);
            float cl = mag2(p2.xy);
            float d = 0.;
            p *= .61;
            float z = 1.;
            float trk = 1.;
            float dspAmp = 0.1 + prm1*0.2;
            for(int i = 0; i < 5; i++) {
                p += sin(p.zxy*0.75*trk + iTime*trk*.8)*dspAmp;
                d -= abs(dot(cos(p), sin(p.yzx))*z);
                z *= 0.57; trk *= 1.4; p = p*m3;
            }
            d = abs(d + prm1*3.)+ prm1*.3 - 2.5 + bsMo.y;
            return vec2(d + cl*.2 + 0.25, cl);
        }

        vec4 renderClouds( in vec3 ro, in vec3 rd, float time ) {
            vec4 rez = vec4(0);
            float t = 1.5;
            float fogT = 0.;
            for(int i=0; i<100; i++) {
                if(rez.a > 0.99)break;
                vec3 pos = ro + t*rd;
                vec2 mpv = map(pos);
                float den = clamp(mpv.x-0.3,0.,1.) * u_density;
                float dn = clamp((mpv.x + 2.),0.,3.);
                
                vec4 col = vec4(0);
                if (mpv.x > 0.6) {
                    col = vec4(sin(vec3(5.,0.4,0.2) + mpv.y*0.1 +sin(pos.z*0.4)*0.5 + 1.8)*0.5 + 0.5,0.08);
                    col *= den*den*den;
                    col.rgb *= linstep(4.,-2.5, mpv.x)*2.3;
                    float dif =  clamp((den - map(pos+.8).x)/9., 0.001, 1. );
                    dif += clamp((den - map(pos+.35).x)/2.5, 0.001, 1. );
                    col.xyz *= den*(vec3(0.005,.045,.075) + 1.5*vec3(0.033,0.07,0.03)*dif);
                }
                float fogC = exp(t*0.2 - 2.2);
                col.rgba += vec4(0.06,0.11,0.11, 0.1)*clamp(fogC-fogT, 0., 1.);
                fogT = fogC;
                rez = rez + col*(1. - rez.a);
                t += clamp(0.5 - dn*dn*.05, 0.09, 0.3);
            }
            return clamp(rez, 0.0, 1.0);
        }

        float getsat(vec3 c){ float mi = min(min(c.x, c.y), c.z); float ma = max(max(c.x, c.y), c.z); return (ma - mi)/(ma+ 1e-7); }
        vec3 iLerp(in vec3 a, in vec3 b, in float x) {
            vec3 ic = mix(a, b, x) + vec3(1e-6,0.,0.);
            float sd = abs(getsat(ic) - mix(getsat(a), getsat(b), x));
            vec3 dir = normalize(vec3(2.*ic.x - ic.y - ic.z, 2.*ic.y - ic.x - ic.z, 2.*ic.z - ic.y - ic.x));
            float lgt = dot(vec3(1.0), ic);
            float ff = dot(dir, normalize(ic));
            ic += 1.5*dir*sd*ff*lgt;
            return clamp(ic,0.,1.);
        }

        vec3 computeScene(vec2 fragCoord) {
            vec2 q = fragCoord.xy / iResolution.xy;
            vec2 p = (fragCoord - 0.5 * iResolution.xy) / iResolution.y;
            bsMo = (iMouse.xy - 0.5 * iResolution.xy) / iResolution.y;
            
            float time = iTime * 3.;
            vec3 ro = vec3(0, 0, time);
            ro += vec3(sin(iTime)*0.5, 0.0, 0.0);
            float dspAmp = .85; ro.xy += disp(ro.z)*dspAmp; float tgtDst = 3.5;
            
            vec3 target = normalize(ro - vec3(disp(time + tgtDst)*dspAmp, time + tgtDst));
            ro.x -= bsMo.x*2.;
            vec3 rightdir = normalize(cross(target, vec3(0,1,0)));
            vec3 updir = normalize(cross(rightdir, target));
            rightdir = normalize(cross(updir, target));
            vec3 rd = normalize((p.x*rightdir + p.y*updir)*1. - target);
            rd.xy *= rot(-disp(time + 3.5).x*0.2 + bsMo.x);
            prm1 = smoothstep(-0.4, 0.4, sin(iTime*0.3));
            
            vec4 scn = renderClouds(ro, rd, time);
            vec3 col = scn.rgb;
            col = iLerp(col.bgr, col.rgb, clamp(1.-prm1, 0.05, 1.));
            
            // 转化为纯度过滤并混合用户选择的云颜色
            float gray = dot(col, vec3(0.299, 0.587, 0.114));
            col = mix(col, vec3(gray) * u_cloudColor * 1.5, 0.7);
            
            return clamp(col, 0.0, 1.0);
        }

        void main() {
            vec2 uv = gl_FragCoord.xy / iResolution.xy;
            vec3 col = vec3(0.0);

            if (u_blurAmount < 0.01 || u_speed < 0.001) {
                col = computeScene(gl_FragCoord.xy);
            } else {
                // 动态模糊采样
                vec2 radialDir = (uv - 0.5) * u_speed * u_blurAmount * 0.15;
                for (int i = 0; i < 16; i++) {
                    float t = float(i) / 15.0;
                    vec2 sampleCoord = (uv + radialDir * t) * iResolution.xy;
                    col += computeScene(sampleCoord);
                }
                col /= 16.0;
            }

            // 暗角
            col *= 0.5 + 0.5 * pow(16.0 * uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y), 0.1);
            col = clamp(col, 0.0, 1.0);
            col = col * 0.6 + 0.4 * col * col * (3.0 - 2.0 * col) + vec3(0.0, 0.0, 0.04);

            gl_FragColor = vec4(col, 1.0);
        }
    </script>

    <script>
        const canvas = document.getElementById('glcanvas');
        const gl = canvas.getContext('webgl');
        if (!gl) {
            alert('当前环境不支持 WebGL');
        }

        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
            }
            return shader;
        }

        const vsSource = document.getElementById('vs-standard').text;
        const fsSource = document.getElementById('fs-main').text;

        const program = gl.createProgram();
        gl.attachShader(program, createShader(gl, gl.VERTEX_SHADER, vsSource));
        gl.attachShader(program, createShader(gl, gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(program);

        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

        const posLoc = gl.getAttribLocation(program, 'position');
        gl.enableVertexAttribArray(posLoc);
        gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

        // 状态变量
        let flightSpeed = 0.20;
        let blurAmount = 1.0;
        let cloudDensity = 1.12;
        let cloudColor = [1.0, 1.0, 1.0];
        let renderScale = 0.6;
        let accumulatedTime = 0.0;
        let lastTimestamp = performance.now();
        let mouseX = 0, mouseY = 0;

        // 绑定 UI 控制台
        const bindSlider = (id, valId, callback) => {
            const el = document.getElementById(id);
            const valEl = document.getElementById(valId);
            el.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                if (valId !== 'quality-val') valEl.innerText = val.toFixed(2);
                callback(val);
            });
        };

        bindSlider('speed-slider', 'speed-val', v => flightSpeed = v);
        bindSlider('blur-slider', 'blur-val', v => blurAmount = v);
        bindSlider('density-slider', 'density-val', v => cloudDensity = v);
        bindSlider('quality-slider', 'quality-val', v => {
            renderScale = v;
            document.getElementById('quality-val').innerText = Math.round(v * 100) + '%';
        });

        document.getElementById('color-picker').addEventListener('input', (e) => {
            const hex = e.target.value;
            document.getElementById('color-val').innerText = hex.toUpperCase();
            cloudColor = [
                parseInt(hex.substr(1,2), 16) / 255,
                parseInt(hex.substr(3,2), 16) / 255,
                parseInt(hex.substr(5,2), 16) / 255
            ];
        });

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = window.innerHeight - e.clientY;
        });

        // 拖拽与折叠面板交互
        const panel = document.getElementById('control-panel');
        const header = document.getElementById('panel-header');
        let isDragging = false, startX, startY, initialX, initialY;

        header.addEventListener('mousedown', (e) => {
            if (e.target.closest('#toggle-btn')) return;
            isDragging = true;
            startX = e.clientX; startY = e.clientY;
            initialX = panel.offsetLeft; initialY = panel.offsetTop;
            panel.style.transition = 'none';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panel.style.left = Math.max(0, Math.min(window.innerWidth - panel.offsetWidth, initialX + e.clientX - startX)) + 'px';
            panel.style.top = Math.max(0, Math.min(window.innerHeight - header.offsetHeight, initialY + e.clientY - startY)) + 'px';
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            panel.style.transition = 'all 0.3s ease';
        });

        const toggleBtn = document.getElementById('toggle-btn');
        const panelContent = document.getElementById('panel-content');
        const chevron = document.getElementById('chevron-icon');
        let isCollapsed = false;

        function togglePanel() {
            isCollapsed = !isCollapsed;
            panelContent.style.maxHeight = isCollapsed ? '0px' : '500px';
            panelContent.style.paddingTop = isCollapsed ? '0' : '1rem';
            panelContent.style.paddingBottom = isCollapsed ? '0' : '1rem';
            panelContent.style.opacity = isCollapsed ? '0' : '1';
            chevron.style.transform = isCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)';
        }

        toggleBtn.addEventListener('click', togglePanel);
        header.addEventListener('dblclick', togglePanel);

        let isPanelVisible = true;
        window.addEventListener('keydown', (e) => {
            if (e.altKey && e.key.toLowerCase() === 'h') {
                e.preventDefault();
                isPanelVisible = !isPanelVisible;
                panel.style.opacity = isPanelVisible ? '1' : '0';
                panel.style.pointerEvents = isPanelVisible ? 'auto' : 'none';
            }
        });

        // 渲染循环
        function render(now) {
            const dt = (now - lastTimestamp) * 0.001;
            lastTimestamp = now;
            accumulatedTime += dt * flightSpeed;

            const targetWidth = Math.floor(window.innerWidth * renderScale);
            const targetHeight = Math.floor(window.innerHeight * renderScale);

            if (canvas.width !== targetWidth || canvas.height !== targetHeight) {
                canvas.width = targetWidth;
                canvas.height = targetHeight;
            }

            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.useProgram(program);

            gl.uniform3f(gl.getUniformLocation(program, 'iResolution'), canvas.width, canvas.height, 1.0);
            gl.uniform1f(gl.getUniformLocation(program, 'iTime'), accumulatedTime);
            gl.uniform2f(gl.getUniformLocation(program, 'iMouse'), mouseX, mouseY);
            gl.uniform1f(gl.getUniformLocation(program, 'u_density'), cloudDensity);
            gl.uniform3fv(gl.getUniformLocation(program, 'u_cloudColor'), cloudColor);
            gl.uniform1f(gl.getUniformLocation(program, 'u_speed'), flightSpeed);
            gl.uniform1f(gl.getUniformLocation(program, 'u_blurAmount'), blurAmount);

            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
    </script>
</body>
</html>
