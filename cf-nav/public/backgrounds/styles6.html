<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航 - Dashy 风格</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#0a1729;color:#cfd8dc;min-height:100vh;overflow-x:hidden}

/* 整体容器 */
.app{max-width:1400px;margin:0 auto;padding:30px 20px}

/* 顶部 */
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand-title{color:#00d4aa;font-size:32px;font-weight:600;letter-spacing:1px}
.brand-sub{color:#cfd8dc;font-size:13px;font-style:italic;opacity:.7}
.top-links{display:flex;gap:8px;align-items:center}
.top-link{padding:6px 14px;border:1px solid rgba(0,212,170,.3);border-radius:4px;color:#cfd8dc;font-size:12px;cursor:pointer;transition:all .2s;text-decoration:none}
.top-link:hover{background:rgba(0,212,170,.1);border-color:#00d4aa;color:#00d4aa}

/* 配置栏 */
.config-bar{display:flex;justify-content:flex-end;gap:14px;align-items:center;margin-bottom:20px;flex-wrap:wrap;font-size:12px;color:#cfd8dc}
.config-item{display:flex;align-items:center;gap:6px}
.config-label{color:#cfd8dc;opacity:.7}
.config-select,.config-btn{background:#0d1729;border:1px solid rgba(0,212,170,.25);border-radius:4px;color:#cfd8dc;padding:4px 8px;font-size:11px;cursor:pointer;outline:none}
.config-select:focus,.config-btn:focus{border-color:#00d4aa}
.config-btns{display:flex;gap:4px}
.config-btns button{background:#0d1729;border:1px solid rgba(0,212,170,.2);color:#cfd8dc;width:24px;height:24px;border-radius:3px;cursor:pointer;font-size:11px;transition:all .2s}
.config-btns button:hover{border-color:#00d4aa;color:#00d4aa}
.config-btns button.active{background:#00d4aa;color:#0a1729;border-color:#00d4aa}

/* 搜索行 */
.search-row{display:flex;gap:12px;align-items:center;margin-bottom:24px;flex-wrap:wrap}
.search-box{flex:1;min-width:280px;background:#0d1729;border:1px solid rgba(0,212,170,.25);border-radius:4px;padding:8px 14px;color:#cfd8dc;font-size:13px;outline:none}
.search-box:focus{border-color:#00d4aa}
.search-box::placeholder{color:#5f6975;font-style:italic}

/* Section 分组网格 */
.sections{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.section{background:#0d1729;border:1px solid rgba(0,212,170,.3);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-height:240px}
.section-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(0,212,170,.08);border-bottom:1px solid rgba(0,212,170,.2);color:#00d4aa;font-size:13px;font-weight:600;cursor:pointer;user-select:none}
.section-header i{font-size:14px}
.section-header .toggle{margin-left:auto;color:#00d4aa;opacity:.6;transition:transform .2s;font-size:11px}
.section.collapsed .section-header .toggle{transform:rotate(-90deg)}
.section.collapsed .section-body{display:none}
.section-body{padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}

/* 垂直卡片 */
.card-v{background:#0a1729;border:1px solid rgba(0,212,170,.08);border-radius:4px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:all .2s;min-height:90px}
.card-v:hover{border-color:#00d4aa;background:#0f1d36;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,212,170,.15)}
.card-v-icon{width:32px;height:32px;border-radius:4px;background:#fff;overflow:hidden;margin-bottom:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-v-icon img{width:90%;height:90%;object-fit:contain}
.card-v-title{color:#cfd8dc;font-size:11px;font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.card-v:hover .card-v-title{color:#00d4aa}
.card-v-desc{color:#5f6975;font-size:9px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;max-width:100%;min-height:24px}

/* 回到顶部 */
.to-top{position:fixed;right:30px;bottom:30px;width:44px;height:44px;background:#0d1729;border:1px solid rgba(0,212,170,.3);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#00d4aa;cursor:pointer;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:all .2s;z-index:50;opacity:0;pointer-events:none}
.to-top.show{opacity:1;pointer-events:auto}
.to-top:hover{background:#00d4aa;color:#0a1729}

/* 底部 */
.footer{text-align:center;padding:30px 20px 10px;color:#5f6975;font-size:11px}
.footer a{color:#00d4aa;text-decoration:none}
.footer a:hover{text-decoration:underline}

@media(max-width:1100px){.sections{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.sections{grid-template-columns:1fr}.section-body{grid-template-columns:repeat(2,1fr)}.brand-title{font-size:24px}}
</style>
</head>

<script>
const DATA=JSON.parse(document.getElementById('nav-data').textContent);
const SECTIONS=DATA.sections;
const CATS=DATA.cats;
const sectionsEl=document.getElementById('sections');
const searchEl=document.getElementById('search');
const totopEl=document.getElementById('totop');

function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function getHost(url){try{return new URL(url).hostname}catch(e){return ''}}
function favicon(url){const h=getHost(url);return h?`https://www.google.com/s2/favicons?domain=${h}&sz=64`:''}

function buildSections(){
    SECTIONS.forEach(sec=>{
        const items=CATS[sec.title]||[];
        const div=document.createElement('div');
        div.className='section';
        div.dataset.cat=sec.title;
        div.innerHTML=`
            <div class="section-header">
                <i class="fa ${sec.icon}"></i>
                <span>${escHtml(sec.title)}</span>
                <span style="margin-left:auto;color:#5f6975;font-size:11px;font-weight:400">${items.length}</span>
                <span class="toggle"><i class="fa fa-chevron-down"></i></span>
            </div>
            <div class="section-body"></div>`;
        const body=div.querySelector('.section-body');
        items.forEach(it=>{
            const card=document.createElement('div');
            card.className='card-v';
            card.dataset.title=it.t.toLowerCase();
            card.dataset.desc=(it.h||'').toLowerCase();
            card.onclick=()=>window.open(it.u,'_blank');
            card.innerHTML=`
                <div class="card-v-icon"><img src="${favicon(it.u)}" onerror="this.style.visibility='hidden'" alt=""></div>
                <div class="card-v-title">${escHtml(it.t)}</div>
                <div class="card-v-desc">${escHtml(it.h||'')}</div>`;
            body.appendChild(card);
        });
        const header=div.querySelector('.section-header');
        header.onclick=()=>div.classList.toggle('collapsed');
        sectionsEl.appendChild(div);
    });
}

function applyFilter(q){
    const query=q.trim().toLowerCase();
    document.querySelectorAll('.section').forEach(sec=>{
        const cat=sec.dataset.cat;
        let visible=0;
        sec.querySelectorAll('.card-v').forEach(card=>{
            const match=!query||card.dataset.title.includes(query)||card.dataset.desc.includes(query);
            card.style.display=match?'':'none';
            if(match)visible++;
        });
        sec.style.display=(visible===0&&query)?'none':'';
        const counter=sec.querySelector('.section-header span:nth-child(3)');
        const total=(CATS[cat]||[]).length;
        counter.textContent=query?visible+'/'+total:total;
    });
}

buildSections();

searchEl.addEventListener('input',e=>applyFilter(e.target.value));

document.querySelectorAll('#layout-btns button').forEach(b=>{
    b.onclick=()=>{
        document.querySelectorAll('#layout-btns button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        const layout=b.dataset.layout;
        sectionsEl.style.gridTemplateColumns=layout==='horizontal'?'repeat(4,1fr)':layout==='vertical'?'repeat(2,1fr)':'repeat(3,1fr)';
    };
});

document.querySelectorAll('#size-btns button').forEach(b=>{
    b.onclick=()=>{
        document.querySelectorAll('#size-btns button').forEach(x=>x.classList.remove('active'));
        b.classList.add('active');
        const size=b.dataset.size;
        const scale=size==='large'?1.1:size==='small'?0.9:1;
        document.querySelectorAll('.card-v').forEach(c=>{
            c.style.padding=(12*scale)+'px '+(6*scale)+'px';
            c.style.minHeight=(90*scale)+'px';
        });
    };
});

window.addEventListener('scroll',()=>{
    totopEl.classList.toggle('show',window.scrollY>400);
});
totopEl.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
</script>
