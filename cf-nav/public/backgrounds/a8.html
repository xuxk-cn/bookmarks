<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Cloud Sky Studio</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:"Microsoft YaHei",sans-serif;
user-select:none;
}

canvas{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
display:block;
}

#panel{

position:absolute;

left:25px;
top:25px;

width:340px;

background:rgba(30,30,35,.82);

backdrop-filter:blur(16px);

border-radius:14px;

border:1px solid rgba(255,255,255,.08);

color:white;

box-shadow:
0 15px 40px rgba(0,0,0,.45);

overflow:hidden;

z-index:99;

transition:.25s;

}

#title{

height:42px;

line-height:42px;

padding-left:15px;

font-size:16px;

font-weight:bold;

cursor:move;

background:#1b1d22;

display:flex;

justify-content:space-between;

align-items:center;

}

#buttons{

margin-right:10px;

display:flex;

gap:8px;

}

.btn{

width:18px;

height:18px;

border-radius:5px;

background:#444;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

font-size:12px;

}

#body{

padding:14px;

max-height:80vh;

overflow-y:auto;

}

.item{

margin-bottom:15px;

}

.item label{

display:flex;

justify-content:space-between;

font-size:13px;

margin-bottom:4px;

}

.item input{

width:100%;

}

input[type=range]{

accent-color:#55ccff;

}

#fps{

margin-top:10px;

font-size:13px;

color:#9ee9ff;

}

.hidden{

display:none;

}

</style>

</head>

<body>

<canvas id="gl"></canvas>

<!-- 这里直接加上 class="hidden" 实现默认隐藏，去掉了末尾冲突的 JS 脚本 -->
<div id="panel" class="hidden">

<div id="title">

<div>

☁ Cloud Sky Studio

</div>

<div id="buttons">

<div id="collapse" class="btn">—</div>

</div>

</div>

<div id="body">

<div class="item">

<label>

<span>云密度</span>

<span id="densityValue">0.50</span>

</label>

<input id="density"

type="range"

min="0"

max="2"

step="0.01"

value="0.5">

</div>

<div class="item">

<label>

<span>云缩放</span>

<span id="scaleValue">0.00025</span>

</label>

<input id="scale"

type="range"

min="0.00005"

max="0.001"

step="0.00001"

value="0.00025">

</div>

<div class="item">

<label>

<span>飞行速度</span>

<span id="speedValue">1.0</span>

</label>

<input id="speed"

type="range"

min="0"

max="5"

step="0.01"

value="1">

</div>

<div class="item">

<label>

<span>步进距离</span>

<span id="stepValue">200</span>

</label>

<input id="step"

type="range"

min="20"

max="600"

step="10"

value="200">

</div>

<div class="item">

<label>

<span>采样距离</span>

<span id="distanceValue">100000</span>

</label>

<input id="distance"

type="range"

min="5000"

max="150000"

step="1000"

value="100000">

</div>

<div class="item">

<label>

<span>太阳亮度</span>

<span id="sunValue">1.0</span>

</label>

<input id="sun"

type="range"

min="0"

max="3"

step="0.01"

value="1">

</div>

<div id="fps">

FPS：

<span id="fpsText">0</span>

<div style="font-size:11px; color:#888; margin-top:8px; text-align:center; border-top:1px solid rgba(255,255,255,0.1); padding-top:8px;">按 Alt + N 隐藏/显示控制台</div>

</div>

</div>

</div>

<script>

const canvas=document.getElementById("gl");

const gl=canvas.getContext("webgl");

if(!gl){

alert("浏览器不支持WebGL");

throw "";

}

function resize(){

canvas.width=innerWidth;

canvas.height=innerHeight;

gl.viewport(0,0,canvas.width,canvas.height);

}

window.onresize=resize;

resize();

const vertexSource=`

attribute vec2 p;

void main(){

gl_Position=vec4(p,0.0,1.0);

}

`;

function compile(type,src){

const s=gl.createShader(type);

gl.shaderSource(s,src);

gl.compileShader(s);

if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){

console.error(gl.getShaderInfoLog(s));

}

return s;

}

function createProgram(fragment){

const vs=compile(gl.VERTEX_SHADER,vertexSource);

const fs=compile(gl.FRAGMENT_SHADER,fragment);

const program=gl.createProgram();

gl.attachShader(program,vs);

gl.attachShader(program,fs);

gl.linkProgram(program);

if(!gl.getProgramParameter(program,gl.LINK_STATUS)){

console.error(gl.getProgramInfoLog(program));

}

return program;

}

const buffer=gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER,buffer);

gl.bufferData(

gl.ARRAY_BUFFER,

new Float32Array([

-1,-1,

1,-1,

-1,1,

1,1

]),

gl.STATIC_DRAW

);

let drag=false;

let dx=0;

let dy=0;

const panel=document.getElementById("panel");

const title=document.getElementById("title");

title.onmousedown=e=>{

drag=true;

dx=e.clientX-panel.offsetLeft;

dy=e.clientY-panel.offsetTop;

};

window.onmouseup=()=>drag=false;

window.onmousemove=e=>{

if(!drag)return;

panel.style.left=(e.clientX-dx)+"px";

panel.style.top=(e.clientY-dy)+"px";

};

let collapsed=false;

collapse.onclick=()=>{

collapsed=!collapsed;

document.getElementById("body").style.display=

collapsed?"none":"block";

};

window.addEventListener("keydown",e=>{

if(e.altKey&&e.key.toLowerCase()=="n"){

panel.classList.toggle("hidden");

}

});

const uniforms={

density:0.5,

scale:0.00025,

speed:1.0,

step:200,

distance:100000,

sun:1.0

};

function bind(id,key,text){

const s=document.getElementById(id);

const t=document.getElementById(text);

s.oninput=()=>{

uniforms[key]=parseFloat(s.value);

t.innerHTML=s.value;

};

}

bind("density","density","densityValue");

bind("scale","scale","scaleValue");

bind("speed","speed","speedValue");

bind("step","step","stepValue");

bind("distance","distance","distanceValue");

bind("sun","sun","sunValue");

let start=performance.now();

let frame=0;

let last=performance.now();
const fragmentSource = `

precision highp float;

uniform vec2 iResolution;
uniform float iTime;

uniform float uDensity;
uniform float uScale;
uniform float uSpeed;
uniform float uStep;
uniform float uDistance;
uniform float uSun;

#define iChannel0 0

vec3 skytop = vec3(0.05,0.20,0.50);

vec3 light = normalize(vec3(0.10,0.25,0.90));

vec2 cloudrange = vec2(0.0,10000.0);

mat3 m = mat3(

0.00,1.60,1.20,

-1.60,0.72,-0.96,

-1.20,-0.96,1.28

);

float hash(float n){

return fract(cos(n)*114514.1919);

}

float noise(vec3 x){

vec3 p=floor(x);

vec3 f=smoothstep(0.0,1.0,fract(x));

float n=p.x+p.y*10.0+p.z*100.0;

return mix(

mix(

mix(hash(n+0.0),hash(n+1.0),f.x),

mix(hash(n+10.0),hash(n+11.0),f.x),

f.y

),

mix(

mix(hash(n+100.0),hash(n+101.0),f.x),

mix(hash(n+110.0),hash(n+111.0),f.x),

f.y

),

f.z

);

}

float fbm(vec3 p){

float f=0.5*noise(p);

p=m*p;

f+=0.25*noise(p);

p=m*p;

f+=0.1666*noise(p);

p=m*p;

f+=0.0834*noise(p);

return f;

}

vec3 camera(float time){

return vec3(

5000.0*sin(time),

5000.0+1500.0*sin(time*0.5),

6000.0*time

);

}

void mainImage(out vec4 fragColor,in vec2 fragCoord){

vec2 uv=2.0*fragCoord/iResolution-1.0;

uv.x*=iResolution.x/iResolution.y;

float time=(iTime+57.5)*uSpeed;

vec3 campos=camera(time);

vec3 camtar=camera(time+0.4);

vec3 front=normalize(camtar-campos);

vec3 right=normalize(cross(front,vec3(0.0,1.0,0.0)));

vec3 up=normalize(cross(right,front));

vec3 fragAt=normalize(

uv.x*right+

uv.y*up+

front

);

vec4 sum=vec4(0.0);

for(float depth=0.0;depth<150000.0;depth+=20.0){

if(depth>uDistance)break;

if(mod(depth,uStep)>1.0)continue;

vec3 ray=campos+fragAt*depth;

if(ray.y>cloudrange.x&&ray.y<cloudrange.y){

float alpha=smoothstep(

0.5,

1.0,

fbm(ray*uScale)

);

alpha*=uDensity;

vec3 localcolor=mix(

vec3(1.1,1.05,1.0),

vec3(0.3,0.3,0.2),

alpha

);

alpha=(1.0-sum.a)*alpha;

sum+=vec4(localcolor*alpha,alpha);

}

}

float alpha=smoothstep(

0.7,

1.0,

sum.a

);

sum.rgb/=sum.a+0.0001;

float sundot=clamp(

dot(fragAt,light),

0.0,

1.0

);

vec3 col=0.8*skytop;

col+=0.47*

vec3(1.6,1.4,1.0)

*pow(sundot,350.0)

*uSun;

col+=0.4*

vec3(0.8,0.9,1.0)

*pow(sundot,2.0)

*uSun;

sum.rgb-=

0.6*

vec3(0.8,0.75,0.7)

*

pow(sundot,13.0)

*

alpha;

sum.rgb+=

0.2*

vec3(1.3,1.2,1.0)

*

pow(sundot,5.0)

*

(1.0-alpha);

col=mix(col,sum.rgb,sum.a);

fragColor=vec4(col,1.0);

}

void main(){

mainImage(gl_FragColor,gl_FragCoord.xy);

}

`;

const program=createProgram(fragmentSource);

gl.useProgram(program);

const locPosition=gl.getAttribLocation(program,"p");

gl.enableVertexAttribArray(locPosition);

gl.vertexAttribPointer(

locPosition,

2,

gl.FLOAT,

false,

0,

0

);

const locResolution=gl.getUniformLocation(program,"iResolution");

const locTime=gl.getUniformLocation(program,"iTime");

const locDensity=gl.getUniformLocation(program,"uDensity");

const locScale=gl.getUniformLocation(program,"uScale");

const locSpeed=gl.getUniformLocation(program,"uSpeed");

const locStep=gl.getUniformLocation(program,"uStep");

const locDistance=gl.getUniformLocation(program,"uDistance");

const locSun=gl.getUniformLocation(program,"uSun");


function render(now){

gl.useProgram(program);

const locPos2=gl.getAttribLocation(program,"p");

gl.enableVertexAttribArray(locPos2);

gl.vertexAttribPointer(locPos2,2,gl.FLOAT,false,0,0);

gl.uniform2f(locResolution,canvas.width,canvas.height);

gl.uniform1f(locTime,(now-start)/1000);

gl.uniform1f(locDensity,uniforms.density);

gl.uniform1f(locScale,uniforms.scale);

gl.uniform1f(locSpeed,uniforms.speed);

gl.uniform1f(locStep,uniforms.step);

gl.uniform1f(locDistance,uniforms.distance);

gl.uniform1f(locSun,uniforms.sun);

gl.drawArrays(gl.TRIANGLE_STRIP,0,4);

frame++;

const now2=performance.now();

if(now2-last>=1000){

document.getElementById("fpsText").textContent=frame;

frame=0;

last=now2;

}

requestAnimationFrame(render);

}

requestAnimationFrame(render);

</script>
</body>
</html>
