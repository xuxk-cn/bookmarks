*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Courier New','PingFang SC','Microsoft YaHei',monospace,sans-serif;background:#0f1729;color:#a8dadc;min-height:100vh;padding:20px;position:relative;overflow-x:hidden}

/* 网格背景 */
body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(72,209,204,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(72,209,204,.04) 1px,transparent 1px);background-size:30px 30px;pointer-events:none;z-index:0}

/* 顶部窗口栏 */
.window-bar{display:flex;align-items:center;background:#1a2740;border:1px solid rgba(72,209,204,.25);border-radius:6px 6px 0 0;padding:6px 12px;margin-bottom:0;max-width:1200px;margin:0 auto}
.window-bar .tab{display:flex;align-items:center;gap:6px;color:#a8dadc;font-size:12px;padding:4px 10px;border-radius:4px}
.window-bar .tab.active{background:#48d1cc;color:#0f1729;font-weight:600}
.window-bar .tab .x{color:#ff6b6b;margin-left:4px}
.window-bar .url{flex:1;background:#0f1729;border:1px solid rgba(72,209,204,.2);border-radius:4px;padding:4px 12px;color:#a8dadc;font-size:12px;margin:0 12px}
.window-bar .icons{display:flex;gap:8px;color:#48d1cc;font-size:13px}
.window-bar .icons i{cursor:pointer;padding:4px}

.window-actions{position:absolute;top:10px;right:20px;display:flex;gap:6px;color:#a8dadc;font-size:13px;z-index:10}
.window-actions i{cursor:pointer;padding:4px}
.window-actions .minimize,.window-actions .maximize,.window-actions .close{padding:2px 8px;border:1px solid rgba(72,209,204,.3);border-radius:3px}

/* 主体容器 */
.container{max-width:1200px;margin:0 auto;border:1px solid rgba(72,209,204,.25);border-top:none;border-radius:0 0 6px 6px;padding:30px 20px 40px;background:#0f1729}

/* 标题区 */
.title{text-align:center;font-size:42px;color:#48d1cc;font-weight:bold;text-shadow:0 0 12px rgba(72,209,204,.5);margin-bottom:8px;letter-spacing:2px}
.subtitle{text-align:center;color:#a8dadc;font-size:14px;margin-bottom:30px;opacity:.7}

/* 搜索框 */
.search-wrap{display:flex;justify-content:center;margin-bottom:30px}
.search-box{width:380px;max-width:90%;background:#1a2740;border:1px solid rgba(72,209,204,.3);border-radius:4px;padding:8px 14px;color:#48d1cc;font-family:'Courier New',monospace;font-size:13px;outline:none}
.search-box:focus{border-color:#48d1cc;box-shadow:0 0 8px rgba(72,209,204,.3)}

/* 分类网格 */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;max-width:1100px;margin:0 auto}
.cat{background:#1a2740;border:1px solid rgba(72,209,204,.2);border-radius:4px;padding:14px;cursor:pointer;transition:all .25s;text-align:center;position:relative;overflow:hidden}
.cat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#48d1cc,transparent);opacity:0;transition:opacity .3s}
.cat:hover{border-color:#48d1cc;transform:translateY(-2px);box-shadow:0 4px 16px rgba(72,209,204,.2)}
.cat:hover::before{opacity:1}
.cat.active{border-color:#48d1cc;background:#1f3050;box-shadow:0 0 12px rgba(72,209,204,.15)}
.cat-name{color:#48d1cc;font-size:14px;font-weight:600;letter-spacing:1px}
.cat-count{display:block;color:#6c8a9a;font-size:11px;margin-top:4px}

/* 主面板 */
.panel{background:#1a2740;border:1px solid rgba(72,209,204,.25);border-radius:4px;max-width:1100px;margin:20px auto 0;overflow:hidden}
.panel-header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid rgba(72,209,204,.2);background:#15233d}
.panel-title{color:#48d1cc;font-size:13px;font-weight:600}
.panel-meta{margin-left:auto;color:#6c8a9a;font-size:11px;font-family:'Courier New',monospace}

/* 卡片表格 */
.cards{padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:#15233d;border:1px solid rgba(72,209,204,.15);border-radius:3px;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .2s;position:relative}
.card:hover{border-color:#48d1cc;background:#1a2740;transform:translateX(2px)}
.card-icon{width:28px;height:28px;border-radius:3px;background:#0f1729;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-icon img{width:90%;height:90%;object-fit:contain}
.card-body{flex:1;min-width:0}
.card-title{color:#a8dadc;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-desc{color:#6c8a9a;font-size:10px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card:hover .card-title{color:#48d1cc}
.card::after{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:2px;height:0;background:#48d1cc;transition:height .2s}
.card:hover::after{height:70%}

/* 状态栏 */
.status-bar{max-width:1100px;margin:20px auto 0;background:#1a2740;border:1px solid rgba(72,209,204,.2);border-radius:4px;padding:8px 14px;display:flex;align-items:center;gap:20px;font-size:11px;color:#6c8a9a;font-family:'Courier New',monospace}
.status-bar .dot{width:8px;height:8px;border-radius:50%;background:#48d1cc;box-shadow:0 0 6px #48d1cc;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}.title{font-size:32px}}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.cards{grid-template-columns:1fr}.title{font-size:26px}.cats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<script>
const DATA=JSON.parse(document.getElementById('nav-data').textContent);
const TABS=DATA.tabs;
const CATS=DATA.cats;
const catsEl=document.getElementById('cats');
const panelEl=document.getElementById('panel');
const cardsEl=document.getElementById('cards');
const panelTitle=document.getElementById('panel-title');
const panelMeta=document.getElementById('panel-meta');
const searchEl=document.getElementById('search');
const totalMeta=document.getElementById('total-meta');

function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function getHost(url){try{return new URL(url).hostname}catch(e){return ''}}
function favicon(url){const h=getHost(url);return h?`https://www.google.com/s2/favicons?domain=${h}&sz=64`:''}

function buildCats(){
    TABS.forEach((cat,idx)=>{
        const items=CATS[cat]||[];
        const div=document.createElement('div');
        div.className='cat'+(idx===0?' active':'');
        div.dataset.cat=cat;
        div.innerHTML=`<div class="cat-name">${escHtml(cat)}</div><span class="cat-count">${items.length} items</span>`;
        div.onclick=()=>selectCat(cat);
        catsEl.appendChild(div);
    });
}

function buildCard(item){
    const card=document.createElement('div');
    card.className='card';
    card.onclick=()=>window.open(item.u,'_blank');
    card.innerHTML=`
        <div class="card-icon"><img src="${favicon(item.u)}" onerror="this.style.visibility='hidden'" alt=""></div>
        <div class="card-body">
            <div class="card-title">${escHtml(item.t)}</div>
            <div class="card-desc">${escHtml(item.h||'')}</div>
        </div>`;
    return card;
}

function renderPanel(cat){
    panelTitle.textContent=cat;
    cardsEl.innerHTML='';
    const items=CATS[cat]||[];
    panelMeta.textContent=items.length+' items';
    items.forEach(it=>cardsEl.appendChild(buildCard(it)));
    panelEl.style.display='block';
}

function renderSearch(q){
    const query=q.trim().toLowerCase();
    if(!query){
        const active=document.querySelector('.cat.active');
        if(active)renderPanel(active.dataset.cat);
        return;
    }
    let total=0;
    const matched=[];
    Object.keys(CATS).forEach(cat=>{
        CATS[cat].forEach(it=>{
            if((it.t||'').toLowerCase().includes(query)||(it.h||'').toLowerCase().includes(query)){
                matched.push({it,cat});
                total++;
            }
        });
    });
    panelTitle.textContent='Search Results';
    panelMeta.textContent=total+' matches';
    cardsEl.innerHTML='';
    if(!total){
        cardsEl.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#6c8a9a;padding:40px">未找到匹配 "'+escHtml(q)+'"</div>';
        panelEl.style.display='block';
        return;
    }
    matched.forEach(({it})=>cardsEl.appendChild(buildCard(it)));
    panelEl.style.display='block';
}

function selectCat(cat){
    document.querySelectorAll('.cat').forEach(c=>c.classList.toggle('active',c.dataset.cat===cat));
    searchEl.value='';
    renderPanel(cat);
}

buildCats();
selectCat(TABS[0]);

searchEl.addEventListener('input',e=>renderSearch(e.target.value));

const totalCount=Object.values(CATS).reduce((a,b)=>a+b.length,0);
totalMeta.textContent=`${totalCount} bookmarks loaded · last sync: 2026-08-04 16:26`;
</script>
