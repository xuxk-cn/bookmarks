:root {

    --content-bg: #fafafa;
    --card-bg: #ffffff;
    --card-border: #ececec;
    --card-hover: #ff6700;
    --text-primary: #333;
    --text-secondary: #888;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--content-bg);color:var(--text-primary);display:flex;min-height:100vh}
.sidebar{width:220px;background:var(--sidebar-bg);color:var(--sidebar-text);flex-shrink:0;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:#555;border-radius:3px}
.sidebar-logo{padding:28px 16px 20px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.05)}
.logo-main{font-size:22px;font-weight:bold;color:var(--accent);letter-spacing:1px}
.logo-sub{font-size:12px;color:#888;margin-top:4px}
.sidebar-menu{list-style:none;padding:8px 0}
.menu-item{padding:13px 20px;cursor:pointer;display:flex;align-items:center;gap:14px;font-size:14px;transition:all .2s;border-left:3px solid transparent;user-select:none}
.menu-item:hover{background:var(--sidebar-hover);color:var(--sidebar-text-active)}
.menu-item.active{background:var(--sidebar-hover);color:var(--sidebar-text-active);border-left-color:var(--accent)}
.menu-item i{width:18px;text-align:center;font-size:15px}
.main{margin-left:220px;flex:1;padding:24px 28px 60px;background:var(--content-bg);min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:12px}
.page-title{font-size:22px;font-weight:600;color:var(--text-primary)}
.search-box{position:relative;width:280px;max-width:100%}
.search-box input{width:100%;padding:8px 12px 8px 34px;border-radius:6px;border:1px solid #e0e0e0;background:#fff;font-size:13px;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#aaa;font-size:13px}
.section{margin-top:28px}
.section-title{font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.section-title::before{content:'';width:4px;height:16px;background:var(--accent);border-radius:2px}
.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:8px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .25s;min-height:72px}
.card:hover{border-color:var(--card-hover);box-shadow:0 6px 16px rgba(255,103,0,.08);transform:translateY(-2px)}
.card-icon{width:40px;height:40px;border-radius:8px;background:#f5f5f5;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-icon img{width:90%;height:90%;object-fit:contain}
.card-body{flex:1;min-width:0}
.card-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-desc{font-size:12px;color:var(--text-secondary);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.about-content{background:#fff;border:1px solid var(--card-border);border-radius:8px;padding:28px;color:#555;line-height:1.8;font-size:14px}
@media(max-width:1200px){.card-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.card-grid{grid-template-columns:repeat(2,1fr)}.main{padding:16px}}
@media(max-width:640px){body{flex-direction:column}.sidebar{position:relative;width:100%;bottom:auto;height:auto;max-height:none}.main{margin-left:0}.card-grid{grid-template-columns:1fr}.menu-item{padding:10px 16px}.header{flex-direction:column;align-items:stretch}.search-box{width:100%}}
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('nav-data').textContent);
const SIDEBAR = DATA.sidebar;
const CATS = DATA.cats;

const menuEl = document.getElementById('menu');
const contentEl = document.getElementById('content');
const titleEl = document.getElementById('page-title');
const searchEl = document.getElementById('search');

let currentId = 'resource';

function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function getHost(url){try{return new URL(url).hostname}catch(e){return ''}}
function favicon(url){const h=getHost(url);return h?`https://www.google.com/s2/favicons?domain=${h}&sz=64`:''}
function shortDesc(h,max){if(!h)return'';if(h.length<=max)return h;return h.slice(0,max)+'…'}

function buildSidebar(){
    SIDEBAR.forEach((s,idx)=>{
        const li=document.createElement('li');
        li.className='menu-item'+(idx===0?' active':'');
        li.dataset.id=s.id;
        li.innerHTML=`<i class="fa ${s.icon}"></i><span>${escHtml(s.title)}</span>`;
        li.onclick=()=>select(s.id);
        menuEl.appendChild(li);
    });
}

function buildCard(item){
    const card=document.createElement('div');
    card.className='card';
    card.onclick=()=>window.open(item.u,'_blank');
    card.innerHTML=`
        <div class="card-icon"><img src="${favicon(item.u)}" onerror="this.style.visibility='hidden'" alt=""></div>
        <div class="card-body">
            <div class="card-title">${escHtml(item.t)}</div>
            <div class="card-desc">${escHtml(shortDesc(item.h,60))}</div>
        </div>`;
    return card;
}

function renderCategory(s){
    const main=contentEl;
    main.innerHTML='';
    const cfg=SIDEBAR.find(x=>x.id===s);
    if(!cfg)return;
    let first=true;
    cfg.cats.forEach(catName=>{
        const items=CATS[catName];
        if(!items||!items.length)return;
        const sec=document.createElement('div');
        sec.className='section';
        sec.innerHTML=`<div class="section-title">${escHtml(catName)} <span style="font-size:12px;color:var(--text-secondary);font-weight:400;margin-left:6px">${items.length} 个</span></div>`;
        const grid=document.createElement('div');
        grid.className='card-grid';
        items.forEach(it=>grid.appendChild(buildCard(it)));
        sec.appendChild(grid);
        main.appendChild(sec);
    });
}

function renderAbout(){
    contentEl.innerHTML=`
        <div class="section">
            <div class="section-title">关于本站</div>
            <div class="about-content">
                <p>这是一个个人网址导航页面，收录各类常用网站、AI 工具、影视资源、设计素材等内容。</p>
                <p style="margin-top:12px">所有内容来自网络收集，仅供学习参考。</p>
                <p style="margin-top:12px;color:var(--accent);font-weight:600">共收录 ${Object.values(CATS).reduce((a,b)=>a+b.length,0)} 个书签 · ${Object.keys(CATS).length} 个分类</p>
            </div>
        </div>`;
}

function renderSearch(q){
    const query=q.trim().toLowerCase();
    const main=contentEl;
    main.innerHTML='';
    if(!query){renderCategory(currentId);return;}
    let total=0;
    const matched=[];
    Object.keys(CATS).forEach(cat=>{
        CATS[cat].forEach(it=>{
            if((it.t||'').toLowerCase().includes(query)||(it.h||'').toLowerCase().includes(query)||(it.u||'').toLowerCase().includes(query)){
                matched.push({it,cat});
                total++;
            }
        });
    });
    if(!total){
        main.innerHTML=`<div class="section"><div class="section-title">搜索结果</div><div style="color:var(--text-secondary);padding:40px 0;text-align:center">未找到匹配 "${escHtml(q)}" 的书签</div></div>`;
        return;
    }
    let curCat=null;
    matched.forEach(({it,cat})=>{
        if(cat!==curCat){
            curCat=cat;
            const sec=document.createElement('div');
            sec.className='section';
            sec.innerHTML=`<div class="section-title">${escHtml(cat)}</div>`;
            const grid=document.createElement('div');
            grid.className='card-grid';
            sec.appendChild(grid);
            main.appendChild(sec);
            window.__curGrid=grid;
        }
        window.__curGrid.appendChild(buildCard(it));
    });
    const tip=document.createElement('div');
    tip.style.cssText='margin-top:8px;color:var(--text-secondary);font-size:13px';
    tip.textContent=`找到 ${total} 条匹配结果`;
    main.insertBefore(tip,main.firstChild);
}

function select(id){
    currentId=id;
    document.querySelectorAll('.menu-item').forEach(el=>{
        el.classList.toggle('active',el.dataset.id===id);
    });
    const cfg=SIDEBAR.find(s=>s.id===id);
    if(cfg){titleEl.textContent=cfg.title;renderCategory(id);}
    else if(id==='about'){titleEl.textContent='关于本站';renderAbout();}
    searchEl.value='';
}

document.querySelector('[data-id="about"]').onclick=function(){select('about')};
document.querySelectorAll('.menu-item').forEach(el=>{
    el.addEventListener('click',function(){
        const id=this.dataset.id;
        select(id);
    });
});

searchEl.addEventListener('input',e=>{
    const v=e.target.value;
    if(!v.trim()){select(currentId);return;}
    document.querySelectorAll('.menu-item').forEach(el=>el.classList.remove('active'));
    titleEl.textContent='搜索结果';
    renderSearch(v);
});

buildSidebar();
select('resource');
</script>
