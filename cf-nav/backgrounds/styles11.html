<style>
:root{
--bg:#1f242d;
--card:#262b33;
--border:rgba(255,255,255,0.1);
--border-light:rgba(255,255,255,0.06);
--text:#e6edf3;
--text-secondary:#8b949e;
--text-tertiary:#6e7681;
--accent:#5ccfff;
--accent-2:#56b6ff;
--radius:10px;
font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:0}

/* Top status bar */
.topbar{background:var(--bg);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:12px}
.topbar-left{display:flex;flex-direction:column;gap:4px}
.topbar-date{font-size:11px;color:var(--text-secondary);letter-spacing:0.5px;text-transform:uppercase}
.greeting{font-size:32px;font-weight:700;color:var(--text);line-height:1.1;margin-top:6px}
.system-stats{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--text-secondary)}
.stat-item{display:flex;align-items:center;gap:4px}
.stat-bar{width:50px;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;position:relative;overflow:hidden}
.stat-bar-fill{position:absolute;top:0;left:0;height:100%;background:var(--accent)}
.weather{display:flex;align-items:center;gap:16px}
.weather-icon{color:var(--accent);font-size:28px}
.weather-info{font-size:12px;color:var(--text-secondary);text-align:right;line-height:1.4}
.weather-temp{font-size:13px;color:var(--text);font-weight:600}

/* Search bar */
.search-section{padding:16px 24px}
.search-input{width:100%;max-width:340px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:8px;font-size:13px;outline:none;font-family:inherit}
.search-input:focus{border-color:var(--accent)}

/* Section title */
.section-title{font-size:13px;font-weight:600;color:var(--text-secondary);letter-spacing:1px;text-transform:uppercase;padding:12px 16px;background:var(--bg);position:relative;display:flex;justify-content:space-between;align-items:center}
.section-title::before,.section-title::after{content:'';height:1px;background:var(--border);flex:1;margin:0 12px}

/* Layout */
.sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:0;border-top:1px solid var(--border)}

.section{background:var(--bg);border:1px solid var(--border);border-radius:0;padding:8px;margin:8px}

/* Items grid */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px}
.tile{background:transparent;border-radius:6px;padding:10px 12px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:10px;min-width:0;position:relative;text-decoration:none;color:inherit}
.tile:hover{background:var(--card)}
.tile-icon{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden}
.tile-icon img{width:100%;height:100%;object-fit:contain}
.tile-icon-fallback{width:28px;height:28px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.08);border-radius:6px;color:var(--text-secondary);font-weight:600;font-size:12px}
.tile-text{min-width:0;flex:1}
.tile-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile-desc{font-size:11px;color:var(--accent);font-weight:500;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.hidden{display:none!important}

.tooltip{position:fixed;background:rgba(38,43,51,0.97);color:var(--text);padding:10px 12px;border-radius:8px;font-size:12px;max-width:280px;pointer-events:none;z-index:9999;display:none;box-shadow:0 10px 25px rgba(0,0,0,0.5);border:1px solid var(--accent);backdrop-filter:blur(4px);line-height:1.5}
.tooltip-url{color:var(--accent);font-size:11px;margin-bottom:4px;word-break:break-all;font-weight:500}
.tooltip-desc{color:var(--text-secondary);font-size:11px}

@media (max-width:900px){
.sections{grid-template-columns:1fr}
}

  const d = new Date();
  const days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  const months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  const s = String(d.getSeconds()).padStart(2,'0');
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()} - ${h}:${m}:${s}`;
}

function getHostname(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch(e) { return ''; }
}

function getInitial(text) {
  if (!text) return '?';
  const cleaned = text.replace(/^(https?:\/\/)/, '').replace(/^www\./, '');
  return cleaned.charAt(0).toUpperCase();
}

const container = document.getElementById('sectionsContainer');
const tooltip = document.getElementById('tooltip');

function createSection(cat) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.dataset.title = cat.title.toLowerCase();

  let itemsHTML = '<div class="items">';
  cat.items.forEach(it => {
    const hostname = getHostname(it.url);
    const iconUrl = 'https://www.google.com/s2/favicons?domain=' + hostname + '&sz=64';
    const initial = getInitial(it.title);
    itemsHTML += `<div class="tile" data-name="${(it.title + ' ' + it.url + ' ' + (it.desc||'')).toLowerCase()}" data-url="${it.url}" data-desc="${it.desc || ''}">
      <div class="tile-icon">
        <img src="${iconUrl}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" alt="">
        <div class="tile-icon-fallback" style="display:none">${initial}</div>
      </div>
      <div class="tile-text">
        <div class="tile-title">${it.title}</div>
        <div class="tile-desc">${it.desc}</div>
      </div>
    </div>`;
  });
  itemsHTML += '</div>';

  sec.innerHTML = `
    <div class="section-title">${cat.title}</div>
    ${itemsHTML}
  `;
  return sec;
}

data.categories.forEach(cat => container.appendChild(createSection(cat)));

container.addEventListener('click', (e) => {
  const tile = e.target.closest('.tile');
  if (tile && tile.dataset.url) {
    window.open(tile.dataset.url, '_blank');
  }
});

const updateTooltipPos = (e) => {
  const x = e.clientX + 15, y = e.clientY + 15;
  const rect = tooltip.getBoundingClientRect();
  tooltip.style.left = (x + rect.width > window.innerWidth ? e.clientX - rect.width - 15 : x) + 'px';
  tooltip.style.top = (y + rect.height > window.innerHeight ? e.clientY - rect.height - 15 : y) + 'px';
};

container.addEventListener('mouseover', (e) => {
  const tile = e.target.closest('.tile');
  if (!tile) return;
  const url = tile.dataset.url;
  const desc = tile.dataset.desc || '';
  tooltip.innerHTML = `<div class="tooltip-url">${url}</div>${desc ? `<div class="tooltip-desc">${desc}</div>` : ''}`;
  tooltip.style.display = 'block';
  updateTooltipPos(e);
});
container.addEventListener('mousemove', updateTooltipPos);
container.addEventListener('mouseout', (e) => {
  if (!e.target.closest('.tile')) tooltip.style.display = 'none';
});

const searchInput = document.getElementById('searchInput');
let searchTimer;
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.toLowerCase().trim();
  searchTimer = setTimeout(() => {
    document.querySelectorAll('.section').forEach(sec => {
      let visibleItems = 0;
      sec.querySelectorAll('.tile').forEach(tile => {
        const match = tile.dataset.name.includes(q);
        tile.classList.toggle('hidden', q && !match);
        if (match) visibleItems++;
      });
      sec.classList.toggle('hidden', q && visibleItems === 0);
    });
  }, 200);
});
