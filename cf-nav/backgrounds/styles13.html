  /* 分类标签 - 隐藏式小条 */

    display: flex;

    gap: 4px;
    padding: 8px 60px;
    justify-content: center;
  }
  .tab-btn {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.8);

    font-size: 0.72rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn:hover {
    background: rgba(255,255,255,0.15);
    color: #fff;
  }
  .tab-btn.active {
    background: rgba(255,255,255,0.25);
    color: #fff;
    border-color: rgba(255,255,255,0.4);
  }

  /* 卡片网格 3 列 */
  .cards {
    position: relative;
    z-index: 5;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px 14px;
    padding: 0 60px;
    margin-top: 6px;
  }
  .card {
    position: relative;
    display: flex;
    align-items: center;
    height: 70px;
    padding: 0 12px 0 8px;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    color: #fff;
    overflow: hidden;
    transition: transform 0.18s, box-shadow 0.18s;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    z-index: 2;
  }

  .card-dark {
    background: rgba(40,40,40,0.88);
    color: #fff;
  }
  .card-light {
    background: rgba(255,255,255,0.96);
    color: #1a1a1a;
  }
  .card-cyan {
    background: #a0d8d8;
    color: #1a1a1a;
  }
  .card-orange {
    background: #e8a878;
    color: #1a1a1a;
  }

  .card-icon {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 10px;
    border-radius: 4px;
    overflow: hidden;

  .card-light .card-icon { background: transparent; }

  .card-icon-emoji { font-size: 1.6rem; }

  .card-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }
  .card-title {
    font-size: 0.92rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.2;
  }
  .card-stats {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 0.62rem;
    line-height: 1.1;

  }

    right: 0;
    top: 0;
    bottom: 0;

    align-items: center;
    justify-content: center;
    color: inherit;
    font-size: 1rem;

  }

<script>
const data = JSON.parse(document.getElementById('data').textContent);
const main = document.getElementById('main');
const bottomCards = document.getElementById('bottom-cards');
const tabsEl = document.getElementById('tabs');
const search = document.getElementById('search');
const tooltip = document.getElementById('tooltip');
const countEl = document.getElementById('count');
const engineSel = document.getElementById('engine');
const searchBtn = document.getElementById('search-btn');
const soundToggle = document.getElementById('sound-toggle');

// 音效
if (localStorage.getItem('soundEnabled') === 'false') soundToggle.checked = false;
soundToggle.addEventListener('change', () => localStorage.setItem('soundEnabled', soundToggle.checked));

let audioCtx = null;
function playDing() {
  if (!soundToggle.checked) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const c = audioCtx, t = c.currentTime;
    [[457.38,0.25,0.88],[914.76,0.12,0.45],[1829.52,0.06,0.18]].forEach(([f,v,d]) => {
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(v, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.start(t); o.stop(t + d);
    });
  } catch(e) {}
}

const allItems = [];
data.categories.forEach(cat => cat.items.forEach(item => allItems.push({...item, catTitle: cat.title})));

let currentCategory = data.categories[0].title;
let searchTimer = null;

// 卡片风格循环：深-浅-深
const styles = ['card-dark', 'card-light', 'card-dark'];

// 初始化标签
data.categories.forEach((cat, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i === 0 ? ' active' : '');
  btn.textContent = cat.title;
  btn.onclick = () => {
    search.value = '';
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = cat.title;
    renderCategory();
  };
  tabsEl.appendChild(btn);
});

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function getHostname(url) {
  try { return new URL(url).hostname; } catch(e) { return ''; }
}

function makeCard(item, words, style) {
  const card = document.createElement('a');
  card.className = 'card ' + style;
  card.href = item.url;
  card.target = '_blank';
  card.rel = 'noopener noreferrer';

  const hostname = getHostname(item.url);
  const iconUrl = 'https://www.google.com/s2/favicons?domain=' + hostname + '&sz=64';

  let titleHtml = escHtml(item.title);
  if (words && words.length) {
    words.forEach(w => {
      const re = new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      titleHtml = titleHtml.replace(re, m => '<mark style="background:#fde047;color:#000;border-radius:2px;padding:0 2px">' + m + '</mark>');
    });
  }

  const stats = item.stats || [];
  const statsHtml = stats.slice(0, 4).map(s =>
    `<div class="stat"><span class="stat-label">${escHtml(s.l)}</span><span class="stat-value">${escHtml(s.v)}</span></div>`
  ).join('');

  card.innerHTML = `
    <div class="card-icon">
      <img src="${iconUrl}" onerror="this.outerHTML='<div class=&quot;card-icon-fallback&quot;>🔗</div>'" alt="">
    </div>
    <div class="card-body">
      <div class="card-title">${titleHtml}</div>
      <div class="card-stats">${statsHtml}</div>
    </div>
    <div class="card-arrow">➜</div>
  `;

  card.addEventListener('mouseenter', (e) => {
    playDing();
    tooltip.innerHTML = '<span class="tt-url">' + escHtml(item.url) + '</span>' + (item.catTitle ? '<div>分类：' + escHtml(item.catTitle) + '</div>' : '');
    tooltip.style.display = 'block';
    positionTooltip(e);
  });
  card.addEventListener('mousemove', positionTooltip);
  card.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
  return card;
}

function positionTooltip(e) {
  const x = e.clientX + 15, y = e.clientY + 15;
  const w = tooltip.offsetWidth, h = tooltip.offsetHeight;
  tooltip.style.left = (x + w > window.innerWidth ? e.clientX - w - 15 : x) + 'px';
  tooltip.style.top = (y + h > window.innerHeight ? e.clientY - h - 15 : y) + 'px';
}

function renderCategory() {
  main.innerHTML = '';
  bottomCards.innerHTML = '';
  const cat = data.categories.find(c => c.title === currentCategory);
  if (!cat) return;
  countEl.textContent = '共 ' + cat.items.length + ' 项 · ' + currentCategory;
  cat.items.forEach((item, idx) => {
    const c = makeCard(item, [], styles[idx % 3]);
    main.appendChild(c);
  });
  // 底部两张彩色卡
  const homeCard = document.createElement('a');
  homeCard.className = 'card card-cyan';
  homeCard.href = '#';
  homeCard.onclick = e => e.preventDefault();
  homeCard.innerHTML = `
    <div class="card-icon"><span class="card-icon-emoji">🏠</span></div>
    <div class="card-body">
      <div class="card-title">Home LAN</div>
      <div class="card-stats">
        <div class="stat"><span class="stat-label">NET</span><span class="stat-value">192.168.1.0/24</span></div>
        <div class="stat"><span class="stat-label">DEV</span><span class="stat-value">12</span></div>
      </div>
    </div>
    <div class="card-arrow">🏷</div>
  `;

  const rootCard = document.createElement('a');
  rootCard.className = 'card card-orange';
  rootCard.href = '#';
  rootCard.onclick = e => e.preventDefault();
  rootCard.innerHTML = `
    <div class="card-icon"><span class="card-icon-emoji">🖥️</span></div>
    <div class="card-body">
      <div class="card-title">Rootserver</div>
      <div class="card-stats">
        <div class="stat"><span class="stat-label">HOST</span><span class="stat-value">主服务器</span></div>
        <div class="stat"><span class="stat-label">UPTIME</span><span class="stat-value">99.8%</span></div>
      </div>
    </div>
    <div class="card-arrow">🏷</div>
  `;

  bottomCards.appendChild(homeCard);
  bottomCards.appendChild(rootCard);
}

function renderSearch(query) {
  main.innerHTML = '';
  bottomCards.innerHTML = '';
  const words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const scored = allItems.map(item => {
    const t = (item.title || '').toLowerCase();
    const u = item.url.toLowerCase();
    let score = 0;
    for (const w of words) {
      if (t.includes(w)) score += 10;
      if (u.includes(w)) score += 5;
    }
    return { item, score };
  }).filter(r => r.score > 0).sort((a, b) => b.score - a.score);

  countEl.textContent = '搜索结果 ' + scored.length + ' 条';

  if (!scored.length) {
    main.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,0.6);padding:3rem 0">未找到匹配书签</div>';
    return;
  }

  scored.forEach(({ item }, idx) => {
    main.appendChild(makeCard(item, words, styles[idx % 3]));
  });
}

// 搜索
function doSearch() {
  const q = search.value.trim();
  if (!q) { renderCategory(); return; }
  renderSearch(q);
}
searchBtn.addEventListener('click', () => {
  const q = search.value.trim();
  if (!q) { doSearch(); return; }
  const engines = {
    google: 'https://www.google.com/search?q=',
    bing: 'https://www.bing.com/search?q=',
    baidu: 'https://www.baidu.com/s?wd=',
    duckduckgo: 'https://duckduckgo.com/?q='
  };
  window.open((engines[engineSel.value] || engines.google) + encodeURIComponent(q), '_blank');
});
search.addEventListener('keydown', e => { if (e.key === 'Enter') searchBtn.click(); });
search.addEventListener('input', e => {
  clearTimeout(searchTimer);
  const q = e.target.value;
  searchTimer = setTimeout(() => { if (!q.trim()) renderCategory(); else renderSearch(q); }, 250);
});

renderCategory();
</script>
