:root{
--bg:#0a0e14;
--panel:#161b22;
--card:#161b22;

--border:rgba(255,255,255,0.06);
--border-hover:rgba(255,255,255,0.12);
--text:#e6edf3;
--text-secondary:#8b949e;
--text-tertiary:#6e7681;
--accent:#ff6b6b;

}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:16px 20px 40px}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:600;color:var(--text)}
.brand-icon{color:#ff6b6b;font-size:22px}
.brand-star{color:#f2cc60;font-size:18px}
.topbar-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text-secondary);cursor:pointer;transition:all 0.15s;font-size:16px}
.icon-btn:hover{background:var(--card-hover);color:var(--text);border-color:var(--border-hover)}

.search-wrap{margin-bottom:16px}
.search-input{width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:8px;font-size:13px;outline:none;font-family:inherit}
.search-input:focus{border-color:var(--accent)}

.main-col{min-width:0}

.section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;position:relative}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-title{font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:6px}
.section-title-heart{color:#ff6b6b;font-size:14px}
.section-title-wand{font-size:14px}
.settings-btn{color:var(--text-tertiary);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px;transition:all 0.15s}
.settings-btn:hover{color:var(--text);background:rgba(255,255,255,0.06)}

.row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(120px,1fr);gap:8px;overflow-x:auto;padding-bottom:4px}
.row::-webkit-scrollbar{height:6px}
.row::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:3px}

.tile{background:transparent;border:1px solid transparent;border-radius:10px;padding:10px 12px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:10px;min-width:0;position:relative}
.tile:hover{background:var(--card-hover);border-color:var(--border-hover)}
.tile-icon{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:50%;overflow:hidden;font-size:16px;color:#333}
.tile-icon img{width:100%;height:100%;object-fit:contain}
.tile-icon-fallback{background:rgba(255,255,255,0.08);color:var(--text-secondary);font-weight:600}
.tile-text{min-width:0;flex:1}
.tile-title{font-size:13px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.tile-url{font-size:11px;color:var(--text-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}

.hidden{display:none!important}

.tooltip{position:fixed;background:rgba(22,27,34,0.97);color:var(--text);padding:10px 12px;border-radius:8px;font-size:12px;max-width:280px;pointer-events:none;z-index:9999;display:none;box-shadow:0 10px 25px rgba(0,0,0,0.5);border:1px solid var(--accent);backdrop-filter:blur(4px);line-height:1.5}
.tooltip-url{color:var(--accent);font-size:11px;margin-bottom:4px;word-break:break-all;font-weight:500}
.tooltip-desc{color:var(--text-secondary);font-size:11px}

@media (max-width:640px){
.row{grid-auto-flow:row;grid-template-columns:1fr 1fr}
}
</style>

function getHostname(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch(e) { return ''; }
}

function getInitial(text) {
  if (!text) return '?';
  const cleaned = text.replace(/^(https?:\/\/)/, '').replace(/^www\./, '');
  return cleaned.charAt(0).toUpperCase();
}

const mainCol = document.getElementById('mainCol');
const tooltip = document.getElementById('tooltip');

function createSection(cat) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.dataset.title = cat.title.toLowerCase();

  const titleSuffix = cat.heart ? '<span class="section-title-heart">♥</span>' : (cat.wand ? '<span class="section-title-wand">🪄</span>' : '');

  let itemsHTML = '<div class="row">';
  cat.items.forEach(it => {
    const hostname = getHostname(it.url);
    const iconUrl = 'https://www.google.com/s2/favicons?domain=' + hostname + '&sz=64';
    const initial = getInitial(it.title);
    itemsHTML += `<div class="tile" data-name="${(it.title + ' ' + it.url + ' ' + (it.desc||'')).toLowerCase()}" data-url="${it.url}" data-desc="${it.desc || ''}">
      <div class="tile-icon">
        <img src="${iconUrl}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" alt="">
        <div class="tile-icon-fallback" style="display:none">${initial}</div>
      </div>
      <div class="tile-text">
        <div class="tile-title">${it.title}</div>
        <div class="tile-url">${hostname}</div>
      </div>
    </div>`;
  });
  itemsHTML += '</div>';

  sec.innerHTML = `
    <div class="section-header">
      <div class="section-title">${cat.title} ${titleSuffix}</div>
      <div class="settings-btn">⚙</div>
    </div>
    ${itemsHTML}
  `;
  return sec;
}

data.categories.forEach(cat => mainCol.appendChild(createSection(cat)));

mainCol.addEventListener('click', (e) => {
  const tile = e.target.closest('.tile');
  if (tile && tile.dataset.url) {
    window.open(tile.dataset.url, '_blank');
  }
});

const updateTooltipPos = (e) => {
  const x = e.clientX + 15, y = e.clientY + 15;
  const rect = tooltip.getBoundingClientRect();
  tooltip.style.left = (x + rect.width > window.innerWidth ? e.clientX - rect.width - 15 : x) + 'px';
  tooltip.style.top = (y + rect.height > window.innerHeight ? e.clientY - rect.height - 15 : y) + 'px';
};

mainCol.addEventListener('mouseover', (e) => {
  const tile = e.target.closest('.tile');
  if (!tile) return;
  const url = tile.dataset.url;
  const desc = tile.dataset.desc || '';
  tooltip.innerHTML = `<div class="tooltip-url">${url}</div>${desc ? `<div class="tooltip-desc">${desc}</div>` : ''}`;
  tooltip.style.display = 'block';
  updateTooltipPos(e);
});
mainCol.addEventListener('mousemove', updateTooltipPos);
mainCol.addEventListener('mouseout', (e) => {
  if (!e.target.closest('.tile')) tooltip.style.display = 'none';
});

const searchInput = document.getElementById('searchInput');
let searchTimer;
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.toLowerCase().trim();
  searchTimer = setTimeout(() => {
    document.querySelectorAll('.section').forEach(sec => {
      let visibleItems = 0;
      sec.querySelectorAll('.tile').forEach(tile => {
        const match = tile.dataset.name.includes(q);
        tile.classList.toggle('hidden', q && !match);
        if (match) visibleItems++;
      });
      sec.classList.toggle('hidden', q && visibleItems === 0);
    });
  }, 200);
});
