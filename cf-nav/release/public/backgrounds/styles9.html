<style>
:root{
--bg:#0f1419;
--panel:#161b22;
--card:#1c2128;
--card-hover:#22272e;
--card-active:#2d333b;
--border:rgba(255,255,255,0.08);
--border-hover:rgba(255,255,255,0.18);
--text:#e6edf3;
--text-secondary:#8b949e;
--text-tertiary:#6e7681;
--accent:#58a6ff;
--success:#3fb950;
--radius:14px;
font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:20px 24px 60px}

.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:16px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:28px;font-weight:600;color:var(--text);letter-spacing:-0.5px}
.brand .sub{font-size:13px;color:var(--text-secondary);font-style:italic}
.topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-secondary{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;transition:all 0.15s;font-family:inherit}
.btn-secondary:hover{background:var(--card-hover);border-color:var(--border-hover)}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.search-wrap{margin:0}
.search-input{width:280px;background:var(--card);border:1px solid var(--border);color:var(--text);padding:9px 14px;border-radius:8px;font-size:13px;outline:none;transition:border 0.15s;font-family:inherit}
.search-input:focus{border-color:var(--accent)}

.sections{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}

.section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:all 0.2s;position:relative;overflow:hidden}
.section::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--section-color)}
.section.c1{--section-color:#ff7eb6}
.section.c2{--section-color:#a371f7}
.section.c3{--section-color:#d29922}
.section.c4{--section-color:#58a6ff}
.section.c5{--section-color:#39c5cf}
.section.c6{--section-color:#3fb950}
.section.c7{--section-color:#f85149}
.section.c8{--section-color:#ff9e64}
.section.c9{--section-color:#56d364}
.section.c10{--section-color:#db61a2}
.section.c11{--section-color:#79c0ff}
.section.c12{--section-color:#f2cc60}
.section.c13{--section-color:#e3b341}
.section.c14{--section-color:#1f6feb}
.section.c15{--section-color:#bf8700}
.section.c16{--section-color:#8957e5}
.section.c17{--section-color:#2ea043}
.section.c18{--section-color:#cf222e}
.section.c19{--section-color:#6e7681}

.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-title{font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;letter-spacing:0.2px;text-transform:capitalize}
.section-count{font-size:11px;color:var(--text-tertiary);background:var(--bg);padding:2px 8px;border-radius:10px;font-weight:500}
.section-menu{color:var(--text-tertiary);cursor:pointer;font-size:14px;letter-spacing:2px;padding:2px 6px;border-radius:4px}
.section-menu:hover{color:var(--text);background:var(--intensity-6,rgba(255,255,255,0.06))}

.items{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{background:var(--bg);border:1px solid transparent;border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;transition:all 0.15s;position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:78px;justify-content:center}
.item:hover{background:var(--card-hover);border-color:var(--border-hover);transform:translateY(-1px)}
.item-icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:18px;background:#fff;border-radius:6px;overflow:hidden}
.item-icon img{width:100%;height:100%;object-fit:contain}
.item-icon-fallback{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.08);border-radius:50%;font-size:14px;color:var(--text-secondary);font-weight:600}
.item-title{font-size:11px;color:var(--text-secondary);font-weight:500;line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}

.hidden{display:none!important}

.tooltip{position:fixed;background:rgba(22,27,34,0.97);color:var(--text);padding:10px 12px;border-radius:8px;font-size:12px;max-width:280px;pointer-events:none;z-index:9999;display:none;box-shadow:0 10px 25px rgba(0,0,0,0.5);border:1px solid var(--accent);backdrop-filter:blur(4px);line-height:1.5}
.tooltip-url{color:var(--accent);font-size:11px;margin-bottom:4px;word-break:break-all;font-weight:500}
.tooltip-desc{color:var(--text-secondary);font-size:11px}

@media (max-width:768px){
.sections{grid-template-columns:1fr}
.items{grid-template-columns:repeat(2,1fr)}
.search-input{width:100%}
}
</style>

const container = document.getElementById('sectionsContainer');
const tooltip = document.getElementById('tooltip');

function getHostname(url) {
  try { return new URL(url).hostname; } catch(e) { return ''; }
}

function getInitial(text) {
  if (!text) return '?';
  const cleaned = text.replace(/^(https?:\/\/)/, '').replace(/^www\./, '');
  return cleaned.charAt(0).toUpperCase();
}

function createSection(cat, index) {
  const sec = document.createElement('div');
  sec.className = 'section c' + ((index % 19) + 1);
  sec.dataset.title = cat.title.toLowerCase();

  let itemsHTML = '<div class="items">';
  cat.items.forEach(it => {
    const hostname = getHostname(it.url);
    const iconUrl = 'https://www.google.com/s2/favicons?domain=' + hostname + '&sz=64';
    const initial = getInitial(it.title);
    itemsHTML += `<div class="item" data-name="${(it.title + ' ' + it.url).toLowerCase()}" data-url="${it.url}">
      <div class="item-icon">
        <img src="${iconUrl}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" alt="">
        <div class="item-icon-fallback" style="display:none">${initial}</div>
      </div>
      <div class="item-title">${it.title}</div>
    </div>`;
  });
  itemsHTML += '</div>';

  sec.innerHTML = `
    <div class="section-header">
      <div class="section-title">
        <span>${cat.title}</span>
        <span class="section-count">${cat.items.length}</span>
      </div>
      <div class="section-menu">⋮⋮⋮</div>
    </div>
    ${itemsHTML}
  `;
  return sec;
}

data.categories.forEach((cat, i) => container.appendChild(createSection(cat, i)));

container.addEventListener('click', (e) => {
  const item = e.target.closest('.item');
  if (item && item.dataset.url) {
    window.open(item.dataset.url, '_blank');
  }
});

const updateTooltipPos = (e) => {
  const x = e.clientX + 15, y = e.clientY + 15;
  const rect = tooltip.getBoundingClientRect();
  tooltip.style.left = (x + rect.width > window.innerWidth ? e.clientX - rect.width - 15 : x) + 'px';
  tooltip.style.top = (y + rect.height > window.innerHeight ? e.clientY - rect.height - 15 : y) + 'px';
};

container.addEventListener('mouseover', (e) => {
  const item = e.target.closest('.item');
  if (!item) return;
  const title = item.querySelector('.item-title').textContent;
  const url = item.dataset.url;
  tooltip.innerHTML = `<div class="tooltip-url">${url}</div><div class="tooltip-desc">${title}</div>`;
  tooltip.style.display = 'block';
  updateTooltipPos(e);
});
container.addEventListener('mousemove', updateTooltipPos);
container.addEventListener('mouseout', (e) => {
  if (!e.target.closest('.item')) tooltip.style.display = 'none';
});

const searchInput = document.getElementById('searchInput');
let searchTimer;
searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const q = e.target.value.toLowerCase().trim();
  searchTimer = setTimeout(() => {
    document.querySelectorAll('.section').forEach(sec => {
      let visibleItems = 0;
      sec.querySelectorAll('.item').forEach(item => {
        const match = item.dataset.name.includes(q);
        item.classList.toggle('hidden', q && !match);
        if (match) visibleItems++;
      });
      sec.classList.toggle('hidden', q && visibleItems === 0);
    });
  }, 200);
});
