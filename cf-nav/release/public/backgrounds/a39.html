<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🪐 3D 行星渲染器 - 交互控制台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e0e8f0;
  }
  #canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #canvas:active { cursor: grabbing; }

  /* ===== 控制台 ===== */
  #panel {
    position: fixed; top: 20px; right: 20px; width: 320px;
    background: rgba(10, 15, 25, 0.88);
    border: 1px solid #3a5a8c;
    border-radius: 10px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05) inset;
    z-index: 100;
    user-select: none;
    font-size: 12px;
    transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #panel.hidden {
    opacity: 0;
    transform: scale(0.95) translateX(20px);
    pointer-events: none;
  }
  #panel.collapsed #panel-body { display: none; }
  #panel.collapsed #panel-footer { display: none; }

  #panel-header {
    padding: 10px 14px;
    background: linear-gradient(90deg, rgba(58, 90, 140, 0.4), rgba(58, 90, 140, 0.15));
    border-bottom: 1px solid #3a5a8c;
    cursor: move;
    display: flex; justify-content: space-between; align-items: center;
    border-radius: 10px 10px 0 0;
  }
  #panel.collapsed #panel-header { border-radius: 10px; border-bottom: none; }
  #panel-header h3 { margin: 0; font-size: 14px; color: #fff; font-weight: 600; letter-spacing: 0.5px; }
  .header-btns { display: flex; gap: 6px; }
  .header-btn {
    background: rgba(58, 90, 140, 0.3);
    border: 1px solid #3a5a8c;
    color: #e0e8f0;
    width: 26px; height: 26px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .header-btn:hover { background: rgba(58, 90, 140, 0.7); color: #fff; }

  #panel-body {
    padding: 12px 14px;
    max-height: 70vh;
    overflow-y: auto;
  }
  .group-title {
    font-size: 11px;
    color: #6ea8fe;
    margin: 10px 0 6px;
    font-weight: 600;
    letter-spacing: 0.5px;
    border-bottom: 1px solid rgba(58, 90, 140, 0.3);
    padding-bottom: 3px;
    display: flex; align-items: center; gap: 5px;
  }
  .group-title:first-child { margin-top: 0; }

  .control {
    display: flex; align-items: center;
    margin: 7px 0;
  }
  .control label {
    flex: 0 0 78px;
    color: #b0b8c8;
    font-size: 12px;
  }
  .control input[type="range"] {
    flex: 1;
    margin: 0 8px;
    accent-color: #5a8acc;
    height: 4px;
    cursor: pointer;
  }
  .control .value {
    flex: 0 0 50px;
    text-align: right;
    color: #8ab4f8;
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 11px;
  }

  #panel-footer {
    padding: 8px 14px;
    border-top: 1px solid rgba(58, 90, 140, 0.3);
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(0,0,0,0.2);
    border-radius: 0 0 10px 10px;
  }
  #panel-footer button {
    background: rgba(58, 90, 140, 0.3);
    border: 1px solid #3a5a8c;
    color: #e0e8f0;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.2s;
  }
  #panel-footer button:hover { background: rgba(58, 90, 140, 0.7); color: #fff; }
  #fps {
    color: #6ea8fe;
    font-family: monospace;
    font-size: 11px;
  }

  #panel-body::-webkit-scrollbar { width: 6px; }
  #panel-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 3px; }
  #panel-body::-webkit-scrollbar-thumb { background: #3a5a8c; border-radius: 3px; }
  #panel-body::-webkit-scrollbar-thumb:hover { background: #5a8acc; }

  #hint {
    position: fixed; bottom: 12px; left: 12px;
    color: #aab; font-size: 11px;
    background: rgba(10, 15, 25, 0.7);
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid rgba(58, 90, 140, 0.3);
    pointer-events: none;
    z-index: 50;
  }
  .kbd {
    display: inline-block;
    padding: 1px 5px;
    background: rgba(58, 90, 140, 0.4);
    border: 1px solid #3a5a8c;
    border-radius: 3px;
    color: #fff;
    font-family: monospace;
    font-size: 10px;
    margin: 0 2px;
  }

  #toast {
    position: fixed;
    top: 20px; left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: rgba(10, 15, 25, 0.9);
    border: 1px solid #3a5a8c;
    color: #fff;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 12px;
    z-index: 200;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="panel" class="hidden">
  <div id="panel-header">
    <h3>🪐 行星渲染控制台</h3>
    <div class="header-btns">
      <button class="header-btn" id="reset-btn" title="重置默认值">↺</button>
      <button class="header-btn" id="toggle-btn" title="折叠/展开">−</button>
    </div>
  </div>
  <div id="panel-body">
    <!-- 相机 -->
    <div class="group-title">📷 相机参数</div>
    <div class="control">
      <label>相机距离</label>
      <!-- 【修改点 1】：value 改为 2.5 -->
      <input type="range" id="camZoom" min="0.5" max="3" step="0.05" value="2.5">
      <!-- 【修改点 2】：显示文本改为 2.50 -->
      <span class="value" id="camZoomVal">2.50</span>
    </div>
    <div class="control">
      <label>相机高度</label>
      <input type="range" id="camHeight" min="0" max="3" step="0.05" value="1">
      <span class="value" id="camHeightVal">1.00</span>
    </div>
    <div class="control">
      <label>视角倾斜</label>
      <input type="range" id="camTilt" min="-1" max="1" step="0.02" value="0.35">
      <span class="value" id="camTiltVal">0.35</span>
    </div>
    <div class="control">
      <label>自转速度</label>
      <input type="range" id="rotSpeed" min="0" max="0.3" step="0.005" value="0.05">
      <span class="value" id="rotSpeedVal">0.050</span>
    </div>

    <!-- 球体 -->
    <div class="group-title">🌍 球体</div>
    <div class="control">
      <label>球体半径</label>
      <input type="range" id="sphRadius" min="0.5" max="2" step="0.05" value="1">
      <span class="value" id="sphRadiusVal">1.00</span>
    </div>

    <!-- 太阳 -->
    <div class="group-title">☀️ 太阳方向</div>
    <div class="control">
      <label>太阳 X</label>
      <input type="range" id="lightX" min="-2" max="2" step="0.05" value="1.0">
      <span class="value" id="lightXVal">1.00</span>
    </div>
    <div class="control">
      <label>太阳 Y</label>
      <input type="range" id="lightY" min="-2" max="2" step="0.05" value="0.2">
      <span class="value" id="lightYVal">0.20</span>
    </div>
    <div class="control">
      <label>太阳 Z</label>
      <input type="range" id="lightZ" min="-2" max="2" step="0.05" value="1.0">
      <span class="value" id="lightZVal">1.00</span>
    </div>

    <!-- 表面 -->
    <div class="group-title">🎨 表面颜色</div>
    <div class="control">
      <label>海洋色相</label>
      <input type="range" id="seaHue" min="0" max="1" step="0.01" value="0.58">
      <span class="value" id="seaHueVal">0.58</span>
    </div>
    <div class="control">
      <label>海洋亮度</label>
      <input type="range" id="seaBright" min="0" max="0.5" step="0.01" value="0.15">
      <span class="value" id="seaBrightVal">0.15</span>
    </div>
    <div class="control">
      <label>陆地色相</label>
      <input type="range" id="landHue" min="0" max="1" step="0.01" value="0.25">
      <span class="value" id="landHueVal">0.25</span>
    </div>
    <div class="control">
      <label>陆地亮度</label>
      <input type="range" id="landBright" min="0" max="2" step="0.05" value="0.5">
      <span class="value" id="landBrightVal">0.50</span>
    </div>

    <!-- 大气 -->
    <div class="group-title">🌫️ 大气效果</div>
    <div class="control">
      <label>云层覆盖</label>
      <input type="range" id="cloudCover" min="-0.3" max="0.3" step="0.01" value="0">
      <span class="value" id="cloudCoverVal">0.00</span>
    </div>
    <div class="control">
      <label>辉光强度</label>
      <input type="range" id="glowStr" min="0" max="3" step="0.05" value="1.5">
      <span class="value" id="glowStrVal">1.50</span>
    </div>
    <div class="control">
      <label>经纬网格</label>
      <input type="range" id="gridStr" min="0" max="2" step="0.05" value="0.5">
      <span class="value" id="gridStrVal">0.50</span>
    </div>

    <!-- 后处理 -->
    <div class="group-title">✨ 后处理</div>
    <div class="control">
      <label>背景亮度</label>
      <input type="range" id="bgBright" min="0" max="3" step="0.05" value="1.5">
      <span class="value" id="bgBrightVal">1.50</span>
    </div>
    <div class="control">
      <label>整体曝光</label>
      <input type="range" id="exposure" min="0.2" max="2" step="0.02" value="1">
      <span class="value" id="exposureVal">1.00</span>
    </div>
  </div>
  <div id="panel-footer">
    <span id="fps">FPS: --</span>
    <button id="random-btn">🎲 随机参数</button>
  </div>
</div>
<div id="toast"></div>

<script>
// ============================================================
//   WebGL 初始化
// ============================================================
const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl', { antialias: true, alpha: false });
if (!gl) {
    document.body.innerHTML = '<div style="color:white;padding:40px;font-size:20px;">您的浏览器不支持 WebGL</div>';
    throw new Error('No WebGL');
}

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// ============================================================
//   着色器源码
// ============================================================
const vsSource = `
attribute vec2 aPosition;
void main() {
    gl_Position = vec4(aPosition, 0.0, 1.0);
}
`;

const fsSource = `
precision highp float;

#define AA 1

uniform vec2  iResolution;
uniform float iTime;
uniform int   iFrame;
uniform vec4  iMouse;
uniform sampler2D iChannel0;
uniform sampler2D iChannel1;

// ---- 用户可调参数 ----
uniform vec4  uSph;             // 球体 (xyz=中心, w=半径)
uniform vec3  uLightDir;        // 太阳方向
uniform float uCamZoom;         // 相机距离倍率
uniform float uCamHeight;       // 相机高度
uniform float uRotSpeed;        // 自转速度
uniform float uCamTilt;         // 视角倾斜
uniform vec3  uSeaColor1;       // 海洋深色
uniform vec3  uSeaColor2;       // 海洋浅色
uniform float uSeaBrightness;
uniform vec3  uLandColor1;      // 陆地底色
uniform vec3  uLandColor2;      // 陆地高亮
uniform float uLandBrightness;
uniform vec3  uCloudColor;      // 云层颜色
uniform float uCloudCoverage;   // 云层覆盖 (偏移)
uniform vec3  uGlowColor;       // 大气辉光颜色
uniform float uGlowStrength;    // 辉光强度
uniform float uGridStrength;    // 经纬网格强度
uniform float uBgBrightness;    // 背景亮度
uniform float uExposure;        // 整体曝光

// https://iquilezles.org/articles/spherefunctions/
float shpIntersect( in vec3 ro, in vec3 rd, in vec4 sph )
{
    vec3 oc = ro - sph.xyz;
    float b = dot( rd, oc );
    float c = dot( oc, oc ) - sph.w*sph.w;
    float h = b*b - c;
    if( h>0.0 ) h = -b - sqrt( h );
    return h;
}

float sphDistance( in vec3 ro, in vec3 rd, in vec4 sph )
{
    vec3 oc = ro - sph.xyz;
    float b = dot( oc, rd );
    float h = dot( oc, oc ) - b*b;
    return sqrt( max(0.0,h)) - sph.w;
}

float sphSoftShadow( in vec3 ro, in vec3 rd, in vec4 sph, in float k )
{
    vec3 oc = sph.xyz - ro;
    float b = dot( oc, rd );
    float c = dot( oc, oc ) - sph.w*sph.w;
    float h = b*b - c;
    return (b<0.0) ? 1.0 : 1.0 - smoothstep( 0.0, 1.0, k*h/b );
}

vec3 sphNormal( in vec3 pos, in vec4 sph )
{
    return (pos - sph.xyz)/sph.w;
}

vec3 fancyCube( sampler2D sam, in vec3 d, in float s, in float b )
{
    vec3 colx = texture2D( sam, 0.5 + s*d.yz/d.x, b ).xyz;
    vec3 coly = texture2D( sam, 0.5 + s*d.zx/d.y, b ).xyz;
    vec3 colz = texture2D( sam, 0.5 + s*d.xy/d.z, b ).xyz;
    vec3 n = d*d;
    return (colx*n.x + coly*n.y + colz*n.z)/(n.x+n.y+n.z);
}

vec2 hash( vec2 p ) { p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))); return fract(sin(p)*43758.5453); }

vec2 voronoi( in vec2 x )
{
    vec2 n = floor( x );
    vec2 f = fract( x );

    vec3 m = vec3( 8.0 );
    for( int j=-1; j<=1; j++ )
    for( int i=-1; i<=1; i++ )
    {
        vec2  g = vec2( float(i), float(j) );
        vec2  o = hash( n + g );
        vec2  r = g - f + o;
        float d = dot( r, r );
        if( d<m.x ) m = vec3( d, o );
    }

    return vec2( sqrt(m.x), m.y+m.z );
}

vec3 background( in vec3 d, in vec3 l )
{
    vec3 col = vec3(0.0);
         col += 0.5*pow( fancyCube( iChannel1, d, 0.05, 5.0 ).zyx, vec3(2.0) );
         col += 0.2*pow( fancyCube( iChannel1, d, 0.10, 3.0 ).zyx, vec3(1.5) );
         col += 0.8*vec3(0.80,0.5,0.6)*pow( fancyCube( iChannel1, d, 0.1, 0.0 ).xxx, vec3(6.0) );
    float stars = smoothstep( 0.3, 0.7, fancyCube( iChannel1, d, 0.91, 0.0 ).x );

    vec3 n = abs(d);
    n = n*n*n;

    vec2 vxy = voronoi( 50.0*d.xy );
    vec2 vyz = voronoi( 50.0*d.yz );
    vec2 vzx = voronoi( 50.0*d.zx );
    vec2 r = (vyz*n.x + vzx*n.y + vxy*n.z) / (n.x+n.y+n.z);
    col += 0.5 * stars * clamp(1.0-(3.0+r.y*5.0)*r.x,0.0,1.0);

    col = uBgBrightness*col - 0.2;
    col += vec3(-0.05,0.1,0.0);

    float s = clamp( dot(d,l), 0.0, 1.0 );
    col += 0.4*pow(s,5.0)*vec3(1.0,0.7,0.6)*2.0;
    col += 0.4*pow(s,64.0)*vec3(1.0,0.9,0.8)*2.0;

    return col;
}

float rayTrace( in vec3 ro, in vec3 rd )
{
    return shpIntersect( ro, rd, uSph );
}

float map( in vec3 pos )
{
    vec2 r = pos.xz - uSph.xz;
    float h = 1.0-2.0/(1.0+0.3*dot(r,r));
    return pos.y - h;
}

float rayMarch( in vec3 ro, in vec3 rd, float tmax )
{
    float t = 0.0;
    float h = (1.0-ro.y)/rd.y;
    if( h>0.0 ) t=h;
    for( int i=0; i<20; i++ )
    {
        vec3 pos = ro + t*rd;
        float h = map( pos );
        if( h<0.001 || t>tmax ) break;
        t += h;
    }
    return t;
}

vec3 render( in vec3 ro, in vec3 rd )
{
    vec3 lig = uLightDir;
    vec3 col = background( rd, lig );

    float t = rayTrace( ro, rd );

    if( t>0.0 )
    {
        vec3 mat = vec3( 0.18 );
        vec3 pos = ro + t*rd;
        vec3 nor = sphNormal( pos, uSph );

        float am = 0.1*iTime;
        vec2 pr = vec2( cos(am), sin(am) );
        vec3 tnor = nor;
        tnor.xz = mat2( pr.x, -pr.y, pr.y, pr.x ) * tnor.xz;

        float am2 = 0.08*iTime - 1.0*(1.0-nor.y*nor.y);
        pr = vec2( cos(am2), sin(am2) );
        vec3 tnor2 = nor;
        tnor2.xz = mat2( pr.x, -pr.y, pr.y, pr.x ) * tnor2.xz;

        vec3 ref = reflect( rd, nor );
        float fre = clamp( 1.0+dot( nor, rd ), 0.0 ,1.0 );

        float l = fancyCube( iChannel0, tnor, 0.03, 0.0 ).x;
        l += -0.1 + 0.3*fancyCube( iChannel0, tnor, 8.0, 0.0 ).x;

        vec3 sea  = mix( uSeaColor1, uSeaColor2, fre );
        sea *= uSeaBrightness;

        vec3 land = uLandColor1;
        land = mix( land, uLandColor2, smoothstep(0.4,1.0,fancyCube( iChannel0, tnor, 0.1, 0.0 ).x ));
        land *= fancyCube( iChannel0, tnor, 0.3, 0.0 ).xyz;
        land *= uLandBrightness;

        float los = smoothstep(0.45,0.46, l);
        mat = mix( sea, land, los );

        vec3 wrap = -1.0 + 2.0*fancyCube( iChannel1, tnor2.xzy, 0.025, 0.0 ).xyz;
        float cc1 = fancyCube( iChannel1, tnor2 + 0.2*wrap, 0.05, 0.0 ).y;
        float clouds = smoothstep( 0.3 + uCloudCoverage, 0.6 + uCloudCoverage, cc1 );

        mat = mix( mat, uCloudColor, clouds );

        float dif = clamp( dot(nor, lig), 0.0, 1.0 );
        mat *= 0.8;
        vec3 lin  = vec3(3.0,2.5,2.0)*dif;
        lin += 0.01;
        col = mat * lin;
        col = pow( col, vec3(0.4545) );
        col += 0.6*fre*fre*vec3(0.9,0.9,1.0)*(0.3+0.7*dif);

        float spe = clamp( dot(ref,lig), 0.0, 1.0 );
        float tspe = pow( spe, 3.0 ) + 0.5*pow( spe, 16.0 );
        col += (1.0-0.5*los)*clamp(1.0-2.0*clouds,0.0,1.0)*0.3*vec3(0.5,0.4,0.3)*tspe*dif;
    }

    float tmax = 20.0;
    if( t>0.0 ) tmax = t;
    t = rayMarch( ro, rd, tmax );
    if( t<tmax )
    {
        vec3 pos = ro + t*rd;
        vec2 scp = sin(2.0*6.2831*pos.xz);
        vec3 wir = vec3( 0.0 );
        wir += 1.0*exp(-12.0*abs(scp.x));
        wir += 1.0*exp(-12.0*abs(scp.y));
        wir += 0.5*exp( -4.0*abs(scp.x));
        wir += 0.5*exp( -4.0*abs(scp.y));
        wir *= 0.2 + 1.0*sphSoftShadow( pos, lig, uSph, 4.0 );
        col += wir*uGridStrength*exp( -0.05*t*t );
    }

    if( dot(rd, uSph.xyz-ro)>0.0 )
    {
        float d = sphDistance( ro, rd, uSph );
        vec3 glo = vec3(0.0);
        glo += uGlowColor*0.3*exp(-2.0*abs(d))*step(0.0,d);
        glo += 0.6*uGlowColor*0.3*exp(-8.0*abs(d));
        glo += 0.6*vec3(0.8,0.9,1.0)*0.4*exp(-100.0*abs(d));
        col += glo*uGlowStrength;
    }

    col *= smoothstep( 0.0, 6.0, iTime );

    return col;
}

mat3 setCamera( in vec3 ro, in vec3 rt, in float cr )
{
    vec3 cw = normalize(rt-ro);
    vec3 cp = vec3(sin(cr), cos(cr),0.0);
    vec3 cu = normalize( cross(cw,cp) );
    vec3 cv = normalize( cross(cu,cw) );
    return mat3( cu, cv, -cw );
}

void mainImage( out vec4 fragColor, in vec2 fragCoord )
{
    vec3 col = vec3(0.0);
#if AA>1
    #define ZERO min(iFrame,0)
    for( int m=ZERO; m<AA; m++ )
    for( int n=ZERO; n<AA; n++ )
    {
        vec2 o = vec2(float(m),float(n)) / float(AA) - 0.5;
        vec2 p = (2.0*(fragCoord+o)-iResolution.xy)/iResolution.y;
#else
        vec2 p = (2.0*fragCoord-iResolution.xy)/iResolution.y;
#endif

        float zo = uCamZoom;
        float an = 3.0 + uRotSpeed*iTime + 6.0*iMouse.x/iResolution.x;
        vec3 ro = zo*vec3( 2.0*cos(an), uCamHeight, 2.0*sin(an) );
        vec3 rt = vec3( 1.0, 0.0, 0.0 );
        mat3 cam = setCamera( ro, rt, uCamTilt );
        vec3 rd = normalize( cam * vec3( p, -2.0) );

        col += render( ro, rd );

#if AA>1
    }
    col /= float(AA*AA);
#endif

    col *= uExposure;

    vec2 q = fragCoord / iResolution.xy;
    col *= 0.2 + 0.8*pow( 16.0*q.x*q.y*(1.0-q.x)*(1.0-q.y), 0.1 );

    fragColor = vec4( col, 1.0 );
}

void main() {
    vec4 fc;
    mainImage(fc, gl_FragCoord.xy);
    gl_FragColor = fc;
}
`;

// ============================================================
//   编译/链接
// ============================================================
function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
        console.error('Shader error:', gl.getShaderInfoLog(sh));
        throw new Error(gl.getShaderInfoLog(sh));
    }
    return sh;
}
const vs = compile(gl.VERTEX_SHADER, vsSource);
const fs = compile(gl.FRAGMENT_SHADER, fsSource);
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('Link error:', gl.getProgramInfoLog(prog));
    throw new Error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

// Fullscreen quad
const quad = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPosition');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// Uniform locations
const U = {};
[
    'iResolution', 'iTime', 'iFrame', 'iMouse',
    'uSph', 'uLightDir', 'uCamZoom', 'uCamHeight', 'uRotSpeed', 'uCamTilt',
    'uSeaColor1', 'uSeaColor2', 'uSeaBrightness',
    'uLandColor1', 'uLandColor2', 'uLandBrightness',
    'uCloudColor', 'uCloudCoverage', 'uGlowColor', 'uGlowStrength',
    'uGridStrength', 'uBgBrightness', 'uExposure'
].forEach(n => { U[n] = gl.getUniformLocation(prog, n); });

// ============================================================
//   噪声纹理生成
// ============================================================
function makeNoiseTexture(size, seed) {
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    const ctx = cv.getContext('2d');
    const img = ctx.createImageData(size, size);
    const data = img.data;

    const GS = 32;
    const grid = new Float32Array(GS * GS);
    let s = seed | 0;
    for (let i = 0; i < grid.length; i++) {
        s = (s * 9301 + 49297) % 233280;
        grid[i] = s / 233280;
    }
    const sg = (x, y) => grid[((y % GS) + GS) % GS * GS + ((x % GS) + GS) % GS];
    const sn = (x, y) => {
        const ix = Math.floor(x), iy = Math.floor(y);
        const fx = x - ix, fy = y - iy;
        const u = fx * fx * (3 - 2 * fx);
        const v = fy * fy * (3 - 2 * fy);
        return (sg(ix, iy) * (1 - u) + sg(ix + 1, iy) * u) * (1 - v) +
               (sg(ix, iy + 1) * (1 - u) + sg(ix + 1, iy + 1) * u) * v;
    };

    for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
            const i = (y * size + x) * 4;
            const u = (x / size) * 8;
            const v = (y / size) * 8;
            let n = 0, amp = 1, freq = 1, tot = 0;
            for (let o = 0; o < 5; o++) {
                n += amp * sn(u * freq, v * freq);
                tot += amp;
                amp *= 0.5; freq *= 2;
            }
            const c = Math.max(0, Math.min(255, Math.floor((n / tot) * 255)));
            data[i] = data[i + 1] = data[i + 2] = c;
            data[i + 3] = 255;
        }
    }
    ctx.putImageData(img, 0, 0);
    return cv;
}

function uploadTexture(srcCanvas, unit) {
    const tex = gl.createTexture();
    gl.activeTexture(gl['TEXTURE' + unit]);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, srcCanvas);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.generateMipmap(gl.TEXTURE_2D);
    return tex;
}

uploadTexture(makeNoiseTexture(256, 1), 0);
uploadTexture(makeNoiseTexture(256, 7), 1);
gl.uniform1i(gl.getUniformLocation(prog, 'iChannel0'), 0);
gl.uniform1i(gl.getUniformLocation(prog, 'iChannel1'), 1);

// ============================================================
//   状态与参数
// ============================================================
// 【修改点 3】：DEFAULTS 中的 camZoom 改为 2.5
const DEFAULTS = {
    camZoom: 2.5, camHeight: 1, camTilt: 0.35, rotSpeed: 0.05,
    sphRadius: 1,
    lightX: 1.0, lightY: 0.2, lightZ: 1.0,
    seaHue: 0.58, landHue: 0.25, landBright: 0.5, seaBright: 0.15,
    cloudCover: 0, glowStr: 1.5, gridStr: 0.5,
    bgBright: 1.5, exposure: 1
};
const state = { ...DEFAULTS };

function hueToRGB(h, s, v) {
    h = ((h % 1) + 1) % 1;
    const i = Math.floor(h * 6);
    const f = h * 6 - i;
    const p = v * (1 - s);
    const q = v * (1 - f * s);
    const t = v * (1 - (1 - f) * s);
    switch (i % 6) {
        case 0: return [v, t, p];
        case 1: return [q, v, p];
        case 2: return [p, v, t];
        case 3: return [p, q, v];
        case 4: return [t, p, v];
        case 5: return [v, p, q];
    }
    return [0, 0, 0];
}

function pushUniforms() {
    gl.uniform4f(U.uSph, 0, 0, 0, state.sphRadius);

    const lx = state.lightX, ly = state.lightY, lz = state.lightZ;
    const ll = Math.sqrt(lx * lx + ly * ly + lz * lz) || 1;
    gl.uniform3f(U.uLightDir, lx / ll, ly / ll, lz / ll);

    gl.uniform1f(U.uCamZoom, state.camZoom);
    gl.uniform1f(U.uCamHeight, state.camHeight);
    gl.uniform1f(U.uRotSpeed, state.rotSpeed);
    gl.uniform1f(U.uCamTilt, state.camTilt);

    const [sr1, sg1, sb1] = hueToRGB(state.seaHue, 0.85, 0.22);
    const [sr2, sg2, sb2] = hueToRGB(state.seaHue, 0.7, 0.32);
    gl.uniform3f(U.uSeaColor1, sr1, sg1, sb1);
    gl.uniform3f(U.uSeaColor2, sr2, sg2, sb2);
    gl.uniform1f(U.uSeaBrightness, state.seaBright);

    const [lr1, lg1, lb1] = hueToRGB(state.landHue, 0.6, 0.2);
    const [lr2, lg2, lb2] = hueToRGB(state.landHue, 0.5, 0.4);
    gl.uniform3f(U.uLandColor1, lr1, lg1, lb1);
    gl.uniform3f(U.uLandColor2, lr2, lg2, lb2);
    gl.uniform1f(U.uLandBrightness, state.landBright);

    gl.uniform3f(U.uCloudColor, 0.93 * 0.15, 0.93 * 0.15, 0.93 * 0.15);
    gl.uniform1f(U.uCloudCoverage, state.cloudCover);

    gl.uniform3f(U.uGlowColor, 0.6, 0.7, 1.0);
    gl.uniform1f(U.uGlowStrength, state.glowStr);
    gl.uniform1f(U.uGridStrength, state.gridStr);
    gl.uniform1f(U.uBgBrightness, state.bgBright);
    gl.uniform1f(U.uExposure, state.exposure);
}

//   鼠标

const mouse = { x: 0, y: 0, down: 0 };
canvas.addEventListener('mousedown', () => { mouse.down = 1; });
canvas.addEventListener('mouseup', () => { mouse.down = 0; });
canvas.addEventListener('mouseleave', () => { mouse.down = 0; });
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const dpr = canvas.width / rect.width;
    mouse.x = (e.clientX - rect.left) * dpr;
    mouse.y = (e.clientY - rect.top) * dpr;
});
canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length) { mouse.down = 1; updateTouch(e.touches[0]); }
}, { passive: true });
canvas.addEventListener('touchend', () => { mouse.down = 0; }, { passive: true });
canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length) updateTouch(e.touches[0]);
}, { passive: true });
function updateTouch(t) {
    const rect = canvas.getBoundingClientRect();
    const dpr = canvas.width / rect.width;
    mouse.x = (t.clientX - rect.left) * dpr;
    mouse.y = (t.clientY - rect.top) * dpr;
}

// ============================================================
//   渲染循环
// ============================================================
let frame = 0;
const startTime = performance.now();
let lastFpsTime = startTime;
let frameCount = 0;
const fpsEl = document.getElementById('fps');

function render() {
    const t = (performance.now() - startTime) / 1000;
    gl.uniform2f(U.iResolution, canvas.width, canvas.height);
    gl.uniform1f(U.iTime, t);
    gl.uniform1i(U.iFrame, frame++);
    gl.uniform4f(U.iMouse, mouse.x, canvas.height - mouse.y, mouse.down, 0);
    pushUniforms();
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    frameCount++;
    const now = performance.now();
    if (now - lastFpsTime > 500) {
        const fps = (frameCount * 1000 / (now - lastFpsTime)).toFixed(0);
        fpsEl.textContent = 'FPS: ' + fps;
        frameCount = 0;
        lastFpsTime = now;
    }
    requestAnimationFrame(render);
}
render();

<script>
/* UNIFORM_ALT_H */
(function(){
  var IDS=['control-panel','console-panel','ui-panel','settings-panel','inspector','panelHeader','panel','gui'];
  function findPanel(){
    for(var i=0;i<IDS.length;i++){ var e=document.getElementById(IDS[i]); if(e) return e; }
    var all=document.querySelectorAll('div');
    for(var j=0;j<all.length;j++){ var e=all[j]; var s=getComputedStyle(e);
      if(e.children.length>=2 && (s.position==='absolute'||s.position==='fixed') && e.querySelectorAll('input,select,button,canvas').length>=1)
        return e; }
    return null;
  }
  var _panel=null;
  document.addEventListener('keydown', function(ev){
    if(ev.altKey && ev.key.toLowerCase()==='h'){
      ev.preventDefault();
      var p=_panel||findPanel(); if(!p) return; _panel=p;
      var cur=p.style.display||getComputedStyle(p).display;
      p.style.display = (cur==='none') ? '' : 'none';
    }
  }, true);
})();
</script>

<!-- BG_PARAM_PERSIST -->
<script>
(function(){
  var FILE = 'a39.html';
  var KEY = 'bgParams:' + FILE;
  function allControls(){ return Array.prototype.slice.call(document.querySelectorAll('input,select,textarea')); }
  function serialize(){
    var d = {}, els = allControls();
    els.forEach(function(el){ if(el.id) d[el.id] = (el.type==='checkbox'||el.type==='radio') ? el.checked : el.value; });
    return d;
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(serialize())); }catch(e){} }
  function restore(){
    try{
      var d = JSON.parse(localStorage.getItem(KEY) || '{}');
      Object.keys(d).forEach(function(id){
        var el = document.getElementById(id); if(!el) return;
        if(el.type==='checkbox'||el.type==='radio') el.checked = !!d[id]; else el.value = d[id];
        try{ el.dispatchEvent(new Event('input',{bubbles:true})); }catch(e){}
        try{ el.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){}
      });
    }catch(e){}
  }
  document.addEventListener('input', save, true);
  document.addEventListener('change', save, true);
  window.addEventListener('load', function(){ restore(); setTimeout(restore, 700); setTimeout(restore, 1700); });
})();
</script>
