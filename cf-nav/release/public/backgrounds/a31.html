    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        /* Custom scrollbar for control console */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 4px; }

            height: 6px;
        }
        input[type=range]::-webkit-slider-thumb {

        /* 【新增】丝滑的显隐过渡动画类 */
        #control-console.panel-hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-15px) scale(0.98);

    </style>

<body class="w-full h-full relative text-slate-200">

                    <label class="relative inline-flex items-center cursor-pointer">

                        <div class="w-9 h-5 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>

            <hr class="border-slate-800">

            <!-- FXAA Parameter Sliders -->
            <div class="space-y-3.5">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">FXAA 算法核心参数</span>
                    <button id="btn-reset" class="text-[11px] text-blue-400 hover:text-blue-300 underline underline-offset-2">重置默认</button>
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between text-xs">

                        <span id="val-span-max" class="font-mono text-blue-400 font-bold">8.0</span>
                    </div>
                    <input type="range" id="param-span-max" min="1.0" max="16.0" step="0.5" value="8.0" class="w-full">

                </div>

                <div class="space-y-1">
                    <div class="flex justify-between text-xs">
                        <label for="param-reduce-min" class="text-slate-300 font-medium">最小阈值 (reduce_min)</label>
                        <span id="val-reduce-min" class="font-mono text-blue-400 font-bold">1/128</span>
                    </div>
                    <input type="range" id="param-reduce-min" min="0.001" max="0.05" step="0.001" value="0.0078125" class="w-full">
                    <p class="text-[10px] text-slate-500">防止低对比度暗区除以零及平滑度不足的基底值。</p>
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between text-xs">
                        <label for="param-reduce-mul" class="text-slate-300 font-medium">亮度缩放因子 (reduce_mul)</label>
                        <span id="val-reduce-mul" class="font-mono text-blue-400 font-bold">1/32</span>
                    </div>
                    <input type="range" id="param-reduce-mul" min="0.005" max="0.2" step="0.005" value="0.03125" class="w-full">
                    <p class="text-[10px] text-slate-500">高对比边缘混合梯度的倒数缩放乘数。</p>
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between text-xs">
                        <label for="param-texel-scale" class="text-slate-300 font-medium">采样像素步长 (Texel Scale)</label>
                        <span id="val-texel-scale" class="font-mono text-blue-400 font-bold">1.414 (√2)</span>
                    </div>
                    <input type="range" id="param-texel-scale" min="0.5" max="3.0" step="0.05" value="1.4142" class="w-full">
                    <p class="text-[10px] text-slate-500">纹素偏移比例，对角方向默认采用 √2 倍率。</p>
                </div>
            </div>

            <hr class="border-slate-800">

            <!-- Viewport Controls & Scene Options -->
            <div class="space-y-3">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">视口与场景设置</div>

                <div class="space-y-1">
                    <div class="flex justify-between text-xs">
                        <label for="param-zoom" class="text-slate-300 font-medium">放大倍率 (Zoom) - 观察锯齿</label>
                        <span id="val-zoom" class="font-mono text-blue-400 font-bold">1.0x</span>
                    </div>
                    <input type="range" id="param-zoom" min="1.0" max="8.0" step="0.2" value="1.0" class="w-full">
                    <p class="text-[10px] text-slate-500">也可通过滚轮在画布上放大/缩小像素。</p>
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between text-xs">
                        <label for="param-split-pos" class="text-slate-300 font-medium">分屏位置</label>
                        <span id="val-split-pos" class="font-mono text-blue-400 font-bold">50%</span>
                    </div>
                    <input type="range" id="param-split-pos" min="0.0" max="1.0" step="0.01" value="0.5" class="w-full">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-medium text-slate-300 block">测试 3D 场景</label>
                    <select id="select-scene" class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="glossy-cube">流光圆角立方体 (Glossy Cube)</option>
                        <option value="knot">高密度线框环面扭结 (Torus Knot Wireframe)</option>
                        <option value="grid">高频对角线与高对比立方体</option>
                        <option value="checkerboard">旋转棋盘格与发光线条</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between text-xs">
                        <label for="param-rotate-speed" class="text-slate-300 font-medium">场景旋转速度</label>
                        <span id="val-rotate-speed" class="font-mono text-blue-400 font-bold">1.0</span>
                    </div>
                    <input type="range" id="param-rotate-speed" min="0.0" max="3.0" step="0.1" value="1.0" class="w-full">
                </div>
            </div>

            <!-- Performance Info -->
            <div class="pt-2 border-t border-slate-800 flex justify-between items-center text-[11px] text-slate-500">
                <span>渲染分辩率: <span id="info-resolution">1920x1080</span></span>
                <span>帧率: <span id="info-fps" class="text-emerald-400 font-mono font-bold">60 FPS</span></span>
            </div>

    <script>
        // --- WebGL & Three.js Environment Initialization ---
        let scene, camera, renderer, renderTarget;
        let fxaaScene, fxaaCamera, fxaaMaterial, fxaaMesh;
        let activeSceneMeshGroup;
        
        let lastTime = performance.now();
        let frameCount = 0;
        let fps = 60;

        let isDraggingConsole = false;
        let consoleDragOffset = { x: 0, y: 0 };
        let isPanningCanvas = false;
        let panStart = { x: 0, y: 0 };
        let panOffset = { x: 0, y: 0 };

        const fxaaVertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fxaaFragmentShader = `
            uniform sampler2D tDiffuse;
            uniform vec2 uResolution;
            uniform bool uFxaaEnabled;
            uniform bool uShowSplit;
            uniform float uSplitPosition;
            
            uniform float uSpanMax;
            uniform float uReduceMin;
            uniform float uReduceMul;
            uniform float uTexelScale;

            uniform float uZoom;
            uniform vec2 uPan;

            varying vec2 vUv;

            vec4 fxaa(sampler2D tex, vec2 uv, vec2 texelSz, float span_max, float reduce_min, float reduce_mul) {
                const vec3 luma = vec3(0.299, 0.587, 0.114);
                vec3 rgbCC = texture2D(tex, uv).rgb;
                vec3 rgb00 = texture2D(tex, uv + vec2(-0.5, -0.5) * texelSz).rgb;
                vec3 rgb10 = texture2D(tex, uv + vec2(+0.5, -0.5) * texelSz).rgb;
                vec3 rgb01 = texture2D(tex, uv + vec2(-0.5, +0.5) * texelSz).rgb;
                vec3 rgb11 = texture2D(tex, uv + vec2(+0.5, +0.5) * texelSz).rgb;

                float lumaCC = dot(rgbCC, luma);
                float luma00 = dot(rgb00, luma);
                float luma10 = dot(rgb10, luma);
                float luma01 = dot(rgb01, luma);
                float luma11 = dot(rgb11, luma);

                vec2 dir = vec2((luma01 + luma11) - (luma00 + luma10), (luma00 + luma01) - (luma10 + luma11));
                float dirReduce = max((luma00 + luma10 + luma01 + luma11) * reduce_mul, reduce_min);
                float rcpDir = 1.0 / (min(abs(dir.x), abs(dir.y)) + dirReduce);
                dir = clamp(dir * rcpDir, -span_max, span_max) * texelSz.xy;

                vec4 A = 0.5 * (
                    texture2D(tex, uv - dir * (1.0 / 6.0)) +
                    texture2D(tex, uv + dir * (1.0 / 6.0))
                );
                vec4 B = A * 0.5 + 0.25 * (
                    texture2D(tex, uv - dir * (0.5)) +
                    texture2D(tex, uv + dir * (0.5))
                );

                float lumaMin = min(lumaCC, min(min(luma00, luma10), min(luma01, luma11)));
                float lumaMax = max(lumaCC, max(max(luma00, luma10), max(luma01, luma11)));
                float lumaB = dot(B.rgb, luma);

                return ((lumaB < lumaMin) || (lumaB > lumaMax)) ? A : B;
            }

            void main() {
                vec2 centeredUv = vUv - vec2(0.5);
                vec2 inspectUv = (centeredUv - uPan) / uZoom + vec2(0.5);

                if (inspectUv.x < 0.0 || inspectUv.x > 1.0 || inspectUv.y < 0.0 || inspectUv.y > 1.0) {
                    gl_FragColor = vec4(0.05, 0.07, 0.1, 1.0);
                    return;
                }

                vec2 isz = 1.0 / uResolution;
                vec2 texelSz = uTexelScale * isz;

                vec4 colorFXAA = fxaa(tDiffuse, inspectUv, texelSz, uSpanMax, uReduceMin, uReduceMul);
                vec4 colorRaw = texture2D(tDiffuse, inspectUv);

                if (!uFxaaEnabled) {
                    gl_FragColor = colorRaw;
                    return;
                }

                if (uShowSplit) {
                    if (vUv.x < uSplitPosition) gl_FragColor = colorFXAA; 
                    else gl_FragColor = colorRaw;  
                } else {
                    gl_FragColor = colorFXAA;
                }
            }
        `;

        function initEngine() {
            const container = document.getElementById('canvas-container');
            const width = window.innerWidth;
            const height = window.innerHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050510);

            camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
            camera.position.set(0, 0, 15);

            renderTarget = new THREE.WebGLRenderTarget(width, height, {
                minFilter: THREE.NearestFilter,
                magFilter: THREE.NearestFilter,
                format: THREE.RGBAFormat
            });

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.35;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0x0d0722, 0.8);
            scene.add(ambientLight);

            const dirLightBlue = new THREE.DirectionalLight(0x00f0ff, 4.5);
            dirLightBlue.position.set(-6, 8, 8);
            scene.add(dirLightBlue);

            const dirLightPink = new THREE.DirectionalLight(0xff00aa, 4.5);
            dirLightPink.position.set(8, -6, 6);
            scene.add(dirLightPink);
            
            const backLight = new THREE.DirectionalLight(0x7000ff, 3.0);
            backLight.position.set(0, 10, -5);
            scene.add(backLight);

            const spotLight = new THREE.PointLight(0xffffff, 2.0, 50);
            spotLight.position.set(1, 2, 8);
            scene.add(spotLight);

            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();
            
            const envCanvas = document.createElement('canvas');
            envCanvas.width = 1024; envCanvas.height = 512;
            const ctx = envCanvas.getContext('2d');
            
            ctx.fillStyle = '#020208';
            ctx.fillRect(0, 0, 1024, 512);
            
            let gCyan = ctx.createRadialGradient(700, 150, 10, 700, 150, 350);
            gCyan.addColorStop(0, 'rgba(255, 255, 255, 1.0)');
            gCyan.addColorStop(0.2, 'rgba(0, 240, 255, 0.9)');
            gCyan.addColorStop(0.5, 'rgba(0, 100, 255, 0.5)');
            gCyan.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gCyan;
            ctx.fillRect(0, 0, 1024, 512);

            let gMag = ctx.createRadialGradient(250, 380, 10, 250, 380, 380);
            gMag.addColorStop(0, 'rgba(255, 200, 255, 1.0)');
            gMag.addColorStop(0.25, 'rgba(255, 0, 180, 0.85)');
            gMag.addColorStop(0.6, 'rgba(120, 0, 220, 0.4)');
            gMag.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = gMag;
            ctx.fillRect(0, 0, 1024, 512);

            ctx.lineWidth = 40;
            ctx.strokeStyle = 'rgba(0, 230, 255, 0.7)';
            ctx.beginPath(); ctx.arc(650, 200, 180, 0, Math.PI * 2); ctx.stroke();

            ctx.lineWidth = 35;
            ctx.strokeStyle = 'rgba(255, 0, 160, 0.7)';
            ctx.beginPath(); ctx.arc(300, 320, 200, 0, Math.PI * 2); ctx.stroke();
            
            const envTexture = new THREE.CanvasTexture(envCanvas);
            envTexture.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = pmremGenerator.fromEquirectangular(envTexture).texture;

            activeSceneMeshGroup = new THREE.Group();
            scene.add(activeSceneMeshGroup);
            buildScene('glossy-cube');

            fxaaScene = new THREE.Scene();
            fxaaCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

            fxaaMaterial = new THREE.ShaderMaterial({
                vertexShader: fxaaVertexShader,
                fragmentShader: fxaaFragmentShader,
                uniforms: {
                    tDiffuse: { value: renderTarget.texture },
                    uResolution: { value: new THREE.Vector2(width, height) },
                    uFxaaEnabled: { value: true },
                    uShowSplit: { value: false },
                    uSplitPosition: { value: 0.5 },
                    uSpanMax: { value: 8.0 },
                    uReduceMin: { value: 1.0 / 128.0 },
                    uReduceMul: { value: 1.0 / 32.0 },
                    uTexelScale: { value: Math.SQRT2 },
                    uZoom: { value: 1.0 },
                    uPan: { value: new THREE.Vector2(0, 0) }
                }
            });

            fxaaMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), fxaaMaterial);
            fxaaScene.add(fxaaMesh);

            window.addEventListener('resize', onWindowResize);
            updateResolutionDisplay(width, height);
        }

        function createRoundedCubeGeometry(size = 6.2, radius = 1.8, segments = 64) {
            const geo = new THREE.BoxGeometry(size, size, size, segments, segments, segments);
            const pos = geo.attributes.position;
            const half = size / 2;
            const innerHalf = half - radius;
            const vec = new THREE.Vector3();

            for (let i = 0; i < pos.count; i++) {
                vec.fromBufferAttribute(pos, i);
                const cx = Math.max(-innerHalf, Math.min(innerHalf, vec.x));
                const cy = Math.max(-innerHalf, Math.min(innerHalf, vec.y));
                const cz = Math.max(-innerHalf, Math.min(innerHalf, vec.z));
                const dx = vec.x - cx;
                const dy = vec.y - cy;
                const dz = vec.z - cz;
                const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
                if (len > 0) {
                    const factor = radius / len;
                    pos.setXYZ(i, cx + dx * factor, cy + dy * factor, cz + dz * factor);
                }
            }
            geo.computeVertexNormals();
            return geo;
        }

        function buildScene(sceneType) {
            while(activeSceneMeshGroup.children.length > 0) { 
                const obj = activeSceneMeshGroup.children[0];
                if (obj.geometry) obj.geometry.dispose();
                activeSceneMeshGroup.remove(obj); 
            }

            if (sceneType === 'glossy-cube') {
                const geometry = createRoundedCubeGeometry(6.2, 1.8, 64);
                const material = new THREE.MeshPhysicalMaterial({
                    color: 0x070314, emissive: 0x080118, roughness: 0.04, metalness: 0.15,
                    clearcoat: 1.0, clearcoatRoughness: 0.03, transmission: 0.15, thickness: 1.2,
                    ior: 1.52, iridescence: 0.85, iridescenceIOR: 1.35, iridescenceThicknessRange: [100, 400], reflectivity: 0.9
                });
                const mesh = new THREE.Mesh(geometry, material);
                const innerGeo = createRoundedCubeGeometry(5.4, 1.5, 32);
                const innerMat = new THREE.MeshBasicMaterial({ color: 0x1f004d, transparent: true, opacity: 0.8 });
                const innerMesh = new THREE.Mesh(innerGeo, innerMat);
                activeSceneMeshGroup.add(innerMesh);
                activeSceneMeshGroup.add(mesh);
                activeSceneMeshGroup.rotation.set(0.55, -0.65, 0.25);
            } else if (sceneType === 'knot') {
                const geometry = new THREE.TorusKnotGeometry(3.5, 1.2, 256, 64);
                const material = new THREE.MeshStandardMaterial({ color: 0x00ffcc, wireframe: true, emissive: 0x004433 });
                activeSceneMeshGroup.add(new THREE.Mesh(geometry, material));
            } else if (sceneType === 'grid') {
                const geometry = new THREE.BoxGeometry(0.2, 16, 0.2);
                const m1 = new THREE.MeshStandardMaterial({ color: 0xff0055 });
                const m2 = new THREE.MeshStandardMaterial({ color: 0x00aaff });
                for (let i = 0; i < 60; i++) {
                    const mesh = new THREE.Mesh(geometry, i % 2 === 0 ? m1 : m2);
                    mesh.position.set((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12, (Math.random() - 0.5) * 8);
                    mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                    activeSceneMeshGroup.add(mesh);
                }
            } else if (sceneType === 'checkerboard') {
                const canvas = document.createElement('canvas');
                canvas.width = 512; canvas.height = 512;
                const ctx = canvas.getContext('2d');
                const tileSize = 512 / 16;
                for (let i = 0; i < 16; i++) {
                    for (let j = 0; j < 16; j++) {
                        ctx.fillStyle = (i + j) % 2 === 0 ? '#ffffff' : '#050811';
                        ctx.fillRect(i * tileSize, j * tileSize, tileSize, tileSize);
                    }
                }
                const texture = new THREE.CanvasTexture(canvas);
                texture.magFilter = THREE.NearestFilter;
                texture.minFilter = THREE.NearestFilter;
                const plane = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide }));
                plane.rotation.z = Math.PI / 8;
                activeSceneMeshGroup.add(plane);
                for (let r = 1.5; r <= 5.5; r += 0.8) {
                    const ring = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.04, 64), new THREE.MeshBasicMaterial({ color: 0x06b6d4, side: THREE.DoubleSide }));
                    ring.position.z = 0.1;
                    activeSceneMeshGroup.add(ring);
                }
            }
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
            renderTarget.setSize(width, height);
            fxaaMaterial.uniforms.uResolution.value.set(width, height);
            updateResolutionDisplay(width, height);
        }

        function updateResolutionDisplay(w, h) {
            document.getElementById('info-resolution').innerText = `${w}x${h}`;
        }

        function animate(now) {
            requestAnimationFrame(animate);
            frameCount++;
            if (now - lastTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (now - lastTime));
                document.getElementById('info-fps').innerText = `${fps} FPS`;
                frameCount = 0;
                lastTime = now;
            }

            const rotateSpeed = parseFloat(document.getElementById('param-rotate-speed').value);
            if (activeSceneMeshGroup) {
                activeSceneMeshGroup.rotation.y += 0.005 * rotateSpeed;
                activeSceneMeshGroup.rotation.x += 0.0025 * rotateSpeed;
            }

            renderer.setRenderTarget(renderTarget);
            renderer.clear();
            renderer.render(scene, camera);

            renderer.setRenderTarget(null);
            renderer.render(fxaaScene, fxaaCamera);
        }

        function setupUIInteractions() {
            const consoleEl = document.getElementById('control-console');
            const headerEl = document.getElementById('console-header');
            const bodyEl = document.getElementById('console-body');
            const btnCollapse = document.getElementById('btn-collapse');
            const iconCollapse = document.getElementById('icon-collapse');
            const btnClose = document.getElementById('btn-close');
            const btnReset = document.getElementById('btn-reset');
            const toastEl = document.getElementById('toast-msg');

            headerEl.addEventListener('mousedown', (e) => {
                if (e.target.closest('button')) return;
                isDraggingConsole = true;
                consoleDragOffset.x = e.clientX - consoleEl.offsetLeft;
                consoleDragOffset.y = e.clientY - consoleEl.offsetTop;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isDraggingConsole) return;
                let left = e.clientX - consoleDragOffset.x;
                let top = e.clientY - consoleDragOffset.y;
                left = Math.max(10, Math.min(window.innerWidth - consoleEl.offsetWidth - 10, left));
                top = Math.max(10, Math.min(window.innerHeight - consoleEl.offsetHeight - 10, top));
                consoleEl.style.left = `${left}px`;
                consoleEl.style.top = `${top}px`;
                consoleEl.style.right = 'auto'; 
            });

            window.addEventListener('mouseup', () => { isDraggingConsole = false; });

            let isCollapsed = false;
            btnCollapse.addEventListener('click', () => {
                isCollapsed = !isCollapsed;
                if (isCollapsed) {
                    bodyEl.classList.add('hidden');
                    iconCollapse.style.transform = 'rotate(-90deg)';
                } else {
                    bodyEl.classList.remove('hidden');
                    iconCollapse.style.transform = 'rotate(0deg)';
                }
            });

            // 【修改点2】：使用自定义的 panel-hidden 类，配合 CSS 实现丝滑显隐动画
            function toggleConsole() {
                if (consoleEl.classList.contains('panel-hidden')) {
                    consoleEl.classList.remove('panel-hidden');
                    showToast('控制台已显示');
                } else {
                    consoleEl.classList.add('panel-hidden');
                    showToast('控制台已隐藏，按 Alt + H 可重新打开');
                }
            }

            btnClose.addEventListener('click', toggleConsole);

            window.addEventListener('keydown', (e) => {
                if (e.altKey && (e.key === 'h' || e.key === 'H' || e.code === 'KeyH')) {
                    e.preventDefault();
                    toggleConsole();
                }
            });

            let toastTimer;
            function showToast(msg) {
                document.getElementById('toast-text').innerText = msg;
                toastEl.classList.remove('opacity-0');
                toastEl.classList.add('opacity-100');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastEl.classList.remove('opacity-100');
                    toastEl.classList.add('opacity-0');
                }, 3000);
            }

            setTimeout(() => { showToast('按键盘快捷键 Alt + H 可以随时隐藏/显示调试控制台'); }, 1200);

            const toggleFxaa = document.getElementById('toggle-fxaa');
            const toggleSplit = document.getElementById('toggle-split');
            const splitOverlayLabels = document.getElementById('overlay-labels');

            toggleFxaa.addEventListener('change', (e) => { fxaaMaterial.uniforms.uFxaaEnabled.value = e.target.checked; });
            toggleSplit.addEventListener('change', (e) => {
                const isChecked = e.target.checked;
                fxaaMaterial.uniforms.uShowSplit.value = isChecked;
                splitOverlayLabels.style.display = isChecked ? 'flex' : 'none';
            });

            const bindSlider = (id, valId, uniformKey, formatter) => {
                const el = document.getElementById(id);
                const valEl = document.getElementById(valId);
                el.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    valEl.innerText = formatter ? formatter(val) : val;
                    fxaaMaterial.uniforms[uniformKey].value = val;
                });
            };

            bindSlider('param-span-max', 'val-span-max', 'uSpanMax', v => v.toFixed(1));
            bindSlider('param-reduce-min', 'val-reduce-min', 'uReduceMin', v => `1/${Math.round(1/v)} (${v.toFixed(4)})`);
            bindSlider('param-reduce-mul', 'val-reduce-mul', 'uReduceMul', v => `1/${Math.round(1/v)} (${v.toFixed(3)})`);
            bindSlider('param-texel-scale', 'val-texel-scale', 'uTexelScale', v => v.toFixed(3));
            bindSlider('param-zoom', 'val-zoom', 'uZoom', v => `${v.toFixed(1)}x`);
            bindSlider('param-split-pos', 'val-split-pos', 'uSplitPosition', v => `${Math.round(v * 100)}%`);

            document.getElementById('select-scene').addEventListener('change', (e) => { buildScene(e.target.value); });

            btnReset.addEventListener('click', () => {
                document.getElementById('param-span-max').value = 8.0;
                document.getElementById('param-span-max').dispatchEvent(new Event('input'));
                document.getElementById('param-reduce-min').value = 0.0078125;
                document.getElementById('param-reduce-min').dispatchEvent(new Event('input'));
                document.getElementById('param-reduce-mul').value = 0.03125;
                document.getElementById('param-reduce-mul').dispatchEvent(new Event('input'));
                document.getElementById('param-texel-scale').value = 1.4142;
                document.getElementById('param-texel-scale').dispatchEvent(new Event('input'));
                document.getElementById('param-zoom').value = 1.0;
                document.getElementById('param-zoom').dispatchEvent(new Event('input'));
                document.getElementById('param-split-pos').value = 0.5;
                document.getElementById('param-split-pos').dispatchEvent(new Event('input'));
                toggleSplit.checked = false;
                fxaaMaterial.uniforms.uShowSplit.value = false;
                splitOverlayLabels.style.display = 'none';
                fxaaMaterial.uniforms.uPan.value.set(0, 0);
                showToast('已重置 FXAA 算法参数为默认值');
            });

            const canvasContainer = document.getElementById('canvas-container');
            canvasContainer.addEventListener('wheel', (e) => {
                e.preventDefault();
                let currentZoom = fxaaMaterial.uniforms.uZoom.value;
                const delta = e.deltaY > 0 ? -0.2 : 0.2;
                currentZoom = Math.min(8.0, Math.max(1.0, currentZoom + delta));
                document.getElementById('param-zoom').value = currentZoom;
                document.getElementById('val-zoom').innerText = `${currentZoom.toFixed(1)}x`;
                fxaaMaterial.uniforms.uZoom.value = currentZoom;
            }, { passive: false });

            canvasContainer.addEventListener('mousedown', (e) => {
                if (e.button === 0) {
                    isPanningCanvas = true;
                    panStart.x = e.clientX;
                    panStart.y = e.clientY;
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (!isPanningCanvas) return;
                const zoom = fxaaMaterial.uniforms.uZoom.value;
                if (zoom <= 1.0) return;
                const dx = (e.clientX - panStart.x) / window.innerWidth;
                const dy = -(e.clientY - panStart.y) / window.innerHeight;
                const pan = fxaaMaterial.uniforms.uPan.value;
                pan.x += dx / zoom;
                pan.y += dy / zoom;
                fxaaMaterial.uniforms.uPan.value = pan;
                panStart.x = e.clientX;
                panStart.y = e.clientY;
            });

            window.addEventListener('mouseup', () => { isPanningCanvas = false; });
        }

        window.addEventListener('load', () => {
            initEngine();
            setupUIInteractions();
            animate(performance.now());
        });
    </script>

<script>
/* UNIFORM_ALT_H */
(function(){
  var IDS=['control-panel','console-panel','ui-panel','settings-panel','inspector','panelHeader','panel','gui'];
  function findPanel(){
    for(var i=0;i<IDS.length;i++){ var e=document.getElementById(IDS[i]); if(e) return e; }
    var all=document.querySelectorAll('div');
    for(var j=0;j<all.length;j++){ var e=all[j]; var s=getComputedStyle(e);
      if(e.children.length>=2 && (s.position==='absolute'||s.position==='fixed') && e.querySelectorAll('input,select,button,canvas').length>=1)
        return e; }
    return null;
  }
  var _panel=null;
  document.addEventListener('keydown', function(ev){
    if(ev.altKey && ev.key.toLowerCase()==='h'){
      ev.preventDefault();
      var p=_panel||findPanel(); if(!p) return; _panel=p;
      var cur=p.style.display||getComputedStyle(p).display;
      p.style.display = (cur==='none') ? '' : 'none';
    }
  }, true);
})();
</script>

<!-- BG_PARAM_PERSIST -->
<script>
(function(){
  var FILE = 'a31.html';
  var KEY = 'bgParams:' + FILE;
  function allControls(){ return Array.prototype.slice.call(document.querySelectorAll('input,select,textarea')); }
  function serialize(){
    var d = {}, els = allControls();
    els.forEach(function(el){ if(el.id) d[el.id] = (el.type==='checkbox'||el.type==='radio') ? el.checked : el.value; });
    return d;
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(serialize())); }catch(e){} }
  function restore(){
    try{
      var d = JSON.parse(localStorage.getItem(KEY) || '{}');
      Object.keys(d).forEach(function(id){
        var el = document.getElementById(id); if(!el) return;
        if(el.type==='checkbox'||el.type==='radio') el.checked = !!d[id]; else el.value = d[id];
        try{ el.dispatchEvent(new Event('input',{bubbles:true})); }catch(e){}
        try{ el.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){}
      });
    }catch(e){}
  }
  document.addEventListener('input', save, true);
  document.addEventListener('change', save, true);
  window.addEventListener('load', function(){ restore(); setTimeout(restore, 700); setTimeout(restore, 1700); });
})();
</script>
