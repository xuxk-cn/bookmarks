<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>动态云层渲染器</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #e2e8f0;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(59, 130, 246, 0.05);
        }

        #control-panel {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 300px;
            border-radius: 16px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        #control-panel.panel-hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateX(20px) scale(0.98);
        }

        .panel-header {
            padding: 14px 18px;
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.1), rgba(139, 92, 246, 0.05));
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px 16px 0 0;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-header:active { cursor: grabbing; }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .collapse-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 14px;
        }
        .collapse-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        .panel-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 600px;
            overflow-y: auto;
            transition: max-height 0.4s ease, padding 0.4s ease, opacity 0.3s ease;
        }
        
        .panel-body::-webkit-scrollbar { width: 4px; }
        .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        .group-title {
            font-size: 11px;
            color: #3b82f6;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .group-title::before {
            content: "";
            width: 3px;
            height: 12px;
            background: linear-gradient(180deg, #3b82f6, #8b5cf6);
            border-radius: 2px;
        }

        .slider-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 8px; }

        .slider-row { display: flex; flex-direction: column; gap: 6px; }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #cbd5e1;
        }
        .slider-val {
            font-family: 'Fira Code', monospace;
            color: #93c5fd;
            font-weight: 600;
            background: rgba(59, 130, 246, 0.1);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #d946ef);
            border-radius: 3px;
            outline: none;
            opacity: 0.85;
            transition: opacity 0.2s;
        }
        input[type=range]:hover { opacity: 1; }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.9), 0 0 4px rgba(255, 255, 255, 0.8);
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid rgba(255,255,255,0.9);
        }
        input[type=range]::-webkit-slider-thumb:hover { 
            transform: scale(1.25); 
            box-shadow: 0 0 16px rgba(139, 92, 246, 1), 0 0 6px rgba(255, 255, 255, 1);
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            padding: 0;
            height: 32px;
            width: 100%;
            cursor: pointer;
            background: transparent;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
            border-radius: 6px;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="instructions" class="fixed bottom-6 left-6 z-40 px-4 py-2 rounded-full glass-panel text-xs text-slate-300 pointer-events-none flex items-center gap-2 border border-white/5">
        <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
            </div>

    <!-- 自定义高级控制台 (默认隐藏) -->
    <div id="control-panel" class="glass-panel panel-hidden">
        <div class="panel-header" id="panel-header">
            <div class="panel-title">
                <span>☁️</span>
                <span>动态云层控制台</span>
            </div>
            <button class="collapse-btn" id="btn-collapse" title="折叠/展开">
                <svg id="icon-collapse" class="w-4 h-4 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>
        </div>
        
        <div class="panel-body" id="panel-body">
            <div>
                <div class="group-title">通用设置</div>
                <div class="slider-group" id="group-general"></div>
            </div>
            <div>
                <div class="group-title">外观设置</div>
                <div class="slider-group" id="group-appearance"></div>
            </div>
            <div>
                <div class="group-title">颜色设置</div>
                <div class="slider-group" id="group-colors"></div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform vec2 iResolution;
            uniform float iTime;
            
            uniform float cloudscale;
            uniform float speed;
            uniform float clouddark;
            uniform float cloudlight;
            uniform float cloudcover;
            uniform float cloudalpha;
            uniform float skytint;
            uniform vec3 skycolour1;
            uniform vec3 skycolour2;

            const mat2 m = mat2( 1.6,  1.2, -1.2,  1.6 );

            vec2 hash( vec2 p ) {
                p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)));
                return -1.0 + 2.0*fract(sin(p)*43758.5453123);
            }

            float noise( in vec2 p ) {
                const float K1 = 0.366025404; 
                const float K2 = 0.211324865; 
                vec2 i = floor(p + (p.x+p.y)*K1);    
                vec2 a = p - i + (i.x+i.y)*K2;
                vec2 o = (a.x>a.y) ? vec2(1.0,0.0) : vec2(0.0,1.0);
                vec2 b = a - o + K2;
                vec2 c = a - 1.0 + 2.0*K2;
                vec3 h = max(0.5-vec3(dot(a,a), dot(b,b), dot(c,c) ), 0.0 );
                vec3 n = h*h*h*h*vec3( dot(a,hash(i+0.0)), dot(b,hash(i+o)), dot(c,hash(i+1.0)));
                return dot(n, vec3(70.0));    
            }

            float fbm(vec2 n) {
                float total = 0.0, amplitude = 0.1;
                for (int i = 0; i < 7; i++) {
                    total += noise(n) * amplitude;
                    n = m * n;
                    amplitude *= 0.4;
                }
                return total;
            }

            void mainImage( out vec4 fragColor, in vec2 fragCoord ) {
                vec2 p = fragCoord.xy / iResolution.xy;
                vec2 uv = p*vec2(iResolution.x/iResolution.y,1.0);    
                float time = iTime * speed;
                float q = fbm(uv * cloudscale * 0.5);
                
                float r = 0.0;
                uv *= cloudscale;
                uv -= q - time;
                float weight = 0.8;
                for (int i=0; i<8; i++){
                    r += abs(weight*noise( uv ));
                    uv = m*uv + time;
                    weight *= 0.7;
                }
                
                float f = 0.0;
                uv = p*vec2(iResolution.x/iResolution.y,1.0);
                uv *= cloudscale;
                uv -= q - time;
                weight = 0.7;
                for (int i=0; i<8; i++){
                    f += weight*noise( uv );
                    uv = m*uv + time;
                    weight *= 0.6;
                }
                
                f *= r + f;
                
                float c = 0.0;
                time = iTime * speed * 2.0;
                uv = p*vec2(iResolution.x/iResolution.y,1.0);
                uv *= cloudscale*2.0;
                uv -= q - time;
                weight = 0.4;
                for (int i=0; i<7; i++){
                    c += weight*noise( uv );
                    uv = m*uv + time;
                    weight *= 0.6;
                }
                
                float c1 = 0.0;
                time = iTime * speed * 3.0;
                uv = p*vec2(iResolution.x/iResolution.y,1.0);
                uv *= cloudscale*3.0;
                uv -= q - time;
                weight = 0.4;
                for (int i=0; i<7; i++){
                    c1 += abs(weight*noise( uv ));
                    uv = m*uv + time;
                    weight *= 0.6;
                }
                
                c += c1;
                
                vec3 skycolour = mix(skycolour2, skycolour1, p.y);
                vec3 cloudcolour = vec3(1.1, 1.1, 0.9) * clamp((clouddark + cloudlight*c), 0.0, 1.0);
               
                f = cloudcover + cloudalpha*f*r;
                
                vec3 result = mix(skycolour, clamp(skytint * skycolour + cloudcolour, 0.0, 1.0), clamp(f + c, 0.0, 1.0));
                
                fragColor = vec4( result, 1.0 );
            }

            void main() {
                mainImage(gl_FragColor, gl_FragCoord.xy);
            }
        `;

        let camera, scene, renderer;
        let uniforms;

        const config = {
            cloudscale: { val: 1.1, min: 0.1, max: 5.0, step: 0.1, fixed: 1, name: '云层缩放 (Scale)', group: 'general' },
            speed: { val: 0.03, min: 0.0, max: 0.2, step: 0.005, fixed: 3, name: '运动速度 (Speed)', group: 'general' },
            cloudcover: { val: 0.2, min: -1.0, max: 1.0, step: 0.05, fixed: 2, name: '云量 (Cover)', group: 'appearance' },
            cloudalpha: { val: 8.0, min: 0.0, max: 20.0, step: 0.5, fixed: 1, name: '云层厚度 (Alpha)', group: 'appearance' },
            clouddark: { val: 0.5, min: 0.0, max: 2.0, step: 0.05, fixed: 2, name: '云层暗部 (Dark)', group: 'appearance' },
            cloudlight: { val: 0.3, min: 0.0, max: 2.0, step: 0.05, fixed: 2, name: '云层亮部 (Light)', group: 'appearance' },
            skytint: { val: 0.5, min: 0.0, max: 1.0, step: 0.05, fixed: 2, name: '天空染色 (Tint)', group: 'colors' },
            skycolour1: { val: '#336699', type: 'color', name: '天空色 1 (Top)', group: 'colors' },
            skycolour2: { val: '#66b2ff', type: 'color', name: '天空色 2 (Bottom)', group: 'colors' }
        };

        function init() {
            const container = document.getElementById( 'canvas-container' );

            camera = new THREE.OrthographicCamera( - 1, 1, 1, - 1, 0, 1 );
            scene = new THREE.Scene();
            const geometry = new THREE.PlaneGeometry( 2, 2 );

            uniforms = {
                iTime: { value: 1.0 },
                iResolution: { value: new THREE.Vector2() },
                cloudscale: { value: config.cloudscale.val },
                speed: { value: config.speed.val },
                clouddark: { value: config.clouddark.val },
                cloudlight: { value: config.cloudlight.val },
                cloudcover: { value: config.cloudcover.val },
                cloudalpha: { value: config.cloudalpha.val },
                skytint: { value: config.skytint.val },
                skycolour1: { value: new THREE.Vector3(0.2, 0.4, 0.6) },
                skycolour2: { value: new THREE.Vector3(0.4, 0.7, 1.0) }
            };

            const material = new THREE.ShaderMaterial( {
                uniforms: uniforms,
                vertexShader: vertexShader,
                fragmentShader: fragmentShader
            } );

            const mesh = new THREE.Mesh( geometry, material );
            scene.add( mesh );

            renderer = new THREE.WebGLRenderer();
            renderer.setPixelRatio( window.devicePixelRatio );
            container.appendChild( renderer.domElement );

            onWindowResize();
            window.addEventListener( 'resize', onWindowResize );
            
            setupUI();
        }

        function setupUI() {
            const panel = document.getElementById('control-panel');
            const header = document.getElementById('panel-header');
            const body = document.getElementById('panel-body');
            const colBtn = document.getElementById('btn-collapse');
            const iconCol = document.getElementById('icon-collapse');

            const groups = {
                'general': document.getElementById('group-general'),
                'appearance': document.getElementById('group-appearance'),
                'colors': document.getElementById('group-colors')
            };

            for (const [key, c] of Object.entries(config)) {
                const container = groups[c.group];
                const row = document.createElement('div');
                row.className = 'slider-row';
                
                if (c.type === 'color') {
                    row.innerHTML = `
                        <div class="slider-label"><span>${c.name}</span></div>
                        <input type="color" id="sl-${key}" value="${c.val}">
                    `;
                    container.appendChild(row);
                    const slider = row.querySelector('input');
                    slider.addEventListener('input', (e) => {
                        const hex = e.target.value;
                        uniforms[key].value.set(
                            parseInt(hex.slice(1, 3), 16) / 255,
                            parseInt(hex.slice(3, 5), 16) / 255,
                            parseInt(hex.slice(5, 7), 16) / 255
                        );
                    });
                } else {
                    row.innerHTML = `
                        <div class="slider-label"><span>${c.name}</span><span class="slider-val" id="val-${key}">${c.val.toFixed(c.fixed)}</span></div>
                        <input type="range" id="sl-${key}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.val}">
                    `;
                    container.appendChild(row);
                    const slider = row.querySelector('input');
                    const valEl = row.querySelector('.slider-val');
                    slider.addEventListener('input', (e) => {
                        const v = parseFloat(e.target.value);
                        uniforms[key].value = v;
                        valEl.textContent = v.toFixed(c.fixed);
                    });
                }
            }
            
            let isCollapsed = false;
            colBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                isCollapsed = !isCollapsed;
                if (isCollapsed) {
                    body.style.maxHeight = '0px';
                    body.style.paddingTop = '0';
                    body.style.paddingBottom = '0';
                    body.style.opacity = '0';
                    iconCol.style.transform = 'rotate(-90deg)';
                } else {
                    body.style.maxHeight = '600px';
                    body.style.paddingTop = '16px';
                    body.style.paddingBottom = '16px';
                    body.style.opacity = '1';
                    iconCol.style.transform = 'rotate(0deg)';
                }
            });

            let isDragging = false, startX, startY, initLeft, initTop;
            header.addEventListener('mousedown', (e) => {
                if (e.target.closest('button')) return;
                isDragging = true;
                startX = e.clientX; startY = e.clientY;
                const rect = panel.getBoundingClientRect();
                initLeft = rect.left; initTop = rect.top;
                panel.style.right = 'auto';
                panel.style.transition = 'none';
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                let nx = initLeft + e.clientX - startX;
                let ny = initTop + e.clientY - startY;
                nx = Math.max(0, Math.min(nx, window.innerWidth - panel.offsetWidth));
                ny = Math.max(0, Math.min(ny, window.innerHeight - 50));
                panel.style.left = nx + 'px';
                panel.style.top = ny + 'px';
            });
            window.addEventListener('mouseup', () => {
                isDragging = false;
                panel.style.transition = '';
            });

            let isVisible = false; // 默认隐藏
            window.addEventListener('keydown', (e) => {
                if (e.altKey && e.key.toLowerCase() === 'h') {
                    e.preventDefault();
                    isVisible = !isVisible;
                    if (isVisible) {
                        panel.classList.remove('panel-hidden');
                    } else {
                        panel.classList.add('panel-hidden');
                    }
                }
            });
        }

        function onWindowResize() {
            renderer.setSize( window.innerWidth, window.innerHeight );
            uniforms.iResolution.value.x = renderer.domElement.width;
            uniforms.iResolution.value.y = renderer.domElement.height;
        }

        function animate() {
            requestAnimationFrame( animate );
            uniforms.iTime.value = performance.now() / 1000;
            renderer.render( scene, camera );
        }

        init();
        animate();
    </script>

<!-- 应用到导航页 悬浮按钮（由 inject_apply_button.py 注入） -->

<script>
function __applyToNav__() {
  var file = 'a37.html';
  localStorage.setItem('bgChoice', file);
  var btn = document.getElementById('__apply-btn__');
  btn.textContent = '✔ 已应用！';
  btn.style.background = '#1a7f37';
  setTimeout(function() {
    btn.textContent = '✓ 应用到导航页';
    btn.style.background = '#238636';
  }, 2000);
}
</script>

</body>
</html>
