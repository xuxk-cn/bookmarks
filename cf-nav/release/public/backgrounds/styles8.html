<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航 - Glance 风格</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:"JetBrains Mono","Fira Code","Courier New","PingFang SC","Microsoft YaHei",monospace,sans-serif;background:#0e1419;color:#a0a8b0;min-height:100vh;overflow-x:hidden}

/* 顶部 Tab 栏 */
.top-bar{display:flex;align-items:center;background:#0e1419;padding:14px 24px;border-bottom:1px solid rgba(160,168,176,.08);position:sticky;top:0;z-index:50}
.top-logo{width:30px;height:30px;border:1px solid rgba(160,168,176,.3);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#a0a8b0;font-weight:bold;font-size:14px;margin-right:18px;cursor:pointer}
.top-logo:hover{border-color:#36ae7b;color:#36ae7b}
.top-tabs{display:flex;gap:6px}
.top-tab{padding:6px 14px;color:#a0a8b0;font-size:13px;cursor:pointer;border-radius:4px;border:1px solid transparent;transition:all .2s}
.top-tab:hover{color:#cfd6dc}
.top-tab.active{border-color:#36ae7b;color:#36ae7b}
a.top-tab{text-decoration:none;display:inline-flex;align-items:center}
a.top-tab:hover{color:#36ae7b;border-color:rgba(54,174,123,.4)}

/* 容器 */
.app{max-width:1400px;margin:0 auto;padding:20px 24px 60px}

/* 主体网格 */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

/* Widget 通用样式 */
.widget{background:#161b22;border:1px solid rgba(160,168,176,.08);border-radius:8px;overflow:hidden;transition:border-color .2s}
.widget:hover{border-color:rgba(54,174,123,.3)}
.widget-header{padding:10px 14px;color:#a0a8b0;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;border-bottom:1px solid rgba(160,168,176,.05)}
.widget-header .wh-link{color:inherit;text-decoration:none}
.widget-header .wh-link:hover{color:#36ae7b}
.widget-header .wh-link i{font-size:10px;margin-left:4px}
.widget-body{padding:10px 14px}

/* 时钟 widget */
.clock{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.clock-left{font-size:24px;color:#cfd6dc;font-weight:600;line-height:1.2}
.clock-left .year{display:block;font-size:11px;color:#a0a8b0;font-weight:400;margin-top:4px}
.clock-right{text-align:right;font-size:13px;color:#cfd6dc;font-weight:600}
.clock-right .week{display:block;font-size:11px;color:#36ae7b;font-weight:400;margin-top:4px}

/* 天气（时钟 widget 内） */
.weather{margin-top:10px;padding-top:10px;border-top:1px dashed rgba(160,168,176,.12);display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:11px;color:#a0a8b0}
.weather .w-icon{color:#36ae7b;font-size:14px}
.weather .w-temp{color:#cfd6dc;font-size:15px;font-weight:600}
.weather .w-city{color:#36ae7b}

/* 链接列表 widget */
.link-list{display:flex;flex-direction:column;gap:8px}
.link-item{display:block;color:#36ae7b;text-decoration:none;font-size:13px;line-height:1.5;cursor:pointer;padding:2px 0}
.link-item:hover{color:#4dd09a;text-decoration:underline}
.link-meta{display:block;color:#a0a8b0;font-size:11px;font-weight:400;margin-top:2px}
.show-more{display:block;padding:6px 0;color:#a0a8b0;font-size:11px;text-transform:uppercase;cursor:pointer;margin-top:6px}
.show-more:hover{color:#36ae7b}
.show-more::before{content:'▼ ';font-size:8px}

/* Feed item */
.feed-item{padding:8px 0;border-bottom:1px solid rgba(160,168,176,.05)}
.feed-item:last-child{border-bottom:none}
.feed-item .feed-title{display:block;color:#cfd6dc;font-size:13px;font-weight:500;line-height:1.4;text-decoration:none}
.feed-item .feed-title:hover{color:#36ae7b;text-decoration:underline}
.feed-item .feed-meta{color:#a0a8b0;font-size:11px;margin-top:4px}
.feed-item .feed-desc{color:#a0a8b0;font-size:12px;margin-top:6px;line-height:1.5}
.tag{display:inline-block;background:rgba(54,174,123,.1);color:#36ae7b;font-size:10px;padding:2px 6px;border-radius:3px;margin-right:4px;margin-top:4px}

/* 视频/封面 widget */
.video-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
a.video-item{display:block;text-decoration:none;transition:transform .2s}
.video-item:hover{transform:translateY(-2px)}
.video-thumb{width:100%;aspect-ratio:16/9;background:#0e1419;border-radius:4px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.video-thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.6));pointer-events:none}
.video-thumb .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:24px;opacity:.7;z-index:2}
.video-thumb .v-len{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.78);color:#fff;font-size:10px;padding:1px 5px;border-radius:3px;z-index:2;letter-spacing:.5px}
.video-title{color:#cfd6dc;font-size:12px;font-weight:500;margin-top:6px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.video-item:hover .video-title{color:#36ae7b}
.video-meta{color:#a0a8b0;font-size:11px;margin-top:3px}

/* 搜索框 widget */
.search-widget{display:flex;align-items:center;background:#0e1419;border:1px solid rgba(160,168,176,.15);border-radius:6px;padding:8px 12px;gap:8px}
.search-widget i{color:#a0a8b0;font-size:13px}
.search-widget input{flex:1;background:transparent;border:none;color:#cfd6dc;font-family:inherit;font-size:13px;outline:none}
.search-widget input::placeholder{color:#6c7480}

/* 站点图标网格 widget（标签常显 + 字符兜底） */
.site-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.site-item{background:#0e1419;border:1px solid rgba(160,168,176,.08);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px 8px;transition:all .2s;text-decoration:none;overflow:hidden}
.site-item:hover{border-color:#36ae7b;transform:translateY(-2px);background:#1a2129}
.site-item:hover .site-label{color:#36ae7b}
.site-icon{width:30px;height:30px;position:relative;flex-shrink:0}
.site-icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:4px}
.site-char{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(54,174,123,.12);color:#36ae7b;border-radius:6px;font-size:13px;font-weight:700}
.site-icon.hasimg .site-char{display:none}
.site-label{max-width:100%;font-size:10px;color:#a0a8b0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .2s}

/* 回到顶部 */
.to-top{position:fixed;right:24px;bottom:24px;width:40px;height:40px;background:#161b22;border:1px solid rgba(54,174,123,.3);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#36ae7b;cursor:pointer;font-size:16px;opacity:0;pointer-events:none;transition:all .2s;z-index:50}
.to-top.show{opacity:1;pointer-events:auto}
.to-top:hover{background:#36ae7b;color:#0e1419}

@media(max-width:1200px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.site-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.site-grid{grid-template-columns:repeat(4,1fr)}.video-list{grid-template-columns:1fr}}
</style>
</head>

<script>
const DATA=JSON.parse(document.getElementById('nav-data').textContent);
const CATS=DATA.cats;
const VIDEOS=DATA.videos;
const CHANNEL_URL='https://www.youtube.com/@AstraView-%E6%98%9F%E8%BE%B0%E8%A7%86%E7%95%8C';
const gridEl=document.getElementById('grid');
const totopEl=document.getElementById('totop');

function escHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function getHost(url){try{return new URL(url).hostname}catch(e){return ''}}
function pickItems(cat,n){const items=CATS[cat]||[];return items.slice(0,n)}

function widget(title,body,href){
    const head=href?`<a class="wh-link" href="${href}" target="_blank" rel="noopener">${escHtml(title)} <i class="fa fa-external-link"></i></a>`:escHtml(title);
    return `<div class="widget"><div class="widget-header">${head}</div><div class="widget-body">${body}</div></div>`;
}

/* ===== 时钟 + 自动定位天气 ===== */
const WMO={0:['Clear','fa-sun-o'],1:['Mostly Clear','fa-sun-o'],2:['Partly Cloudy','fa-cloud'],3:['Overcast','fa-cloud'],45:['Fog','fa-cloud'],48:['Fog','fa-cloud'],51:['Light Drizzle','fa-cloud-rain'],53:['Drizzle','fa-cloud-rain'],55:['Heavy Drizzle','fa-cloud-rain'],56:['Freezing Drizzle','fa-cloud-rain'],57:['Freezing Drizzle','fa-cloud-rain'],61:['Light Rain','fa-cloud-rain'],63:['Rain','fa-cloud-rain'],65:['Heavy Rain','fa-cloud-rain'],66:['Freezing Rain','fa-cloud-rain'],67:['Freezing Rain','fa-cloud-rain'],71:['Light Snow','fa-snowflake-o'],73:['Snow','fa-snowflake-o'],75:['Heavy Snow','fa-snowflake-o'],77:['Snow Grains','fa-snowflake-o'],80:['Light Showers','fa-cloud-rain'],81:['Showers','fa-cloud-rain'],82:['Heavy Showers','fa-cloud-rain'],85:['Snow Showers','fa-snowflake-o'],86:['Snow Showers','fa-snowflake-o'],95:['Thunderstorm','fa-bolt'],96:['Thunderstorm','fa-bolt'],99:['Thunderstorm','fa-bolt']};

function clockWidget(){
    const d=new Date();
    const month=d.toLocaleString('en-US',{month:'long'});
    const day=d.getDate();
    const year=d.getFullYear();
    const week=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
    const time=d.toTimeString().slice(0,5);
    return widget('Clock',`
        <div class="clock">
            <div class="clock-left">${day} ${month}<span class="year">${year}</span></div>
            <div class="clock-right">${time}<span class="week">${week}</span></div>
        </div>
        <div class="weather" id="weather-box"><i class="fa fa-spinner fa-spin w-icon"></i><span>Locating…</span></div>`);
}

async function initWeather(){
    const box=document.getElementById('weather-box');
    if(!box)return;
    let lat=null,lon=null,place='';
    try{
        const pos=await new Promise((res,rej)=>{
            if(!navigator.geolocation)return rej(new Error('no geo'));
            navigator.geolocation.getCurrentPosition(res,rej,{timeout:4000,maximumAge:600000});
        });
        lat=pos.coords.latitude;lon=pos.coords.longitude;
        try{
            const rg=await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lon+'&localityLanguage=zh').then(r=>r.json());
            place=rg.city||rg.locality||rg.principalSubdivision||'';
        }catch(e){}
    }catch(e){
        try{
            const ip=await fetch('https://ipapi.co/json/').then(r=>r.json());
            lat=ip.latitude;lon=ip.longitude;place=ip.city||'';
        }catch(e2){}
    }
    if(lat==null||lon==null){box.innerHTML='<i class="fa fa-cloud w-icon"></i><span>Weather unavailable</span>';return;}
    try{
        const w=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m').then(r=>r.json());
        const c=w.current||{};
        const info=WMO[c.weather_code]||['—','fa-cloud'];
        box.innerHTML='<i class="fa '+info[1]+' w-icon"></i>'
            +'<span class="w-temp">'+Math.round(c.temperature_2m)+'°C</span>'
            +'<span>'+info[0]+'</span>'
            +(place?'<span class="w-city">'+escHtml(place)+'</span>':'')
            +'<span>Humidity '+Math.round(c.relative_humidity_2m)+'% · Wind '+Math.round(c.wind_speed_10m)+'km/h</span>';
    }catch(e){
        box.innerHTML='<i class="fa fa-cloud w-icon"></i><span>Weather unavailable</span>';
    }
}

function searchWidget(){
    return widget('Search',`
        <div class="search-widget">
            <i class="fa fa-search"></i>
            <input type="text" id="glance-search" placeholder="Search bookmarks...">
        </div>`);
}

function linkListWidget(title,items){
    const list=items.map(it=>`<a class="link-item" href="${escHtml(it.u)}" target="_blank" rel="noopener">${escHtml(it.t)}<span class="link-meta">${escHtml(it.h||'')}</span></a>`).join('');
    return widget(title,list+`<div class="show-more">SHOW MORE</div>`);
}

function feedWidget(title,items){
    const list=items.map(it=>`
        <div class="feed-item">
            <a class="feed-title" href="${escHtml(it.u)}" target="_blank" rel="noopener">${escHtml(it.t)}</a>
            <div class="feed-meta">${escHtml(getHost(it.u))} · ${escHtml(it.cat)}</div>
            <div class="feed-desc">${escHtml(it.h)}</div>
            <span class="tag">${escHtml(it.cat)}</span>
        </div>`).join('');
    return widget(title,list);
}

/* ===== 频道视频 widget：AstraView·星辰视界 首页最新8个视频 ===== */
function videoWidget(){
    const grads=['152,68,54','36,88,130','104,58,126','46,112,70','140,94,40','52,84,140','130,50,80','40,110,110'];
    const items=VIDEOS.map((v,i)=>`
        <a class="video-item" href="https://www.youtube.com/results?search_query=${encodeURIComponent(v.t)}" target="_blank" rel="noopener" title="${escHtml(v.t)}">
            <div class="video-thumb" style="background:linear-gradient(135deg,rgba(${grads[i%8]},.5),#0e1419)">
                <i class="fa fa-play-circle play-icon"></i>
                <span class="v-len">${escHtml(v.len)}</span>
            </div>
            <div class="video-title">${escHtml(v.t)}</div>
            <div class="video-meta">${escHtml(v.ago)} · 宽哥 · AstraView</div>
        </a>`).join('');
    return widget('AstraView · 星辰视界',`<div class="video-list">${items}</div>`,CHANNEL_URL);
}

/* ===== 站点网格：标签常显 + 字符兜底 + 双 favicon 源 ===== */
function siteGridWidget(title,items){
    const list=items.map(it=>{
        const h=getHost(it.u);
        const fa=h?`https://api.iowen.cn/favicon/favicon.php?domain=${h}&size=64`:'';
        const fb=h?`https://www.google.com/s2/favicons?domain=${h}&sz=64`:'';
        const ch=escHtml(((it.t||'?').trim().charAt(0)||'?').toUpperCase());
        return `
        <a class="site-item" href="${escHtml(it.u)}" target="_blank" rel="noopener" data-t="${escHtml(it.t)}" title="${escHtml(it.t)}${it.h?' · '+escHtml(it.h):''}">
            <div class="site-icon">
                <span class="site-char">${ch}</span>
                <img src="${fa}" data-fb="${fb}" alt=""
                     onload="this.parentNode.classList.add('hasimg')"
                     onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.removeAttribute('data-fb');}else{this.style.display='none';}">
            </div>
            <div class="site-label">${escHtml(it.t)}</div>
        </a>`;
    }).join('');
    return widget(title,`<div class="site-grid">${list}</div>`);
}

function renderGrid(){
    const html=[
        clockWidget(),
        searchWidget(),
        linkListWidget('Top Resources',pickItems('resourse',5)),
        feedWidget('r/Selfhosted',pickItems('Blog',4)),
        feedWidget('r/Homelab',pickItems('身份',3)),
        videoWidget(),
        feedWidget('Self-Hosted News',pickItems('AIGC',3)),
        feedWidget('Self-Hosted Podcasts',pickItems('AI声音',2)),
        siteGridWidget('Resources',pickItems('resourse',8)),
        siteGridWidget('Tools',pickItems('tools',8)),
        siteGridWidget('视频',pickItems('视频',8)),
        siteGridWidget('AIGC',pickItems('AIGC',8)),
        siteGridWidget('AI 大语言',pickItems('AI大语言',8)),
        siteGridWidget('AI 声音',pickItems('AI声音',8)),
        siteGridWidget('AI 3D',pickItems('AI-3D',8)),
        siteGridWidget('API & VPS',pickItems('API-VPS',8)),
        siteGridWidget('APK & Proxy',pickItems('APK-Proxy',8)),
        siteGridWidget('Nano Banana',pickItems('Nano Banana',8)),
        siteGridWidget('YouTube',pickItems('YouTube',8)),
        siteGridWidget('Mail',pickItems('mail',8)),
        siteGridWidget('Google',pickItems('Google',8)),
        siteGridWidget('电影',pickItems('电影',8)),
        siteGridWidget('身份',pickItems('身份',8)),
        siteGridWidget('壁纸',pickItems('壁纸',8))
    ].join('');
    gridEl.innerHTML=html;
    bindEvents();
    initWeather();
}

function bindEvents(){
    const search=document.getElementById('glance-search');
    if(search){
        search.oninput=function(){
            const q=this.value.trim().toLowerCase();
            if(!q)return;
            document.querySelectorAll('.site-item').forEach(s=>{
                const t=(s.dataset.t||'').toLowerCase();
                s.style.display=t.includes(q)?'':'none';
            });
        };
    }
}

/* 顶部 Tab */
document.querySelectorAll('.top-tab[data-tab]').forEach(t=>{
    t.onclick=function(){
        document.querySelectorAll('.top-tab[data-tab]').forEach(x=>x.classList.remove('active'));
        this.classList.add('active');
    };
});

window.addEventListener('scroll',()=>{
    totopEl.classList.toggle('show',window.scrollY>400);
});
totopEl.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});

renderGrid();
</script>
