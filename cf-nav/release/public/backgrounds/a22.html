<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 环状分形着色器</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #e2e8f0;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #info {
            position: absolute;
            bottom: 24px;
            left: 24px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(15, 18, 25, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.05);
            user-select: none;
            z-index: 50;
        }
        #info kbd {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        /* 高级毛玻璃面板 */
        .glass-panel {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 300px;
            background: rgba(15, 18, 25, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(139, 92, 246, 0.05);
            z-index: 100;
            display: flex;
            flex-direction: column;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
        }

        .panel-header {
            padding: 14px 18px;
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.1), rgba(59, 130, 246, 0.05));
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px 16px 0 0;
            cursor: grab;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .panel-header:active { cursor: grabbing; }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .collapse-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-size: 14px;
        }
        .collapse-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        .panel-body {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 600px;
            overflow-y: auto;
            transition: max-height 0.4s ease, padding 0.4s ease, opacity 0.3s ease;
        }
        
        .panel-body::-webkit-scrollbar { width: 4px; }
        .panel-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        .group-title {
            font-size: 11px;
            color: #8b5cf6;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .group-title::before {
            content: "";
            width: 3px;
            height: 12px;
            background: linear-gradient(180deg, #8b5cf6, #3b82f6);
            border-radius: 2px;
        }

        .slider-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 8px; }

        .slider-row { display: flex; flex-direction: column; gap: 6px; }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #cbd5e1;
        }
        .slider-val {
            font-family: 'Fira Code', monospace;
            color: #a78bfa;
            font-weight: 600;
            background: rgba(139, 92, 246, 0.1);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        /* 🌟 全新定制发光渐变滑杆 */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #d946ef);
            border-radius: 3px;
            outline: none;
            opacity: 0.85;
            transition: opacity 0.2s;
        }
        input[type=range]:hover { opacity: 1; }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.9), 0 0 4px rgba(255, 255, 255, 0.8);
            transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid rgba(255,255,255,0.9);
        }
        input[type=range]::-webkit-slider-thumb:hover { 
            transform: scale(1.25); 
            box-shadow: 0 0 16px rgba(217, 70, 239, 1), 0 0 6px rgba(255, 255, 255, 1);
        }
        input[type=range]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #ffffff;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.9);
        }

        /* 🎨 颜色选择器美化 */
        .color-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #cbd5e1;
        }
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            padding: 0;
            background: none;
            box-shadow: 0 0 0 2px rgba(255,255,255,0.1), 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        input[type="color"]:hover {
            transform: scale(1.1);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.5), 0 4px 15px rgba(139, 92, 246, 0.4);
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 6px; }
        input[type="color"]::-moz-color-swatch { border: none; border-radius: 6px; }

    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>
    <div id="container"></div>

    <!-- 自定义高级控制台 (默认隐藏) -->
    <div id="control-panel" class="glass-panel" style="opacity: 0; pointer-events: none; transform: translateX(20px);">
        <div class="panel-header" id="panel-header">
            <div class="panel-title">
                <span>🪐</span>
                <span>分形环参数控制台</span>
            </div>
            <button class="collapse-btn" id="collapse-btn" title="折叠/展开">−</button>
        </div>
        
        <div class="panel-body" id="panel-body">
            <!-- 分组 1 -->
            <div>
                <div class="group-title">形状参数</div>
                <div class="slider-group">
                    <div class="slider-row">
                        <div class="slider-label"><span>噪声缩放</span><span class="slider-val" id="val-noiseScale">0.65</span></div>
                        <input type="range" id="sl-noiseScale" min="0.1" max="2.0" step="0.01" value="0.65">
                    </div>
                    <div class="slider-row">
                        <div class="slider-label"><span>内半径</span><span class="slider-val" id="val-innerRadius">0.60</span></div>
                        <input type="range" id="sl-innerRadius" min="0.1" max="1.0" step="0.01" value="0.6">
                    </div>
                </div>
            </div>

            <!-- 分组 2 -->
            <div>
                <div class="group-title">颜色参数</div>
                <div class="slider-group">
                    <div class="color-row"><span>主色 1 (紫)</span><input type="color" id="clr-color1" value="#9c43fe"></div>
                    <div class="color-row"><span>主色 2 (蓝)</span><input type="color" id="clr-color2" value="#4cc2e9"></div>
                    <div class="color-row"><span>暗部色 (深蓝)</span><input type="color" id="clr-color3" value="#101499"></div>
                    <div class="color-row"><span>背景色</span><input type="color" id="clr-bgColor" value="#000000"></div>
                </div>
            </div>

            <!-- 分组 3 -->
            <div>
                <div class="group-title">时间控制</div>
                <div class="slider-group">
                    <div class="slider-row">
                        <div class="slider-label"><span>演化速度</span><span class="slider-val" id="val-timeScale">1.00</span></div>
                        <input type="range" id="sl-timeScale" min="0.0" max="5.0" step="0.1" value="1.0">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        let camera, scene, renderer, material;
        
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4( position, 1.0 );
            }
        `;

        const fragmentShader = `
            uniform vec3 iResolution;
            uniform float iTime;
            
            uniform float uNoiseScale;
            uniform float uInnerRadius;
            uniform vec3 uColor1;
            uniform vec3 uColor2;
            uniform vec3 uColor3;
            uniform vec3 uBgColor;
            uniform float uTimeScale;

            varying vec2 vUv;

            vec3 hash33(vec3 p3) {
                p3 = fract(p3 * vec3(.1031,.11369,.13787));
                p3 += dot(p3, p3.yxz+19.19);
                return -1.0 + 2.0 * fract(vec3(p3.x+p3.y, p3.x+p3.z, p3.y+p3.z)*p3.zyx);
            }
            
            float snoise3(vec3 p) {
                const float K1 = 0.333333333;
                const float K2 = 0.166666667;
                vec3 i = floor(p + (p.x + p.y + p.z) * K1);
                vec3 d0 = p - (i - (i.x + i.y + i.z) * K2);
                vec3 e = step(vec3(0.0), d0 - d0.yzx);
                vec3 i1 = e * (1.0 - e.zxy);
                vec3 i2 = 1.0 - e.zxy * (1.0 - e);
                vec3 d1 = d0 - (i1 - K2);
                vec3 d2 = d0 - (i2 - K1);
                vec3 d3 = d0 - 0.5;
                vec4 h = max(0.6 - vec4(dot(d0, d0), dot(d1, d1), dot(d2, d2), dot(d3, d3)), 0.0);
                vec4 n = h * h * h * h * vec4(dot(d0, hash33(i)), dot(d1, hash33(i + i1)), dot(d2, hash33(i + i2)), dot(d3, hash33(i + 1.0)));
                return dot(vec4(31.316), n);
            }

            vec4 extractAlpha(vec3 colorIn) {
                vec4 colorOut;
                float maxValue = min(max(max(colorIn.r, colorIn.g), colorIn.b), 1.0);
                if (maxValue > 1e-5) {
                    colorOut.rgb = colorIn.rgb * (1.0 / maxValue);
                    colorOut.a = maxValue;
                } else {
                    colorOut = vec4(0.0);
                }
                return colorOut;
            }

            float light1(float intensity, float attenuation, float dist) {
                return intensity / (1.0 + dist * attenuation);
            }
            
            float light2(float intensity, float attenuation, float dist) {
                return intensity / (1.0 + dist * dist * attenuation);
            }

            void draw( out vec4 _FragColor, in vec2 uvLocal ) {
                float localTime = iTime * uTimeScale;
                float ang = atan(uvLocal.y, uvLocal.x);
                float len = length(uvLocal);
                float v0, v1, v2, v3, cl;
                float r0, d0, n0;
                float r, d;
                
                n0 = snoise3( vec3(uvLocal * uNoiseScale, localTime * 0.5) ) * 0.5 + 0.5;
                r0 = mix(mix(uInnerRadius, 1.0, 0.4), mix(uInnerRadius, 1.0, 0.6), n0);
                d0 = distance(uvLocal, r0 / len * uvLocal);
                v0 = light1(1.0, 10.0, d0);
                v0 *= smoothstep(r0 * 1.05, r0, len);
                cl = cos(ang + localTime * 2.0) * 0.5 + 0.5;
                
                float a = localTime * -1.0;
                vec2 pos = vec2(cos(a), sin(a)) * r0;
                d = distance(uvLocal, pos);
                v1 = light2(1.5, 5.0, d);
                v1 *= light1(1.0, 50.0 , d0);
                
                v2 = smoothstep(1.0, mix(uInnerRadius, 1.0, n0 * 0.5), len);
                v3 = smoothstep(uInnerRadius, mix(uInnerRadius, 1.0, 0.5), len);
                
                vec3 col = mix(uColor1, uColor2, cl);
                col = mix(uColor3, col, v0);
                col = (col + v1) * v2 * v3;
                col.rgb = clamp(col.rgb, 0.0, 1.0);
                
                _FragColor = extractAlpha(col);
            }

            void main() {
                vec2 fragCoord = vUv * iResolution.xy;
                vec2 uv = (fragCoord * 2.0 - iResolution.xy) / iResolution.y;
                vec4 col;
                draw(col, uv);
                vec3 bg = uBgColor;
                gl_FragColor.rgb = mix(bg, col.rgb, col.a); 
                gl_FragColor.a = 1.0;
            }
        `;

        function init() {
            const container = document.getElementById('container');
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            scene = new THREE.Scene();
            const geometry = new THREE.PlaneGeometry(2, 2);

            material = new THREE.ShaderMaterial({
                uniforms: {
                    iTime: { value: 0.0 },
                    iResolution: { value: new THREE.Vector3() },
                    uNoiseScale: { value: 0.65 },
                    uInnerRadius: { value: 0.6 },
                    uColor1: { value: new THREE.Color('#9c43fe') },
                    uColor2: { value: new THREE.Color('#4cc2e9') },
                    uColor3: { value: new THREE.Color('#101499') },
                    uBgColor: { value: new THREE.Color('#000000') },
                    uTimeScale: { value: 1.0 }
                },
                vertexShader: vertexShader,
                fragmentShader: fragmentShader
            });

            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            onWindowResize();
            window.addEventListener('resize', onWindowResize);
            setupUI();
        }
        
        function setupUI() {
            const panel = document.getElementById('control-panel');
            const header = document.getElementById('panel-header');
            const body = document.getElementById('panel-body');
            const colBtn = document.getElementById('collapse-btn');

            // 1. 滑杆绑定
            const sliders = [
                { id: 'sl-noiseScale', uniform: 'uNoiseScale', valId: 'val-noiseScale', fixed: 2 },
                { id: 'sl-innerRadius', uniform: 'uInnerRadius', valId: 'val-innerRadius', fixed: 2 },
                { id: 'sl-timeScale', uniform: 'uTimeScale', valId: 'val-timeScale', fixed: 2 }
            ];

            sliders.forEach(s => {
                const el = document.getElementById(s.id);
                const valEl = document.getElementById(s.valId);
                el.addEventListener('input', (e) => {
                    const v = parseFloat(e.target.value);
                    material.uniforms[s.uniform].value = v;
                    valEl.textContent = v.toFixed(s.fixed);
                });
            });

            // 2. 颜色选择器绑定
            const colors = [
                { id: 'clr-color1', uniform: 'uColor1' },
                { id: 'clr-color2', uniform: 'uColor2' },
                { id: 'clr-color3', uniform: 'uColor3' },
                { id: 'clr-bgColor', uniform: 'uBgColor' }
            ];

            colors.forEach(c => {
                const el = document.getElementById(c.id);
                el.addEventListener('input', (e) => {
                    material.uniforms[c.uniform].value.set(e.target.value);
                });
            });

            // 3. 折叠逻辑
            let isCollapsed = false;
            colBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                isCollapsed = !isCollapsed;
                if (isCollapsed) {
                    body.style.maxHeight = '0px';
                    body.style.paddingTop = '0';
                    body.style.paddingBottom = '0';
                    body.style.opacity = '0';
                    colBtn.textContent = '+';
                } else {
                    body.style.maxHeight = '600px';
                    body.style.paddingTop = '18px';
                    body.style.paddingBottom = '18px';
                    body.style.opacity = '1';
                    colBtn.textContent = '−';
                }
            });

            // 4. 拖拽逻辑
            let isDragging = false, startX, startY, initLeft, initTop;
            header.addEventListener('mousedown', (e) => {
                if (e.target === colBtn) return;
                isDragging = true;
                startX = e.clientX; startY = e.clientY;
                const rect = panel.getBoundingClientRect();
                initLeft = rect.left; initTop = rect.top;
                panel.style.right = 'auto';
                panel.style.transition = 'none';
            });
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                let nx = initLeft + e.clientX - startX;
                let ny = initTop + e.clientY - startY;
                nx = Math.max(0, Math.min(nx, window.innerWidth - panel.offsetWidth));
                ny = Math.max(0, Math.min(ny, window.innerHeight - 50));
                panel.style.left = nx + 'px';
                panel.style.top = ny + 'px';
            });
            window.addEventListener('mouseup', () => {
                isDragging = false;
                panel.style.transition = '';
            });

            // 5. Alt+N 隐藏/显示
            let isVisible = false; // 默认隐藏
            window.addEventListener('keydown', (e) => {
                if (e.altKey && e.key.toLowerCase() === 'n') {
                    e.preventDefault();
                    isVisible = !isVisible;
                    if (isVisible) {
                        panel.style.opacity = '1';
                        panel.style.pointerEvents = 'auto';
                        panel.style.transform = 'translateX(0)';
                    } else {
                        panel.style.opacity = '0';
                        panel.style.pointerEvents = 'none';
                        panel.style.transform = 'translateX(20px)';
                    }
                }
            });
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.iResolution.value.set(window.innerWidth, window.innerHeight, 1);
        }

        function animate() {
            requestAnimationFrame(animate);
            material.uniforms.iTime.value = performance.now() / 1000;
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>

<!-- 应用到导航页 悬浮按钮（由 inject_apply_button.py 注入） -->

<script>
function __applyToNav__() {
  var file = 'a22.html';
  localStorage.setItem('bgChoice', file);
  var btn = document.getElementById('__apply-btn__');
  btn.textContent = '✔ 已应用！';
  btn.style.background = '#1a7f37';
  setTimeout(function() {
    btn.textContent = '✓ 应用到导航页';
    btn.style.background = '#238636';
  }, 2000);
}
</script>

<!-- BG_PARAM_PERSIST -->
<script>
(function(){
  var FILE = 'a22.html';
  var KEY = 'bgParams:' + FILE;
  var __restoring = false;
  var __lastSaved = null;
  function allControls(){ return Array.prototype.slice.call(document.querySelectorAll('input,select,textarea')); }
  function serialize(){
    var d = {}, els = allControls();
    els.forEach(function(el){ if(el.id) d[el.id] = (el.type==='checkbox'||el.type==='radio') ? el.checked : el.value; });
    return d;
  }
  function save(){
    if (__restoring) return;                          // 恢复期间不写，避免触发 storage 死循环
    try{
      var s = JSON.stringify(serialize());
      if (s === __lastSaved) return;                  // 值没变就不写
      __lastSaved = s;
      localStorage.setItem(KEY, s);
    }catch(e){}
  }
  function restore(){
    __restoring = true;
    try{
      var d = JSON.parse(localStorage.getItem(KEY) || '{}');
      Object.keys(d).forEach(function(id){
        var el = document.getElementById(id); if(!el) return;
        if(el.type==='checkbox'||el.type==='radio') el.checked = !!d[id]; else el.value = d[id];
        try{ el.dispatchEvent(new Event('input',{bubbles:true})); }catch(e){}
        try{ el.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){}
      });
    }catch(e){}
    setTimeout(function(){ __restoring = false; }, 50);
  }
  document.addEventListener('input', save, true);
  document.addEventListener('change', save, true);
  window.addEventListener('load', function(){ restore(); setTimeout(restore, 700); setTimeout(restore, 1700); });
})();
</script>

</body>
