<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的导航</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --hover-bg: #334155;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
        }

        header {
            padding: 2rem 1rem;
            text-align: center;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--accent-color);
            letter-spacing: 0.1rem;
        }

        .navbar {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1.5rem;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .navbar button {
            background: transparent;
            border: 1px solid var(--hover-bg);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .navbar button:hover {
            background: var(--hover-bg);
            color: var(--text-primary);
        }

        .navbar button.active {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
            font-weight: 600;
        }

        .search-box {
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            border: 1px solid var(--hover-bg);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
        }

        .card:hover {
            transform: translateY(-4px);
            background: var(--hover-bg);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }

        .card img {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            object-fit: contain;
            background: #fff;
            padding: 4px;
        }

        .card .title {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        #tooltip {
            position: fixed;
            background: rgba(15, 23, 42, 0.95);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            max-width: 280px;
            pointer-events: none;
            z-index: 9999;
            display: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--accent-color);
            backdrop-filter: blur(4px);
        }

        @media (max-width: 640px) {
            .container {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                padding: 0 1rem 2rem;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>我的导航</h1>
    <nav class="navbar" id="nav"></nav>
</header>

<div class="search-box">
    <input type="text" id="search" placeholder="搜索书签...">
</div>

<main id="main" class="container"></main>

<div id="tooltip"></div>

<script id="data" type="application/json">
INSERT_DATA_HERE
</script>

<script>
    const data = JSON.parse(document.getElementById('data').textContent);
    const main = document.getElementById('main');
    const nav = document.getElementById('nav');
    const search = document.getElementById('search');
    const tooltip = document.getElementById('tooltip');

    let currentCategory = null;

    // 初始化分类导航
    if (data.categories && data.categories.length > 0) {
        data.categories.forEach((cat, index) => {
            const btn = document.createElement('button');
            btn.textContent = cat.title;
            btn.onclick = () => switchCategory(cat.title, btn);
            if (index === 0) {
                btn.classList.add('active');
                currentCategory = cat.title;
            }
            nav.appendChild(btn);
        });
    }

    function switchCategory(title, btn) {
        document.querySelectorAll('.navbar button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = title;
        render();
    }

    function render(filter = '') {
        main.innerHTML = '';
        const cat = data.categories.find(c => c.title === currentCategory);
        if (!cat) return;

        const itemsToRender = filter 
            ? cat.items.filter(it => it.title.toLowerCase().includes(filter.toLowerCase()))
            : cat.items;

        itemsToRender.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => window.open(item.url, '_blank');
            
            const hostname = (() => { try { return new URL(item.url).hostname; } catch(e) { return ''; } })();
            const iconUrl = item.icon || (hostname ? `https://www.google.com/s2/favicons?domain=${hostname}&sz=64` : '');
            const imgTag = iconUrl
                ? `<img src="${iconUrl}" onerror="this.style.visibility='hidden'" alt="">`
                : `<div style="width:64px;height:64px;margin-bottom:1rem;border-radius:0.5rem;background:#334155;display:flex;align-items:center;justify-content:center;font-size:1.5rem;">🔗</div>`;
            
            card.innerHTML = `
                ${imgTag}
                <div class="title">${item.title}</div>
            `;

            card.addEventListener('mouseenter', (e) => {
                const desc = item.hover || '';
                const urlLine = item.url;
                tooltip.innerHTML = `<div style="color:var(--accent-color);font-size:0.8rem;margin-bottom:4px;word-break:break-all;">${urlLine}</div>${desc ? `<div>${desc}</div>` : ''}`;
                tooltip.style.display = 'block';
                updateTooltipPos(e);
            });

            card.addEventListener('mousemove', updateTooltipPos);

            card.addEventListener('mouseleave', () => {
                tooltip.style.display = 'none';
            });

            main.appendChild(card);
        });
    }

    function updateTooltipPos(e) {
        const x = e.clientX + 15;
        const y = e.clientY + 15;
        
        // 防止超出右侧边界
        if (x + tooltip.offsetWidth > window.innerWidth) {
            tooltip.style.left = (e.clientX - tooltip.offsetWidth - 15) + 'px';
        } else {
            tooltip.style.left = x + 'px';
        }
        
        // 防止超出底部边界
        if (y + tooltip.offsetHeight > window.innerHeight) {
            tooltip.style.top = (e.clientY - tooltip.offsetHeight - 15) + 'px';
        } else {
            tooltip.style.top = y + 'px';
        }
    }

    search.addEventListener('input', (e) => {
        render(e.target.value);
    });

    // 初始渲染
    render();
</script>

</body>
</html>
